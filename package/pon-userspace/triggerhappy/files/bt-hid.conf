# /etc/triggerhappy/triggers.d/bt-hid.conf
#
# 蓝牙键盘 / 鼠标 / 遥控器的默认按键映射。
# 格式：<事件名> <类型> <命令>   （类型 1 = 按下，2 = 长按重复）
# 所有动作统一交给 /usr/bin/bt-keyaction <动作名>，
# 动作名对应 /etc/config/bt-keys 里的同名 section（option cmd = 实际命令）。

# 播放控制（耳机 / 遥控常用）
KEY_PLAYPAUSE	1	/usr/bin/bt-keyaction playpause
KEY_PLAYPAUSE	2	/usr/bin/bt-keyaction playpause
KEY_NEXTSONG	1	/usr/bin/bt-keyaction next
KEY_PREVSONG	1	/usr/bin/bt-keyaction prev

# 音量
KEY_VOLUMEUP	1	/usr/bin/bt-keyaction volup
KEY_VOLUMEUP	2	/usr/bin/bt-keyaction volup
KEY_VOLUMEDOWN	1	/usr/bin/bt-keyaction voldown
KEY_VOLUMEDOWN	2	/usr/bin/bt-keyaction voldown
KEY_MUTE	1	/usr/bin/bt-keyaction mute

# 遥控器方向键 / 确认 / 返回 / 主页
KEY_UP		1	/usr/bin/bt-keyaction up
KEY_DOWN	1	/usr/bin/bt-keyaction down
KEY_LEFT	1	/usr/bin/bt-keyaction left
KEY_RIGHT	1	/usr/bin/bt-keyaction right
KEY_ENTER	1	/usr/bin/bt-keyaction ok
KEY_KPENTER	1	/usr/bin/bt-keyaction ok
KEY_BACK	1	/usr/bin/bt-keyaction back
KEY_HOME		1	/usr/bin/bt-keyaction home

# 电源键（默认只记日志，防止误触重启）
KEY_POWER	1	/usr/bin/bt-keyaction power
