name: Build PonWrt (ZN504XG-D & HG5585F)

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload firmware to GitHub Releases'
        required: false
        default: 'true'
        type: boolean
      cache_mode:
        description: '编译缓存模式 (使用缓存 / 重新编译 / 不使用缓存)'
        required: false
        default: '使用缓存'
        type: choice
        options:
          - '使用缓存'
          - '重新编译'
          - '不使用缓存'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    name: Build ZN504XG-D & HG5585F
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full pahole patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-zn504-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-zn504-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare custom packages
        run: |
          bash ./scripts/customize.sh

      - name: Restore compiler ccache
        if: ${{ github.event.inputs.cache_mode || '使用缓存' }} != '不使用缓存'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ponwrt-ccache-zn504-${{ hashFiles('configs/*.config') }}-${{ github.sha }}
          restore-keys: |
            ponwrt-ccache-zn504-${{ hashFiles('configs/*.config') }}-
            ponwrt-ccache-zn504-

      - name: Configure for ZN504XG-D
        run: |
          ./scripts/kconfig.pl + \
            configs/an7581.config \
            configs/release.config > .config
          sed -i '/^CONFIG_KERNEL_DEBUG_INFO_REDUCED=/d' .config
          printf 'CONFIG_KERNEL_DEBUG_INFO=y\n# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set\nCONFIG_KERNEL_DEBUG_INFO_BTF=y\nCONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y\nCONFIG_KERNEL_MODULE_ALLOW_BTF_MISMATCH=y\nCONFIG_KERNEL_KPROBES=y\nCONFIG_KERNEL_BPF_EVENTS=y\n' >> .config
          if [ "${{ github.event.inputs.cache_mode || '使用缓存' }}" != "不使用缓存" ]; then
            sed -i '/^CONFIG_DEVEL=/d; /^CONFIG_CCACHE=/d' .config
            printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
          fi
          make defconfig

      - name: Download package sources
        run: make download -j"$(nproc)"

      - name: Compile firmware
        run: |
          [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -z || true
          make -j"$(nproc)" || make -j1 V=s

      - name: Save compiler ccache
        if: always() && (${{ github.event.inputs.cache_mode || '使用缓存' }} != '不使用缓存')
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ponwrt-ccache-zn504-${{ hashFiles('configs/*.config') }}-${{ github.sha }}

      - name: Show compiler cache statistics
        if: always() && (${{ github.event.inputs.cache_mode || '使用缓存' }} != '不使用缓存')
        run: |
          [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -s || true

      - name: Organize output files
        run: |
          mkdir -p output
          find bin/targets/airoha/an7581/ -type f \( -name "*zn504*" -o -name "*hg5585f-ct*" -o -name "*hg5585f-cu*" \) ! -name "*usb-sfp*" \( -name "*sysupgrade.itb" -o -name "*recovery.itb" -o -name "*manifest" \) -exec cp {} output/ \;
          cd output
          for file in $(ls * 2>/dev/null); do
            [ -f "$file" ] && sha256sum "$file" > "${file}.sha256"
          done
          echo "=== Generated Firmware Artifacts ==="
          ls -lh
          echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-ZN504-HG5585F-enhanced-firmware
          path: output/*
          retention-days: 14

      - name: Generate release tag
        id: tag
        if: github.event.inputs.upload_release != 'false'
        run: |
          echo "release_tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload firmware to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event.inputs.upload_release != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: PonWrt ZN504XG-D & HG5585F 聚合增强固件 (${{ steps.tag.outputs.release_tag }})
          body: |
            ## 🌟 相比前一版本（v2026.11.17-0850）的核心更新与变化

            ### 1. 内核 eBPF CO-RE 与 BTF 类型信息闭环（Linux 6.18）
            - **完整启用内核与模块 BTF 支持**：
              - 在 `target/linux/airoha/an7581/config-6.18`、`an7583/config-6.18` 与构建配置中开启 `CONFIG_DEBUG_INFO_BTF=y`、`CONFIG_DEBUG_INFO_BTF_MODULES=y` 及 `CONFIG_BPF_EVENTS=y`，并在 CI 构建链路中集成 `dwarves`（`pahole`）。
              - 固件原生生成 `/sys/kernel/btf/vmlinux` 与内核模块 BTF 段，开箱支持 `honk` / `dae` 等基于 eBPF CO-RE 的透明代理程序运行。

            ### 2. 上游核心驱动与硬件卸载修复集成（源自 `pbs05/ponwrt`）
            - **桥接流表与 PPE 硬件卸载保护 TTL / IPv6 Hop Limit（PR #82）**：
              - 合入 `951-01-netfilter-preserve-bridge-fastpath-hop-limits.patch` 与 `951-02-net-airoha-preserve-bridge-ttl.patch`。
              - 在内核 `nf_flowtable` 与达发 `airoha_ppe` 驱动中区分二层桥接流与三层路由流，禁止硬件流表对 L2 桥接报文错误递减 IPv4 TTL 与 IPv6 Hop Limit，根治开启硬件流卸载后内网 IPv6 异常及 VLAN 桥接（如 IPTV）跳数被误扣的问题。
            - **AN7581 LAN/WAN 16K SRAM 动态拥塞门限初始化（PR #64）**：
              - 合入 `947-net-airoha-initialize-lan-sram-congestion.patch` 与 `947-net-airoha-initialize-wan-sram-congestion.patch`。
              - 为 AN7581 QDMA0 16K SRAM 描述符池初始化官方 SDK 拥塞丢包阈值曲线并激活 250us 硬件动态重算，消除 2.5G 突发至 1G 网口或高并发连接骤停瞬间的硬件队列尾丢包（`P0 CDM1` 拥塞丢包）。
            - **达发 NPU 固件缓存信息与 IPv6 元数据解析（PR #72）**：
              - 合入 `941-01-net-airoha-npu-expose-cached-firmware-info.patch` 与 `941-02-net-airoha-decode-ipv6-smac-metadata.patch`，通过 sysfs 暴露只读 NPU 固件版本及核心拓扑，增强 IPv6 硬件转发诊断能力。
            - **清理失效 APK 软件仓库源（PR #116）**：
              - 在 `an7581.config` / `an7583.config` 中禁用官方未提供索引的 `video`、`pon_drivers`、`pon_userspace` 源，消除运行 `apk update` 时的 404 报错。

            ### 3. 网络热插拔脚本纯净化
            - **还原 `98-pppoe-rps` 纯净职责**：
              - 移除 `/etc/hotplug.d/net/98-pppoe-rps` 中额外附加的硬编码 BT/P2P 端口绕过规则，仅保留核心网卡队列 RPS 多核软中断均衡配置。
          files: output/*
