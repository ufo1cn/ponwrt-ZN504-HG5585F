# 4K IPTV & Memory-Optimized Network Buffers (Airoha AN7581 / ZN504XG-D 423MB RAM)
# 修复 2MB 默认 Socket 陷阱，设置合理的默认与最大缓冲区（4MB 上限，256KB 默认）
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.core.rmem_default = 262144
net.core.wmem_default = 262144

net.ipv4.udp_mem = 4096 8192 16384
net.ipv4.udp_rmem_min = 4096
net.ipv4.udp_wmem_min = 4096
net.core.netdev_max_backlog = 10000
# 彻底禁用虚拟网卡多核 RPS 调度，避免跨核 IPI 与 TCP 乱序
#net.core.rps_sock_flow_entries = 32768

# 4MB TCP 读写缓冲区与 BBR 拥塞控制
net.ipv4.tcp_rmem = 4096 87380 4194304
net.ipv4.tcp_wmem = 4096 65536 4194304
net.ipv4.tcp_congestion_control = bbr

# 桥接流量绕过 Netfilter（减轻高码率 25Mbps+ IPTV 组播流的 Conntrack 连接跟踪负担，消除 CPU 抖动）
net.bridge.bridge-nf-call-iptables = 0
net.bridge.bridge-nf-call-ip6tables = 0
net.bridge.bridge-nf-call-arptables = 0

# ZRAM 与 423MB RAM 虚拟内存调度优化
vm.page-cluster = 0
vm.swappiness = 0
vm.vfs_cache_pressure = 150
vm.watermark_boost_factor = 0
vm.min_free_kbytes = 16384

# --- P2P/BT 高并发连接快速回收与 Conntrack 优化 ---
net.netfilter.nf_conntrack_tcp_timeout_established = 600
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 120
net.netfilter.nf_conntrack_max = 32768
net.netfilter.nf_conntrack_checksum = 0
net.netfilter.nf_conntrack_buckets = 16384
net.netfilter.nf_conntrack_expect_max = 16384

# --- BBRv3 必需的 FQ 队列与 TCP 延迟压制 ---
net.core.default_qdisc = fq
net.ipv4.tcp_slow_start_after_idle = 0
# 注释单流低延迟限速，防止大带宽吞吐受限
#net.ipv4.tcp_notsent_lowat = 16384
net.ipv4.tcp_fastopen = 3
fs.pipe-max-size = 1048576
