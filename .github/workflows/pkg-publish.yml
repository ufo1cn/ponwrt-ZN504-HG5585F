name: Publish packages to apk repository
# 把三条包构建工作流（incremental / legacy / extra）产出的 apk 统一搬进
# ufo1cn/ponwrt-apk-repo 的 repo 分支，按 ponwrt-k<kver>/<能力>/ 落位，并重建签名索引。
# 构建工作流本身不再 push apk-repo（避免三处各写一份推送/索引逻辑）。
#
# 硬校验（任何一条不过就停，不静默放行）：
#   1) 产物自带的 public-key.pem 指纹必须是固定私钥派生的那把；
#   2) 用 host apk 以 keys-dir 强制验签（不传 --allow-untrusted），验不过就列出包名。
#      ADB 包无法事后重签，验不过只能带着固定私钥重编。
run-name: 发布 apk ${{ inputs.groups }} / ${{ inputs.device }}${{ inputs.dry_run && '（dry-run）' || '' }}

on:
  workflow_dispatch:
    inputs:
      device:
        description: '用哪个机型的构建产物（ABI 相同，只影响可用的包集合）'
        type: choice
        options:
          - hg5585f-ct
          - hg5382a
          - both
        default: hg5585f-ct
      groups:
        description: '发布哪些分组（kmods=固件流程产出的 kmod apk）'
        type: choice
        options:
          - all
          - incremental
          - legacy
          - extra
          - kmods
        default: all
      fw_labels:
        description: 'kmods 分组取哪条固件入口 label：留空=按 idx_branch 推断（repo→all、repo-wed→wed）；也可显式写 all / wed / all,wed，允许在 master 上一次发布两分支产物'
        type: string
        default: ''
      source_runs:
        description: '指定源 run（格式 incremental=30,legacy=11,extra=12,kmods=15；留空=各取最近一次成功）'
        type: string
        default: ''
      idx_branch:
        description: '写哪个索引分支（repo=主线五台；repo-wed=WED 分支两台）'
        type: choice
        options:
          - repo
          - repo-wed
        default: repo
      kver:
        description: '内核版本（决定目录 ponwrt-k<kver>；留空=按源码树推断）'
        type: string
        default: ''
      prune:
        description: '先清空目标能力目录再写（true=仓库只留本次内容；false=覆盖同名、保留其它包）'
        type: boolean
        default: false
      dry_run:
        description: '只下载与验签，不写仓库'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# 与 fw-publish、apk-repo 的 reindex 共用同一把写锁（按索引分支区分）。
concurrency:
  group: apk-repo-write-${{ inputs.idx_branch }}
  cancel-in-progress: false

env:
  SRC_REPO: ${{ github.repository }}
  DST_REPO: ufo1cn/ponwrt-apk-repo
  IDX_BRANCH: ${{ inputs.idx_branch }}
  FIXED_PUB_SHA256: d557dca1a8b8d30b48f7e4b910908342789d389a52db3d7225c6b72840eda4ed

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source (configs / 内核版本推断)
        uses: actions/checkout@v4
        with:
          # 能力归类表与内核版本要按索引分支的源码树取：repo-wed 用 WED 分支
          ref: ${{ inputs.idx_branch == 'repo-wed' && 'feat/wed-npu-offload-6.18' || github.ref }}

      - name: Resolve publish plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV: ${{ inputs.device }}
          GROUPS: ${{ inputs.groups }}
          FW_LABELS: ${{ inputs.fw_labels }}
          RUNS: ${{ inputs.source_runs }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys

          REPO = os.environ['SRC_REPO']
          dev_in = os.environ['DEV']
          groups_in = os.environ['GROUPS']
          labels_in = (os.environ.get('FW_LABELS') or '').strip()
          runs_in = os.environ.get('RUNS', '').strip()
          idx = (os.environ.get('IDX_BRANCH') or 'repo').strip()
          # kmod 的 vermagic 只与内核 config 绑定：主线固件只能进 repo、WED 固件只能进 repo-wed
          EXPECT_LABEL = {'repo': 'all', 'repo-wed': 'wed'}.get(idx)
          if EXPECT_LABEL is None:
              print(f'::error::未知索引分支 {idx}（只支持 repo / repo-wed）', file=sys.stderr)
              sys.exit(1)

          DEVICES = ['hg5585f-ct', 'hg5382a'] if dev_in == 'both' else [dev_in]
          MAP = {
              'incremental': ('build-packages-incremental.yml', 'PonWrt-packages-'),
              'legacy': ('build-packages-legacy.yml', 'PonWrt-legacy-packages-'),
              'extra': ('build-packages-extra.yml', 'PonWrt-extra-packages-'),
          }
          # kmods 不来自包工作流，而是固件流程（fw-build.yml）里同一次构建产出的 kmod apk，
          # 产物名 PonWrt-firmware-<label>-r<run>，apk 在 artifact 的 kmods/ 目录下。
          # 统一入口：一次构建三机型，全部 kmod 在同一个 artifact 的 kmods/ 下，
          # 发布时按 configs/pon-feature-packages.txt 归类到 common/usb/wifi/bt，
          # 所以一条 label 就够，不再分 usb-wifi / usb / plain。
          FW_LABEL_MAP = {
              'all': ('fw-all.yml', 'all'),
              'wed': ('fw-all.yml', 'wed'),
          }
          pkg_groups = list(MAP)
          groups = pkg_groups + ['kmods'] if groups_in == 'all' else [groups_in]

          pinned = {}
          for kv in runs_in.replace(';', ',').split(','):
              if '=' in kv:
                  k, v = kv.split('=', 1)
                  pinned[k.strip()] = v.strip()

          def gh(*args):
              r = subprocess.run(['gh'] + list(args), capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stderr, file=sys.stderr)
                  sys.exit(1)
              return r.stdout

          def artifacts(run_id):
              raw = gh('api', f'repos/{REPO}/actions/runs/{run_id}/artifacts?per_page=100')
              return [a['name'] for a in json.loads(raw)['artifacts']]

          def pick_run(wf, want, pinned_id=None):
              if pinned_id:
                  names = artifacts(pinned_id)
                  hit = [n for n in names if n.startswith(want)]
                  return pinned_id, hit
              raw = gh('api', f'repos/{REPO}/actions/workflows/{wf}/runs?per_page=30&status=success')
              for r in json.loads(raw)['workflow_runs']:
                  names = artifacts(r['id'])
                  hit = [n for n in names if n.startswith(want)]
                  if hit:
                      return r['id'], hit
              return None, []

          plan = []
          for g in groups:
              if g == 'kmods':
                  if labels_in == '':
                      # 留空：按索引分支取默认 label（repo→all，repo-wed→wed）
                      labels = [EXPECT_LABEL]
                  else:
                      labels = [x.strip() for x in labels_in.split(',') if x.strip()]
                      if labels != [EXPECT_LABEL]:
                          # 显式指定时不再硬拦：master 上一次把两分支 kmod 都发出去是允许的，
                          # 只提示口径风险（主线固件与 WED 固件的 kmod vermagic 是否一致由来源 run 决定）。
                          print(f'::warning::索引分支 {idx} 默认 label={EXPECT_LABEL}，'
                                f'本次显式取 {",".join(labels)}（请确认来源 run 与分支匹配）', file=sys.stderr)
                  for label in labels:
                      if label not in FW_LABEL_MAP:
                          print(f'::error::未知固件入口 label：{label}', file=sys.stderr)
                          sys.exit(1)
                      wf, dev = FW_LABEL_MAP[label]
                      want = f'PonWrt-firmware-{label}-r'
                      run_id, hit = pick_run(wf, want, pinned.get('kmods') or pinned.get(label))
                      if not hit:
                          # groups=all 时固件还没跑出 kmods 就跳过整组；显式只发 kmods 则必须找到
                          if groups_in == 'kmods':
                              print(f'::error::kmods/{label}：找不到带 {want}* 产物的成功固件 run', file=sys.stderr)
                              sys.exit(1)
                          print(f'::warning::kmods/{label}：暂无带 {want}* 产物的成功固件 run，跳过', file=sys.stderr)
                          continue
                      plan.append({'group': 'kmods', 'device': label, 'fw_device': dev,
                                   'run_id': run_id, 'artifact': hit[0], 'workflow': wf})
                      print(f'>>> kmods/{label}（{dev}）: run={run_id} artifact={hit[0]}', file=sys.stderr)
                  continue

              wf, prefix = MAP[g]
              for dev in DEVICES:
                  want = f'{prefix}{dev}-'
                  run_id, hit = pick_run(wf, want, pinned.get(g))
                  if not hit:
                      print(f'::error::{g}/{dev}：找不到带 {want}* 产物的成功 run（指定 run 里也没有）', file=sys.stderr)
                      sys.exit(1)
                  plan.append({'group': g, 'device': dev, 'run_id': run_id, 'artifact': hit[0], 'workflow': wf})
                  print(f'>>> {g}/{dev}: run={run_id} artifact={hit[0]}', file=sys.stderr)

          with open('/tmp/plan.json', 'w', encoding='utf-8') as fh:
              json.dump(plan, fh, ensure_ascii=False, separators=(',', ':'))
          PY
          echo ">>> plan:"
          cat /tmp/plan.json

      - name: Install fixed apk signing key
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${APK_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::仓库未配置 APK_SIGNING_PRIVATE_KEY：发布端必须用同一把私钥签索引"
            exit 1
          fi
          printf '%s\n' "$APK_SIGNING_PRIVATE_KEY" > private-key.pem
          chmod 600 private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem
          got=$(sha256sum public-key.pem | cut -d' ' -f1)
          echo ">>> 私钥派生公钥指纹：$got"
          if [ "$got" != "$FIXED_PUB_SHA256" ]; then
            echo "::error::私钥派生公钥指纹 $got 与固定指纹不一致"
            exit 1
          fi

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p in
          while IFS= read -r row; do
            grp=$(echo "$row" | jq -r '.group')
            dev=$(echo "$row" | jq -r '.device')
            rid=$(echo "$row" | jq -r '.run_id')
            art=$(echo "$row" | jq -r '.artifact')
            echo ">>> 下载 $grp/$dev run=$rid $art"
            gh run download "$rid" -R "$SRC_REPO" -n "$art" -D "in/$grp-$dev"
          done < <(jq -c '.[]' /tmp/plan.json)
          find in -maxdepth 3 -type d | sort

      - name: Verify signing key and package signatures
        run: |
          set -uo pipefail
          shopt -s nullglob
          APKBIN=""
          bad=0
          allapks=()
          for d in in/*/; do
            gd=$(basename "$d")
            apks=( "$d"output/*.apk "$d"kmods/*.apk )
            allapks+=("${apks[@]}")
            echo ">>> $gd：${#apks[@]} 个 apk（output 与 kmods 各取一遍）"
            pem=""
            for cand in "$d"output/public-key.pem "$d"kmods/public-key.pem; do
              [ -f "$cand" ] && { pem="$cand"; break; }
            done
            if [ -n "$pem" ]; then
              got=$(sha256sum "$pem" | cut -d' ' -f1)
              if [ "$got" != "$FIXED_PUB_SHA256" ]; then
                echo "::error::$gd 的 public-key.pem（$pem）指纹 $got 与固定指纹不一致（这批包不是用现在的私钥签的）"
                bad=1
              else
                echo ">>> $gd 公钥指纹一致"
              fi
            else
              echo "::error::$gd 产物里没有 public-key.pem（output/ 与 kmods/ 都没有），无法核对签名密钥"
              bad=1
            fi
            if [ -z "$APKBIN" ] && [ -x "$d"pubtool/apk ]; then
              APKBIN="${d}pubtool/apk"
            fi
          done
          if [ "${#allapks[@]}" -eq 0 ]; then
            echo "::error::没有任何 apk 可发布（output/ 与 kmods/ 均为空）"
            exit 1
          fi
          if [ -z "$APKBIN" ]; then
            echo "::error::产物里没有 host apk（pubtool/apk）：请用改造后的工作流重跑一次包构建，再跑本工作流"
            exit 1
          fi
          chmod +x "$APKBIN"
          "$APKBIN" --version || true
          mkdir -p keys && cp -f public-key.pem keys/
          # 强制验签：不传 --allow-untrusted，keys-dir 里只有固定公钥
          if ! "$APKBIN" mkndx --root "$PWD/keys" --keys-dir "$PWD/keys" --output /tmp/verify.adb \
                "${allapks[@]}" 2>/tmp/verify.err; then
            echo "::error::签名校验失败：以下包不是用固定私钥签的（ADB 包无法事后重签，只能重编）"
            sed -n '1,200p' /tmp/verify.err
            exit 1
          fi
          echo ">>> 全部 apk 通过固定公钥验签（${#allapks[@]} 个）"
          if [ "$bad" != "0" ]; then
            echo "::error::公钥核对未通过，停止发布"
            exit 1
          fi

      - name: Resolve kernel version
        id: kver
        env:
          KVER_IN: ${{ inputs.kver }}
        run: |
          set -uo pipefail
          KVER="${KVER_IN:-}"
          if [ -z "$KVER" ]; then
            pv=$(awk -F':=' '/^KERNEL_PATCHVER/ {print $2; exit}' target/linux/airoha/Makefile | tr -d '[:space:]')
            suf=$(awk -v p="$pv" '$1=="LINUX_VERSION-"p {gsub(/ /,"",$3); print $3; exit}' "target/linux/generic/kernel-$pv" 2>/dev/null || true)
            KVER="${pv}${suf}"
          fi
          [ -n "$KVER" ] || { echo "::error::无法确定内核版本"; exit 1; }
          echo ">>> 目标目录 ponwrt-k$KVER"
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"

      - name: Stage apks by device capability
        run: |
          set -uo pipefail
          # 注意：这里绝不能开 nullglob。归类表里写的是通配符本身（kmod-usb-*），
          # 一旦 nullglob 生效，"for p in $pats" 里没匹配到文件名的模式会被整个吞掉，
          # 结果所有包静默落进 common（run 2 就是 common=460 这么来的）。
          FEAT_FILE="configs/pon-feature-packages.txt"
          # 能力归类表是"机型能看到哪些包"的唯一依据：缺了就会把所有包塞进 common，
          # 机型的能力目录源永远是空的（装包时报"找不到软件"），所以缺文件直接失败。
          [ -f "$FEAT_FILE" ] || { echo "::error::缺少能力归类表 $FEAT_FILE"; exit 1; }
          feature_of() {
            local b feat pats p
            b=$(basename "$1")
            while IFS='|' read -r feat pats; do
              case "$feat" in ''|'#'*) continue ;; esac
              # 用数组接模式，避免任何 glob 展开把模式当文件名处理
              local -a PP
              read -r -a PP <<< "$pats"
              for p in "${PP[@]}"; do
                case "$b" in $p) echo "$feat"; return ;; esac
              done
            done < "$FEAT_FILE"
            echo common
          }
          # 自检：归类函数必须真的能把一个已知 usb 包判成 usb，否则后面全是错的
          probe=$(feature_of "kmod-usb-storage-0.0.0-r0.apk")
          if [ "$probe" != "usb" ]; then
            echo "::error::归类函数自检失败（kmod-usb-storage 判为 $probe），归类表或匹配逻辑不可用"
            exit 1
          fi
          probe=$(feature_of "kmod-rtw88-0.0.0-r0.apk")
          if [ "$probe" != "usb" ] && [ "$probe" != "wifi" ]; then
            echo "::error::归类函数自检失败（kmod-rtw88 判为 $probe）"
            exit 1
          fi
          rm -rf stage && mkdir -p stage
          : > /tmp/dup-same-name.txt
          declare -A sha_of src_of dir_of
          for f in in/*/output/*.apk in/*/kmods/*.apk; do
            [ -f "$f" ] || continue
            b=$(basename "$f"); src=$(echo "$f" | cut -d/ -f2)
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            if [ -n "${sha_of[$b]:-}" ] && [ "${sha_of[$b]}" != "$sha" ]; then
              echo "::warning::同名不同内容 $b：${src_of[$b]} -> $src（按 plan 顺序后到覆盖）"
              printf '%s\t%s\t%s\n' "$b" "${src_of[$b]}" "$src" >> /tmp/dup-same-name.txt
            fi
            sha_of[$b]="$sha"; src_of[$b]="$src"
            feat=$(feature_of "$f")
            [ "$feat" = "common" ] || dir_of[$b]="$feat"
            mkdir -p "stage/$feat"
            cp -f "$f" "stage/$feat/"
          done

          # 反查校验（防止归类表读不到/规则写错导致"全都进 common"）：
          #   ① 命中能力规则的包不允许落在 common；② 未命中规则的包不允许落进能力目录；
          #   ③ 同一个包名不允许同时出现在两个能力目录（设备会从两个源拿到同名两份）。
          fail=0
          for d in stage/*/; do
            feat=$(basename "$d")
            for f in "$d"*.apk; do
              b=$(basename "$f"); expect=$(feature_of "$f")
              if [ "$expect" != "common" ] && [ "$feat" = "common" ]; then
                echo "::error::$b 命中能力 $expect 却落在 common"; fail=1
              fi
              if [ "$expect" = "common" ] && [ "$feat" != "common" ]; then
                echo "::error::$b 未命中任何能力规则却落在 $feat"; fail=1
              fi
            done
          done
          for b in "${!dir_of[@]}"; do
            n=$(ls -d stage/*/"$b" 2>/dev/null | wc -l)
            if [ "$n" -gt 1 ]; then echo "::error::$b 同时出现在多个能力目录"; fail=1; fi
          done
          echo ">>> 分组结果：$(for d in stage/*/; do echo -n "$(basename "$d")=$(ls -1 "$d"*.apk | wc -l) "; done)"
          if [ -s /tmp/dup-same-name.txt ]; then
            echo ">>> 同名不同内容（按 plan 顺序后者覆盖，已记录）："
            sed 's/^/    /' /tmp/dup-same-name.txt
          fi
          exit $fail

      - name: Publish to apk repository
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::未配置 APK_REPO_TOKEN，无法写入 $DST_REPO"
            exit 1
          fi
          APKBIN=""
          for c in in/*/pubtool/apk; do
            if [ -x "$c" ]; then APKBIN="$c"; break; fi
          done
          [ -n "$APKBIN" ] || { echo "::error::找不到 host apk（pubtool/apk）"; exit 1; }
          chmod +x "$APKBIN"
          KVER="${{ steps.kver.outputs.kver }}"
          GROUPS_IN="${{ inputs.groups }}"
          PRUNE="${{ inputs.prune }}"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${DST_REPO}.git"
          rm -rf repo
          if ! git clone --depth=1 --branch "$IDX_BRANCH" "$REPO_URL" repo 2>/tmp/clone.err; then
            git clone --depth=1 "$REPO_URL" repo
            git -C repo checkout -b "$IDX_BRANCH"
          fi
          git -C repo config user.email ci@ponwrt
          git -C repo config user.name ponwrt-ci

          # 公钥是设备侧信任锚，必须与本次签名一致
          if [ -f repo/public-key.pem ]; then
            old=$(sha256sum repo/public-key.pem | cut -d' ' -f1)
            if [ "$old" != "$FIXED_PUB_SHA256" ]; then
              echo ">>> 仓库里的 public-key.pem 与固定公钥不一致，更新"
              cp -f public-key.pem repo/public-key.pem
            fi
          else
            cp -f public-key.pem repo/public-key.pem
          fi

          # 内核魔数清理：固件流产出的 kmod 与内核 vermagic 强绑定（每个 kmod 的 depends 里
          # 都带 kernel=<内核版本>~<魔数>-r1），内核版本或内核配置一变，旧 kmod 全部装不上。
          # 所以发布 kmods（或 groups=all 一并发）时，先把目标内核目录下所有 kmod-*.apk 清掉，
          # 再由本次构建的 kmod 覆盖回来：本次没编出来的 kmod 就此消失，仓库里只留匹配当前内核的。
          # 非内核包（应用/lib/固件）不动，历史固件的 kmod 仍在对应 Release 的 kmods-all-rNN 里。
          if [ "$GROUPS_IN" = "kmods" ] || [ "$GROUPS_IN" = "all" ]; then
            for d in repo/aarch64_cortex-a53/ponwrt-k${KVER}/*/; do
              [ -d "$d" ] || continue
              feat=$(basename "$d")
              n=$(ls -1 "$d"kmod-*.apk 2>/dev/null | wc -l)
              if [ "$n" -gt 0 ]; then
                rm -f "$d"kmod-*.apk
                echo ">>> 内核魔数清理：ponwrt-k${KVER}/$feat 删除 $n 个旧 kmod（本次构建重新写入）"
              fi
            done
          fi

          for d in stage/*/; do
            feat=$(basename "$d")
            DEST="repo/aarch64_cortex-a53/ponwrt-k${KVER}/$feat"
            mkdir -p "$DEST"
            if [ "$PRUNE" = "true" ]; then
              echo ">>> prune：清空 ponwrt-k${KVER}/$feat"
              rm -f "$DEST"/*.apk "$DEST/packages.adb" "$DEST/SHA256SUMS"
            fi
            for f in "$d"*.apk; do
              b=$(basename "$f")
              if [ -f "$DEST/$b" ]; then
                old=$(sha256sum "$DEST/$b" | cut -d' ' -f1)
                new=$(sha256sum "$f" | cut -d' ' -f1)
                if [ "$old" = "$new" ]; then echo "    相同，跳过 $b"; continue; fi
                echo "    覆盖 $b（内容不同）"
              fi
              cp -f "$f" "$DEST/"
            done
          done

          # 逐能力重建索引：对目录里真实存在的 apk 全量做，索引与内容永远一致。
          # 注意遍历的是仓库里已存在的目录（不是本次 stage 的目录）：kmods 清理可能把某个
          # 能力目录的 kmod 删空，这种目录同样必须重建索引/SHA256SUMS，否则索引指向已删除的包。
          for DEST in repo/aarch64_cortex-a53/ponwrt-k${KVER}/*/; do
            [ -d "$DEST" ] || continue
            feat=$(basename "$DEST")
            apks=( "$DEST"*.apk )
            if [ ${#apks[@]} -eq 0 ]; then
              rm -f "$DEST/packages.adb" "$DEST/SHA256SUMS"
              echo ">>> ponwrt-k${KVER}/$feat：已无 apk，删除索引"
              continue
            fi
            if ! "$APKBIN" mkndx --root "$PWD/keys" --keys-dir "$PWD/keys" \
                 --sign "$PWD/private-key.pem" --output "$DEST/packages.adb" "${apks[@]}" 2>"/tmp/idx-$feat.err"; then
              cat "/tmp/idx-$feat.err"
              echo "::error::$feat 索引生成/签名失败"
              exit 1
            fi
            ( cd "$DEST" && sha256sum ./*.apk > SHA256SUMS )
            echo ">>> ponwrt-k${KVER}/$feat：$(ls -1 "$DEST"/*.apk | wc -l) 个 apk，索引 $(stat -c%s "$DEST/packages.adb") 字节"
          done

          git -C repo add -A
          if git -C repo diff --cached --quiet; then
            echo ">>> 与仓库现状一致，无需提交"
            exit 0
          fi
          git -C repo commit -m "publish: run=${{ github.run_number }} dev=${{ inputs.device }} groups=${{ inputs.groups }} k=$KVER"
          pushed=0
          for i in 1 2 3; do
            if git -C repo push origin "$IDX_BRANCH"; then pushed=1; break; fi
            echo ">>> 推送被拒，第 $i 次 rebase 重试"
            git -C repo fetch origin "$IDX_BRANCH" && git -C repo rebase "origin/$IDX_BRANCH" || true
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::推送 apk 仓库失败"
            exit 1
          fi
          echo ">>> 已发布：https://github.com/$DST_REPO/tree/$IDX_BRANCH/aarch64_cortex-a53/ponwrt-k${KVER}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### apk 发布结果"
            echo ""
            echo "| 分组 | 设备 | 源 run | 产物 |"
            echo "|---|---|---|---|"
            jq -r '.[] | "| \(.group) | \(.device) | \(.run_id) | \(.artifact) |"' /tmp/plan.json 2>/dev/null || true
            echo ""
            if [ -d stage ]; then
              echo "分组目录："
              echo '```'
              for d in stage/*/; do echo "$(basename "$d"): $(ls -1 "$d"*.apk 2>/dev/null | wc -l) 个"; done
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
