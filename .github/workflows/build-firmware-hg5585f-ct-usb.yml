name: Build PonWrt HG5585F-CT (USB 全驱动) manual

# ==============================================================================
# 本文件由本仓库的 build-firmware-manual.yml（HG5585F-CT & HG5382A 双机型）派生，
# 只保留 HG5585F-CT 单机型，并把整条 USB 驱动栈全部编进镜像（=y），
# 供后续复制进来的软件包（USB 串口/网卡/存储/摄像头/声卡/蓝牙/USB 无线网卡…）
# 直接拿到内核侧支持，不再需要单独装 kmod 包。
#
# 与原文件的差异（只做加法，不放宽任何校验）：
#   1) 触发方式：只保留 workflow_dispatch；去掉 devices 输入（固定 hg5585f-ct）；
#   2) 配置：仍然 = configs/an7581.config + configs/release.config；
#      在其之后追加完整 USB 驱动包清单（USB_PKGS，全部 =y 进镜像）；
#   3) 顺序：先写包清单 → make defconfig → 再锁机型（defconfig 会重算，
#      机型锁定必须在 defconfig 之后，且之后不再 defconfig —— 历史坑）；
#   4) 预检：开跑前逐个核对每个包是否真的落在 .config= y，并把「该树没有这个包」
#      与「被依赖挡住」分开报出来，缺一个立即失败（防静默丢弃，不靠删校验变绿）；
#   5) 产物：只收集 *hg5585f-ct* 的 sysupgrade.itb / recovery.itb / manifest，
#      并对 sysupgrade 做存在性硬校验；
#   6) 未改动：依赖安装、feeds、customize.sh、包源码下载、编译命令、ccache、
#      sha256、Artifact、Release 流程。
#
# 为什么单独列提供者包（踩过的坑）：
#   · kmod-usb-audio 的 snd-usb-audio.ko modinfo 依赖 mc.ko，
#     提供者是 kmod-media-controller（drivers/media/mc/mc.ko）；
#     手写 .config 时若没选提供者，打包阶段直接报
#     "Package kmod-usb-audio is missing dependencies for the following libraries: mc.ko"。
#   · kmod-usb-hid 依赖 kmod-hid / kmod-hid-generic / input-support，
#     kmod-usb-printer 依赖 printer-support，kmod-sound-core 依赖 audio-support（虚拟包，
#     由 package/system/hardware-support 提供），这些一并显式写 =y。
#   · kmod-rtw88-8723du 依赖 rtw88_8723d.ko / rtw88_8723x.ko 的提供者包，
#     kmod-rtl8192cu 依赖 rtl8192cu-firmware，故提供者与固件全部列入。
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload firmware to GitHub Releases'
        required: false
        default: 'true'
        type: boolean
      cache_mode:
        description: '编译缓存模式 (使用缓存 / 重新编译 / 不使用缓存)'
        required: false
        default: '使用缓存'
        type: choice
        options:
          - '使用缓存'
          - '重新编译'
          - '不使用缓存'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_MAXSIZE: 5G
  # USB 驱动全量清单（全部 =y 编进镜像）
  USB_PKGS: >-
    kmod-usb-core kmod-usb-common kmod-usb2 kmod-usb3
    kmod-usb-xhci-hcd kmod-usb-xhci-mtk
    kmod-scsi-core kmod-usb-storage kmod-usb-storage-uas kmod-usb-storage-extras
    kmod-fs-ext4 kmod-fs-vfat kmod-fs-exfat kmod-fs-ntfs3 kmod-fs-cifs
    kmod-usb-serial kmod-usb-serial-ch341 kmod-usb-serial-ch348
    kmod-usb-serial-cp210x kmod-usb-serial-ftdi kmod-usb-serial-pl2303
    kmod-usb-serial-option kmod-usb-serial-wwan
    kmod-usb-acm kmod-usb-wdm
    kmod-usb-net kmod-usb-net-cdc-ether kmod-usb-net-cdc-ncm kmod-usb-net-cdc-eem
    kmod-usb-net-rndis kmod-usb-net-cdc-mbim kmod-usb-net-qmi-wwan
    kmod-usb-net-rtl8152 kmod-usb-net-asix kmod-usb-net-asix-ax88179
    kmod-usb-net-lan78xx kmod-usb-net-smsc95xx kmod-usb-net-aqc111 kmod-usb-net-ipheth
    kmod-hid kmod-hid-generic input-support
    kmod-usb-hid printer-support kmod-usb-printer
    audio-support kmod-input-core kmod-sound-core kmod-usb-audio
    video-support kmod-media-controller kmod-lib-rational kmod-dma-buf
    kmod-video-core kmod-video-videobuf2 kmod-video-vmalloc kmod-video-uvc
    kmod-bluetooth kmod-btusb kmod-btbcm kmod-btmtk kmod-hci-uart
    kmod-rtw88 kmod-rtw88-usb kmod-rtw88-8822c kmod-rtw88-8822cu
    kmod-rtw88-8821c kmod-rtw88-8821cu
    kmod-rtw88-8723x kmod-rtw88-8723d kmod-rtw88-8723du
    kmod-rtw88-8822bu kmod-rtw88-8812au
    kmod-rtl8xxxu kmod-rtlwifi-usb kmod-rtl8192c-common kmod-rtl8192cu
    r8152-firmware rtl8192cu-firmware rtl8822ce-firmware rtl8821ce-firmware
    rtl8723bu-firmware rtl8723de-firmware
    kmod-usbip kmod-usbip-client kmod-usbip-server kmod-usbmon
    usbutils usbids usbmode usb-modeswitch

jobs:
  build:
    name: Build HG5585F-CT with full USB drivers
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full pahole patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-hg5585f-ct-usb-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-hg5585f-ct-usb-
            ponwrt-dl-zn504-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare custom packages
        run: |
          bash ./scripts/customize.sh

      - name: Restore compiler ccache
        if: inputs.cache_mode != '不使用缓存'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ponwrt-ccache-hg5585f-ct-usb-${{ hashFiles('configs/*.config') }}-${{ github.sha }}
          restore-keys: |
            ponwrt-ccache-hg5585f-ct-usb-${{ hashFiles('configs/*.config') }}-
            ponwrt-ccache-hg5585f-ct-usb-
            ponwrt-ccache-zn504-

      - name: Configure for HG5585F-CT with full USB driver stack
        run: |
          ./scripts/kconfig.pl + \
            configs/an7581.config \
            configs/release.config > .config

          sed -i '/^CONFIG_KERNEL_DEBUG_INFO_REDUCED=/d' .config
          printf 'CONFIG_KERNEL_DEBUG_INFO=y\n# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set\nCONFIG_KERNEL_DEBUG_INFO_BTF=y\nCONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y\nCONFIG_KERNEL_MODULE_ALLOW_BTF_MISMATCH=y\nCONFIG_KERNEL_KPROBES=y\nCONFIG_KERNEL_BPF_EVENTS=y\n' >> .config
          if [ "${{ inputs.cache_mode }}" != "不使用缓存" ]; then
            sed -i '/^CONFIG_DEVEL=/d; /^CONFIG_CCACHE=/d' .config
            printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
          fi

          # ------------------------------------------------------------------
          # USB 驱动栈：逐个写成 =y（先删同名旧行，含 "# ... is not set" 形态）
          # 内核侧符号由 kmod 包的 KCONFIG 负责抬成 =m，这里不手写内核符号。
          # ------------------------------------------------------------------
          echo ">>> 追加 USB 驱动包：$(echo $USB_PKGS | wc -w) 个"
          for p in $USB_PKGS; do
            sed -i "/^CONFIG_PACKAGE_${p}=/d; /^# CONFIG_PACKAGE_${p} is not set/d" .config
            printf 'CONFIG_PACKAGE_%s=y\n' "$p" >> .config
          done

          make defconfig

          # ------------------------------------------------------------------
          # 机型锁定（defconfig 之后，且之后不再 defconfig）
          # 只保留 fiberhome_hg5585f-ct，其它机型一律清掉。
          # ------------------------------------------------------------------
          echo ">>> 目标机型: fiberhome_hg5585f-ct"
          sed -i '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          sed -i '/^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.* is not set/d' .config
          sed -i '/^CONFIG_TARGET_airoha_an7581_DEVICE_/d' .config
          printf 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y\n' >> .config
          grep -q '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y' .config \
            || { echo "::error::机型符号未落地: CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y"; exit 1; }
          echo ">>> 机型锁定完成（未再执行 defconfig）"
          cp .config .config.usb-full

      - name: Preflight - verify every USB driver package really landed
        run: |
          mkdir -p logs
          ok=0
          blocked=""
          absent=""
          for p in $USB_PKGS; do
            if grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
              ok=$((ok + 1))
            elif grep -q "^# CONFIG_PACKAGE_${p} is not set$" .config; then
              blocked="${blocked} ${p}"
            else
              absent="${absent} ${p}"
            fi
          done

          echo ">>> 已落地 =y：${ok} / $(echo $USB_PKGS | wc -w)"
          {
            echo "| 包 | 结果 |"
            echo "|---|---|"
            for p in $USB_PKGS; do
              if grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
                echo "| ${p} | =y |"
              elif grep -q "^# CONFIG_PACKAGE_${p} is not set$" .config; then
                echo "| ${p} | 被依赖挡住（符号存在但没打开） |"
              else
                echo "| ${p} | 该树没有此包（名字写错或 feeds 未装） |"
              fi
            done
          } > logs/usb-kmod-check.txt
          cp .config .config.preflight
          cat logs/usb-kmod-check.txt

          fail=0
          if [ -n "$blocked" ]; then
            echo "::error::以下 USB 驱动包被依赖挡住（符号存在但没开）:${blocked}"
            fail=1
          fi
          if [ -n "$absent" ]; then
            echo "::error::以下包在本源码树里不存在（名字写错或 feeds 未安装）:${absent}"
            fail=1
          fi
          exit $fail

      - name: Download package sources
        run: make download -j"$(nproc)"

      - name: Compile firmware
        run: |
          [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -z || true
          make -j"$(nproc)" || make -j1 V=s

      - name: Save compiler ccache
        if: always() && inputs.cache_mode != '不使用缓存'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ponwrt-ccache-hg5585f-ct-usb-${{ hashFiles('configs/*.config') }}-${{ github.sha }}

      - name: Show compiler cache statistics
        if: always() && inputs.cache_mode != '不使用缓存'
        run: |
          [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -s || true

      - name: Organize output files
        run: |
          mkdir -p output
          find bin/targets/airoha/an7581/ -type f -name "*hg5585f-ct*" ! -name "*usb-sfp*" \
            \( -name "*sysupgrade.itb" -o -name "*recovery.itb" -o -name "*manifest" \) -exec cp {} output/ \;
          cd output
          for file in $(ls * 2>/dev/null); do
            [ -f "$file" ] && sha256sum "$file" > "${file}.sha256"
          done
          echo "=== Generated Firmware Artifacts ==="
          ls -lh
          echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV

      - name: Verify HG5585F-CT firmware exists
        run: |
          ls output/*hg5585f-ct*sysupgrade*.itb >/dev/null 2>&1 \
            || { echo "::error::缺少 HG5585F-CT 固件（预期 *hg5585f-ct*sysupgrade*.itb）"; exit 1; }
          echo ">>> 固件产物核对通过："
          ls -lh output/*hg5585f-ct*sysupgrade*.itb

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-hg5585f-ct-usb-r${{ github.run_number }}
          path: |
            output/*
            logs/usb-kmod-check.txt
          retention-days: 14

      - name: Generate release tag
        id: tag
        if: inputs.upload_release != 'false'
        run: |
          echo "release_tag=v$(date +'%Y.%m.%d-%H%M')-hg5585fct-usb" >> $GITHUB_OUTPUT

      - name: Upload firmware to GitHub Release
        uses: softprops/action-gh-release@v2
        if: inputs.upload_release != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: PonWrt HG5585F-CT USB 全驱动 ${{ steps.tag.outputs.release_tag }}
          body: |
            ## 本次手动构建（HG5585F-CT 单机型 + USB 全驱动）

            - 机型：HG5585F-CT（fiberhome_hg5585f-ct）
            - 配置来源：`configs/an7581.config` + `configs/release.config`
            - USB 驱动：`USB_PKGS` 清单全部 =y 编进镜像（usb-core/xhci、storage、
              serial、net、hid/printer、audio、video/UVC、bluetooth、rtw88/rtl8xxxu/
              rtl8192cu USB 无线网卡、usbip、固件 blob、usbutils/usbmode）
            - 内核与 kmod 同源树编译，ABI 与 `build-packages-incremental.yml` 的 apk 一致
            - 逐包落地清单见 Artifact 内 `logs/usb-kmod-check.txt`
          files: output/*
