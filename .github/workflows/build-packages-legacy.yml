name: Build Packages (legacy | 旧仓有、新仓无的用户态软件) manual

# ==============================================================================
# 只允许手动触发（workflow_dispatch）。
#
# 用途：旧仓 ufo1cn/PonWrt-HG5382A 有一批用户态软件，新仓 ufo1cn/ponwrt-ZN504-HG5585F
#       的清单里没有。这里在**新仓同一内核源码树**上重新编成 apk，签同一把固定私钥，
#       产物同时发布到本仓 prerelease 和 ufo1cn/ponwrt-apk-repo（长期软件仓库）。
#
# 清单：configs/pon-legacy-packages.txt
#   auto|<apk>|<required|optional>   —— auto 表示由本工作流解析源码目录
#   清单里已排除所有 kmod-* / 内核虚拟包 / sing-box / ksmbd-tools（理由见清单头注释）：
#   它们与固件内核 ABI 绑定或与镜像内组件重名，重编会冲突。
#
# 签名：固定私钥来自 secret APK_SIGNING_PRIVATE_KEY（与两个仓库所有工作流同一把），
#       公钥 sha256 = d557dca1a8b8d30b48f7e4b910908342789d389a52db3d7225c6b72840eda4ed
#       设备只需 /etc/apk/keys/public-key.pem 一次，之后所有包免 --allow-untrusted。
#
# 不发 release 到目标仓时的兜底：secret APK_REPO_TOKEN 缺失则只发本仓并告警。
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      device:
        description: '目标机型（决定 .config 里的设备锁定与 ABI）'
        required: true
        default: 'hg5585f-ct'
        type: choice
        options:
          - 'hg5585f-ct'
          - 'hg5382a'
      cache_mode:
        description: '缓存模式（完全重建会丢弃所有缓存）'
        required: true
        default: '使用缓存'
        type: choice
        options:
          - '使用缓存'
          - '完全重建'
      reuse_build_tree:
        description: '复用 build_dir/staging_dir 缓存（数 GB，命中才是真增量）'
        required: true
        default: true
        type: boolean
      manifest:
        description: '清单文件路径（默认 legacy；音频蓝牙专项用 configs/pon-audio-bt-packages.txt）'
        required: true
        default: 'configs/pon-legacy-packages.txt'
        type: string
      extra_packages:
        description: '临时追加要编的包（逗号分隔，不必改清单；例：samba4-server,avahi-daemon）'
        required: false
        default: ''
        type: string
      only:
        description: '只编这些 apk（逗号分隔，all=全部；例：samba4-server,avahi-daemon）'
        required: true
        default: 'all'
        type: string
      with_kernel:
        description: '是否先编内核树（首次必须为 true，kmod 依赖内核 .config）'
        required: true
        default: true
        type: boolean

      source_mode:
        description: '源码对齐方式（追固件源码=按最后一次固件 commit 编，保证 kmod ABI 一致）'
        required: true
        default: '追固件源码'
        type: choice
        options:
          - '追固件源码'
          - '用本仓HEAD'

jobs:
  build:
    name: Build legacy packages (${{ inputs.device }})
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Align source tree with last firmware build
        run: |
          set -euo pipefail
          mode="${{ inputs.source_mode }}"
          fw_url="https://raw.githubusercontent.com/ufo1cn/ponwrt-apk-repo/repo/meta/firmware.json"
          fw_commit=""; fw_kver=""; fw_device=""
          if curl -fsSL --max-time 30 "$fw_url" -o /tmp/fwmeta.json 2>/dev/null; then
            fw_commit=$(python3 -c 'import json;d=json.load(open("/tmp/fwmeta.json"));print(d.get("ponwrt_commit",""))' 2>/dev/null || true)
            fw_kver=$(python3 -c 'import json;d=json.load(open("/tmp/fwmeta.json"));print(d.get("kernel_version",""))' 2>/dev/null || true)
            fw_device=$(python3 -c 'import json;d=json.load(open("/tmp/fwmeta.json"));print(d.get("devices",""))' 2>/dev/null || true)
          else
            echo "::warning::apk-repo 里还没有 meta/firmware.json（固件侧还没发布基线），本次按本仓 HEAD 编译"
          fi
          cur=$(git rev-parse HEAD)
          echo ">>> 固件基线：commit=${fw_commit:-无} kernel=${fw_kver:-无} devices=${fw_device:-无}"
          echo ">>> 当前源码树：commit=$cur"
          if [ "$mode" = "追固件源码" ] && [ -n "$fw_commit" ] && [ "$fw_commit" != "$cur" ]; then
            echo "::warning::源码树与最后一次固件不一致（固件 $fw_commit / 本树 $cur），按固件版本切源码，保证 kmod ABI 与固件一致"
            if ! git fetch --depth=1 origin "$fw_commit" 2>/dev/null; then
              echo ">>> 单 commit 浅取失败，回退完整 fetch"
              git fetch --unshallow origin master 2>/dev/null || git fetch origin master 2>/dev/null || true
            fi
            if git cat-file -e "${fw_commit}^{commit}" 2>/dev/null; then
              git checkout -f "$fw_commit"
              echo ">>> 已切到固件源码 $(git rev-parse HEAD)"
            else
              echo "::error::拿不到固件构建用的 commit $fw_commit（源码对不齐，kmod 会 ABI 不匹配），中止"
              exit 1
            fi
          elif [ "$mode" = "追固件源码" ] && [ -n "$fw_commit" ]; then
            echo ">>> 源码树已与固件一致（$cur），无需切换"
          fi
          {
            echo "aligned_commit=$(git rev-parse HEAD)"
            echo "firmware_commit=${fw_commit:-none}"
            echo "firmware_kernel=${fw_kver:-none}"
            echo "firmware_device=${fw_device:-none}"
            echo "source_mode=$mode"
          } > .ci-source-commit
          cat .ci-source-commit


      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-dev rsync swig unzip zlib1g-dev \
            file wget rsync cpio kmod dos2unix
          df -h /

      - name: Install fixed apk signing key
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APK_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::仓库未配置 APK_SIGNING_PRIVATE_KEY，本次用 run 内临时密钥（跨 run 不可互信）"
            exit 0
          fi
          printf '%s\n' "$APK_SIGNING_PRIVATE_KEY" > private-key.pem
          chmod 600 private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem
          sha256sum public-key.pem

      - name: Restore build tree cache (与固件工作流共用前缀)
        if: inputs.reuse_build_tree && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build_dir/target-*
            build_dir/host
            staging_dir/target-*
            staging_dir/host
          key: ponwrt-tree-${{ inputs.device }}-legacy-${{ hashFiles('configs/**/*.config', 'target/linux/airoha/an7581/config-6.18', 'target/linux/generic/kernel-6.18', '.ci-source-commit') }}-${{ github.run_id }}
          restore-keys: |
            ponwrt-tree-${{ inputs.device }}-legacy-${{ hashFiles('configs/**/*.config', 'target/linux/airoha/an7581/config-6.18', 'target/linux/generic/kernel-6.18', '.ci-source-commit') }}-

      - name: Restore downloads cache
        if: inputs.cache_mode != '完全重建'
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: ponwrt-dl-pkg-${{ hashFiles('feeds.conf.default', 'configs/**/*.config') }}-${{ github.run_id }}
          restore-keys: |
            ponwrt-dl-pkg-${{ hashFiles('feeds.conf.default', 'configs/**/*.config') }}-
            ponwrt-dl-pkg-

      - name: Restore compiler ccache
        if: inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ponwrt-ccache-pkg-${{ inputs.device }}-${{ github.run_id }}
          restore-keys: |
            ponwrt-ccache-pkg-${{ inputs.device }}-
            ponwrt-ccache-pkg-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare custom packages and patches
        run: |
          bash ./scripts/customize.sh

      - name: Configure (same as firmware)
        run: |
          set -euo pipefail

          # kconfig.pl 的 + 是二元操作符：N 个文件用 N-1 个 +，最后一个不加 +
          files=(configs/an7581.config configs/release.config \
                 configs/pon-packages/*.config)
          merge_args=()
          n=${#files[@]}
          for ((i=0; i<n; i++)); do
            if [ "$i" -lt "$((n-1))" ]; then
              merge_args+=("+" "${files[$i]}")
            else
              merge_args+=("${files[$i]}")
            fi
          done
          echo ">>> kconfig.pl ${merge_args[*]}"
          ./scripts/kconfig.pl "${merge_args[@]}" > .config
          grep -c '^CONFIG_' .config

          sed -i '/^CONFIG_KERNEL_DEBUG_INFO_REDUCED=/d' .config
          printf 'CONFIG_KERNEL_DEBUG_INFO=y\n# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set\nCONFIG_KERNEL_DEBUG_INFO_BTF=y\nCONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y\nCONFIG_KERNEL_MODULE_ALLOW_BTF_MISMATCH=y\nCONFIG_KERNEL_KPROBES=y\nCONFIG_KERNEL_BPF_EVENTS=y\n' >> .config

          # 临时清单 = 清单文件 + extra_packages 里临时追加的包
          TMP=/tmp/pkg-manifest.txt
          cp "${{ inputs.manifest }}" "$TMP"
          if [ -n "${{ inputs.extra_packages }}" ]; then
            printf '%s\n' "${{ inputs.extra_packages }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' | \
              while read -r extra; do echo "auto|${extra}|required" >> "$TMP"; done
            echo ">>> 临时追加包：$(tail -n +1 "$TMP" | grep -c auto) 项清单"
          fi

          # 清单内每个包先置 m，让 feed 依赖链被解析进来
          while IFS='|' read -r path apk required; do
            [ -n "${path:-}" ] || continue
            case "$path" in \#*) continue ;; esac
            sed -i "/^CONFIG_PACKAGE_${apk}=/d;/^# CONFIG_PACKAGE_${apk} is not set/d" .config
            printf 'CONFIG_PACKAGE_%s=m\n' "$apk" >> .config
          done < "$TMP"

          if [ "${{ inputs.cache_mode }}" != "完全重建" ]; then
            sed -i '/^CONFIG_DEVEL=/d; /^CONFIG_CCACHE=/d' .config
            printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
          fi

          make defconfig

          case "${{ inputs.device }}" in
            hg5585f-ct) DEVICE="fiberhome_hg5585f-ct" ;;
            hg5382a)    DEVICE="fiberhome_hg5382a" ;;
            *)          echo "::error::未知机型 ${{ inputs.device }}"; exit 1 ;;
          esac
          sed -i '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          sed -i '/^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.* is not set/d' .config
          printf 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_%s=y\n' "$DEVICE" >> .config
          grep -q "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${DEVICE}=y" .config \
            || { echo "::error::机型符号未落地: $DEVICE"; exit 1; }

          echo ">>> 清单符号落地情况（=m 才算选中）:"
          miss=0
          while IFS='|' read -r path apk required; do
            [ -n "${path:-}" ] || continue
            case "$path" in \#*) continue ;; esac
            if grep -q "^CONFIG_PACKAGE_${apk}=m" .config; then
              echo "    OK   $apk"
            else
              if [ "$required" = "optional" ]; then
                echo "    SKIP $apk（可选，未落地）"
              else
                echo "::warning::符号未落地 $apk（编译阶段会补选 CONFIG_PACKAGE_${apk}=m）"
                miss=$((miss+1))
              fi
            fi
          done < "$TMP"
          echo ">>> 未落地必需包数: $miss"

      - name: Build host tools and toolchain
        run: |
          set -euo pipefail
          make -j"$(nproc)" tools/compile
          make -j"$(nproc)" toolchain/compile

      - name: Build kernel tree (kmod ABI 来源)
        if: inputs.with_kernel
        run: |
          set -euo pipefail
          make -j"$(nproc)" target/linux/compile
          make -j"$(nproc)" target/linux/install || true

      - name: Build kernel modules selected by config
        run: |
          set -euo pipefail
          make -j"$(nproc)" package/kernel/linux/compile || true

      - name: Build legacy packages (no silent drop)
        run: |
          set -euo pipefail
          mkdir -p output build_log
          manifest="${{ inputs.manifest }}"
          TMP=/tmp/pkg-manifest.txt
          cp "${{ inputs.manifest }}" "$TMP"
          if [ -n "${{ inputs.extra_packages }}" ]; then
            printf '%s\n' "${{ inputs.extra_packages }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*//' | sed '/^$/d' | \
              while read -r extra; do echo "auto|${extra}|required" >> "$TMP"; done
          fi
          only="${{ inputs.only }}"

          # 源码目录解析：目录名 -> Makefile 里的 Package/<apk> -> PKG_NAME 反查
          # 关键：make 只认 package/feeds/<feed>/<pkg> 这类目标；直接给 feeds/packages/utils/bluez
          # 会报 "make[1]: *** No rule to make target 'feeds/packages/utils/bluez/compile'"
          # （legacy run 44752208306 实测，libdbus/bluez-libs/bluez-daemon/bluez-utils 全挂在这）。
          resolve_path() {
            local apk="$1" hit="" feed cand
            # 1) feeds install 建立的按「包名」链接：最精确，只编这一个包
            for feed in $(ls feeds 2>/dev/null); do
              if [ -e "package/feeds/$feed/$apk" ]; then
                printf '%s' "package/feeds/$feed/$apk"; return
              fi
            done
            # 2) 目录名直接匹配
            hit=$(find package/feeds package -maxdepth 5 \( -type d -o -type l \) -name "$apk" 2>/dev/null | head -n1)
            if [ -n "$hit" ] && [ -f "$hit/Makefile" ]; then printf '%s' "$hit"; return; fi
            # 3) Makefile 里 define Package/<apk> / PKG_NAME 反查，feeds 路径映射成 package/feeds/<feed>/<dir>
            #    需要兼容两种写法：define Package/<apk>/<sub>（子包配置块）、以及
            #    多包共用一个目录时的 $(eval $(call BuildPackage,<apk>))（如 net/frp 产 frpc/frps）。
            #    run 136844207118（legacy #8）里 avahi-daemon / frpc 就是因为这两种写法漏判，
            #    报「源码目录未找到」。
            hit=$(grep -rls --include=Makefile -E "^define[[:space:]]+Package/${apk}(/[A-Za-z0-9_.-]+)?[[:space:]]*\$" package feeds 2>/dev/null | head -n1)
            if [ -z "$hit" ]; then
              hit=$(grep -rls --include=Makefile -E "^PKG_NAME[[:space:]]*[:+]?=[[:space:]]*${apk}[[:space:]]*\$" package feeds 2>/dev/null | head -n1)
            fi
            if [ -z "$hit" ]; then
              hit=$(grep -rls --include=Makefile -E "BuildPackage[,[:space:]]+${apk}([[:space:]]*)[,)]" package feeds 2>/dev/null | head -n1)
            fi
            if [ -n "$hit" ]; then
              cand=$(dirname "$hit")
              case "$cand" in
                feeds/*)
                  feed=$(printf '%s' "$cand" | cut -d/ -f2)
                  hit="package/feeds/$feed/$(basename "$cand")"
                  if [ ! -e "$hit" ]; then
                    mkdir -p "package/feeds/$feed"
                    ln -sfn "$(cd "$cand" && pwd)" "$hit"
                    echo ">>> 补齐 feeds 链接：$hit -> $(cd "$cand" && pwd)" >&2
                  fi
                  ;;
                *) hit="$cand" ;;
              esac
              printf '%s' "$hit"; return
            fi
            printf '%s' ""
          }

          fail=0; summary=""; skipped=""
          while IFS='|' read -r path apk required; do
            [ -n "${path:-}" ] || continue
            case "$path" in \#*) continue ;; esac

            if [ "$only" != "all" ]; then
              echo ",$only," | grep -q ",$apk," || continue
            fi

            if [ "$path" = "auto" ]; then
              path=$(resolve_path "$apk")
            fi

            if [ -z "$path" ] || [ ! -f "$path/Makefile" ]; then
              if [ "$required" = "optional" ]; then
                echo ">>> SKIP $apk（源码目录未找到，optional）"
                skipped="${skipped}\nSKIP   $apk（源码目录未找到）"
                continue
              fi
              echo "::error::必需包 $apk 的源码目录未找到"
              summary="${summary}\nFAIL   $apk（源码目录未找到）"; fail=1
              continue
            fi

            # 包没在 .config 里选中（=m）时，OpenWrt 只编源码、不产出 apk —— legacy #8
            # 的 avahi-daemon / frpc / ffmpeg 都是「符号未落地」→「无 apk 产出」。
            # 这里补选成 =m（追加即可；不能再 defconfig，否则机型行会被重算掉）。
            if ! grep -q "^CONFIG_PACKAGE_${apk}=" .config; then
              printf 'CONFIG_PACKAGE_%s=m\n' "$apk" >> .config
              echo ">>> 补选 CONFIG_PACKAGE_${apk}=m（原未选中；不补只会编源码、不产出 apk）"
            fi

            echo ">>> 编译 $apk ($path)"
            if make -j"$(nproc)" "$path/compile" 2>&1 | tee "build_log/${apk}.log"; then
              hit=$(find bin/packages bin/targets -type f -name "${apk}-[0-9]*.apk" | head -n1)
              if [ -n "$hit" ]; then
                summary="${summary}\nOK     $apk -> $hit"
                cp -f "$hit" output/
              else
                echo "::error::$apk 编译命令成功但没有产出 apk"
                summary="${summary}\nFAIL   $apk（无 apk 产出）"; fail=1
              fi
            else
              echo "::error::$apk 编译失败，日志 build_log/${apk}.log"
              { echo; echo ">>> 用 -j1 V=s 复跑取尾部 100 行"; \
                make -j1 V=s "$path/compile" 2>&1 | tail -n 100; } >> "build_log/${apk}.log" || true
              summary="${summary}\nFAIL   $apk（编译失败）"; fail=1
            fi
          done < "$manifest"

          {
            echo "# 旧仓遗留包逐包结果（${{ inputs.device }} / only=$only）"
            echo -e "$summary"
            [ -n "$skipped" ] && echo -e "\n$skipped" || true
          } > build_log/legacy-package-summary.txt
          cat build_log/legacy-package-summary.txt
          {
            echo "### 旧仓遗留包逐包结果（${{ inputs.device }} / only=$only）"
            echo '```'
            cat build_log/legacy-package-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cd output
          for f in *; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done
          exit $fail

      - name: Record ABI snapshot (兼容性核对用)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p output
          {
            echo "device=${{ inputs.device }}"
            echo "commit=${GITHUB_SHA}"
            echo "run=${{ github.run_number }}"
            echo "kernel_release=$(cat build_dir/target-*/linux-*/include/config/kernel.release 2>/dev/null | head -n1)"
            ko=$(find build_dir/target-*/linux-*/ -name '*.ko' 2>/dev/null | head -n1 || true)
            [ -n "$ko" ] && echo "kmod_vermagic=$(modinfo -F vermagic "$ko" 2>/dev/null)"
            echo "apk_pubkey_sha256=$(sha256sum public-key.pem 2>/dev/null | cut -d' ' -f1)"
            echo "config_6_18_sha256=$(sha256sum target/linux/airoha/an7581/config-6.18 2>/dev/null | cut -d' ' -f1)"
          } > output/abi-info.txt
          cat output/abi-info.txt

      - name: Export apk signing public key
        if: always()
        run: |
          set -uo pipefail
          mkdir -p output
          if [ -f public-key.pem ]; then
            cp -f public-key.pem output/public-key.pem
            sha256sum public-key.pem | tee output/public-key.pem.sha256
          else
            echo "::warning::本 run 未生成 public-key.pem"
          fi

      - name: Save downloads cache
        if: always() && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ponwrt-dl-pkg-${{ hashFiles('feeds.conf.default', 'configs/**/*.config') }}-${{ github.run_id }}

      - name: Save compiler ccache
        if: always() && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ponwrt-ccache-pkg-${{ inputs.device }}-${{ github.run_id }}

      - name: Save build tree cache
        if: always() && inputs.reuse_build_tree && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir/target-*
            build_dir/host
            staging_dir/target-*
            staging_dir/host
          key: ponwrt-tree-${{ inputs.device }}-legacy-${{ hashFiles('configs/**/*.config', 'target/linux/airoha/an7581/config-6.18', 'target/linux/generic/kernel-6.18', '.ci-source-commit') }}-${{ github.run_id }}

      - name: Build apk index and publish to apk repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          # 内核版本：优先读本次编出的 kernel.release；没编内核时按源码树里的
          # KERNEL_PATCHVER + LINUX_VERSION-<pv> 推出来（apk 的兼容键就是它）
          KVER=$(cat build_dir/target-*/linux-*/include/config/kernel.release 2>/dev/null | head -n1 || true)
          if [ -z "$KVER" ]; then
            pv=$(awk -F':=' '/^KERNEL_PATCHVER/ {print $2; exit}' target/linux/airoha/Makefile | tr -d '[:space:]')
            suf=$(awk -v p="$pv" '$1=="LINUX_VERSION-"p {gsub(/ /,"",$3); print $3; exit}' "target/linux/generic/kernel-$pv" 2>/dev/null || true)
            KVER="${pv}${suf}"
          fi
          [ -n "$KVER" ] || { echo "::error::无法确定内核版本，拒绝发布（否则 apk 目录没法按 ABI 归类）"; exit 1; }
          echo ">>> 本次内核版本：$KVER（目录 ponwrt-k$KVER）"
          files=(output/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::本次没有 apk，跳过索引生成"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::未配置 APK_REPO_TOKEN，跳过仓库索引推送"
            exit 0
          fi
          APKBIN=""
          for c in staging_dir/host/bin/apk build_dir/host*/apk-*/apk; do
            if [ -x "$c" ]; then APKBIN="$c"; break; fi
          done
          if [ -z "$APKBIN" ]; then
            echo "::warning::找不到 host 版 apk 工具，跳过索引生成（apk 仍可单独下载安装）"
            exit 0
          fi
          echo ">>> host apk: $APKBIN"
          "$APKBIN" --version || true

          # 按能力分索引：规则见 configs/pon-feature-packages.txt（能力|通配），
          # 未命中任何能力的包一律进 common。这样 HG5382A 只看 common，看不到 USB 包。
          FEAT_FILE="configs/pon-feature-packages.txt"
          feature_of() {
            local b feat pats p
            b=$(basename "$1")
            if [ -f "$FEAT_FILE" ]; then
              while IFS='|' read -r feat pats; do
                case "$feat" in ''|'#'*) continue ;; esac
                for p in $pats; do
                  case "$b" in $p) echo "$feat"; return ;; esac
                done
              done < "$FEAT_FILE"
            fi
            echo common
          }
          rm -rf /tmp/stage && mkdir -p /tmp/stage
          for f in "${files[@]}"; do
            feat=$(feature_of "$f")
            mkdir -p "/tmp/stage/$feat"
            cp -f "$f" "/tmp/stage/$feat"/
          done
          echo ">>> 能力分组：$(for d in /tmp/stage/*/; do echo -n "$(basename "$d")=$(ls -1 "$d"*.apk 2>/dev/null | wc -l) "; done)"

          SIGN_ARG=""
          if [ -f "$PWD/private-key.pem" ]; then SIGN_ARG="--sign $PWD/private-key.pem"; fi
          rm -rf /tmp/idx && mkdir -p /tmp/idx
          for d in /tmp/stage/*/; do
            feat=$(basename "$d")
            # mkndx 是 v3 ADB 索引生成器；apk index 是 v2（遇到 v3 包直接报 file format not supported）
            if ! "$APKBIN" mkndx --root "$PWD" --keys-dir "$PWD" --allow-untrusted $SIGN_ARG \
                   --output "/tmp/idx/$feat.adb" "$d"*.apk 2>"/tmp/idx/$feat.err"; then
              cat "/tmp/idx/$feat.err" || true
              echo "::error::$feat 索引生成失败"
              exit 1
            fi
            ls -l "/tmp/idx/$feat.adb"
          done

          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/ufo1cn/ponwrt-apk-repo.git"
          rm -rf /tmp/apkrepo
          if ! git clone --depth=1 --branch repo "$REPO_URL" /tmp/apkrepo 2>/dev/null; then
            git clone --depth=1 "$REPO_URL" /tmp/apkrepo
            git -C /tmp/apkrepo checkout -b repo
          fi
          for d in /tmp/stage/*/; do
            feat=$(basename "$d")
            DEST="/tmp/apkrepo/aarch64_cortex-a53/ponwrt-k${KVER}/$feat"
            mkdir -p "$DEST"
            cp -f "$d"*.apk "$DEST"/
            cp -f "/tmp/idx/$feat.adb" "$DEST/packages.adb"
            ( cd "$DEST" && sha256sum ./*.apk > SHA256SUMS )
            echo ">>> 已放入 ponwrt-k${KVER}/$feat（$(ls -1 "$DEST"/*.apk | wc -l) 个 apk）"
          done
          git -C /tmp/apkrepo add -A
          git -C /tmp/apkrepo -c user.email=ci@ponwrt -c user.name=ponwrt-ci \
            commit -m "repo: run=${{ github.run_number }} device=${{ inputs.device }} k=$KVER feat=$(ls -1 /tmp/stage | tr '\n' ',')" || true
          pushed=0
          for i in 1 2 3; do
            if git -C /tmp/apkrepo push origin repo; then pushed=1; break; fi
            echo ">>> 推送被拒，第 $i 次 rebase 重试"
            git -C /tmp/apkrepo fetch origin repo && git -C /tmp/apkrepo rebase origin/repo || true
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::在线源推送失败（apk 已进 Release，但 raw 目录未更新）"
            exit 1
          fi
          echo ">>> 在线源：https://raw.githubusercontent.com/ufo1cn/ponwrt-apk-repo/repo/aarch64_cortex-a53/ponwrt-k${KVER}/common"


      - name: Check kmod ABI against firmware baseline
        if: always()
        run: |
          set -uo pipefail
          fw=$(grep '^firmware_kernel=' .ci-source-commit 2>/dev/null | cut -d= -f2 || true)
          got=$(cat build_dir/target-*/linux-*/include/config/kernel.release 2>/dev/null | head -n1 || true)
          echo ">>> 固件内核=${fw:-未知} 本树内核=${got:-未知}"
          if [ -z "$fw" ] || [ "$fw" = "none" ]; then
            echo "::warning::拿不到固件基线内核版本（apk-repo 还没有 meta/firmware.json），本次只记录不拦截"
            exit 0
          fi
          if [ -z "$got" ]; then
            echo "::warning::本 run 没编内核树（with_kernel=false），只记录基线 $fw"
            exit 0
          fi
          if [ "$fw" != "$got" ]; then
            echo "::error::内核版本与固件不一致：固件=$fw 本树=$got；这些 kmod 装到固件上会 ABI 不匹配"
            exit 1
          fi
          echo ">>> ABI 核对通过：$fw"

      - name: Upload packages artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-legacy-packages-${{ inputs.device }}-${{ github.run_number }}
          path: |
            output/*
            build_log/legacy-package-summary.txt
            build_log/*.log
          retention-days: 14

      - name: Publish prerelease (本仓, apk + 公钥)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(output/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::output 为空，跳过本仓预发布"
            exit 0
          fi
          tag="pkgs-legacy-${{ inputs.device }}-r${{ github.run_number }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --prerelease \
              --title "apk $tag" \
              --notes "device=${{ inputs.device }} run=${{ github.run_number }} commit=${{ github.sha }}；同私钥签名，公钥 public-key.pem(.sha256) 随包发布。"
          fi

      - name: Publish to apk repository (ufo1cn/ponwrt-apk-repo)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          REPO="ufo1cn/ponwrt-apk-repo"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::未配置 APK_REPO_TOKEN，跳过跨仓发布（本仓 prerelease 已有产物）"
            exit 0
          fi
          files=(output/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::output 为空，跳过跨仓发布"
            exit 0
          fi
          tag="legacy-${{ inputs.device }}-r${{ github.run_number }}"
          body="来源仓库 ufo1cn/ponwrt-ZN504-HG5585F；device=${{ inputs.device }}；run=${{ github.run_number }}；commit=${{ github.sha }}；签名私钥与固件同一把，设备装 /etc/apk/keys/public-key.pem 后免 --allow-untrusted。"
          if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" -R "$REPO" --clobber
          else
            gh release create "$tag" "${files[@]}" -R "$REPO" \
              --prerelease --title "apk $tag" --notes "$body"
          fi
          echo ">>> 已发布到 https://github.com/$REPO/releases/tag/$tag"
