name: Build Packages (legacy | 旧仓有、新仓无的用户态软件) manual

# ==============================================================================
# 只允许手动触发（workflow_dispatch）。
#
# 用途：旧仓 ufo1cn/PonWrt-HG5382A 有一批用户态软件，新仓 ufo1cn/ponwrt-ZN504-HG5585F
#       的清单里没有。这里在**新仓同一内核源码树**上重新编成 apk，签同一把固定私钥。
#       产物只发本仓 prerelease 与 artifact；进软件仓库（能力分组目录 + 签名索引）
#       统一由 .github/workflows/pkg-publish.yml 做，本文件不 push apk-repo。
# 5) kmod 归属：本流程只编用户态包；kmod 一律由固件构建流程 fw-build.yml 在同一次
#    构建里编成 apk，随固件 artifact 与 kmods-<label>-r<run> 预发布交付，
#    再由 pkg-publish.yml 统一搬进软件仓库。
#
# 清单：configs/pon-legacy-packages.txt
#   auto|<apk>|<required|optional>   —— auto 表示由本工作流解析源码目录
#   清单里已排除所有 kmod-* / 内核虚拟包 / sing-box / ksmbd-tools（理由见清单头注释）：
#   它们与固件内核 ABI 绑定或与镜像内组件重名，重编会冲突。
#
# 签名：固定私钥来自 secret APK_SIGNING_PRIVATE_KEY（与两个仓库所有工作流同一把），
#       公钥 sha256 = d557dca1a8b8d30b48f7e4b910908342789d389a52db3d7225c6b72840eda4ed
#       设备只需 /etc/apk/keys/public-key.pem 一次，之后所有包免 --allow-untrusted。
#
# 签名校验：pkg-publish.yml 会先用公钥指纹核对、再用 host apk 以 keys-dir 强制验签，
#             验不过就停下并列出包名（ADB 包不支持事后重签，只能带着固定私钥重编）。
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      device:
        description: '目标机型（决定 .config 里的设备锁定与 ABI）'
        required: true
        default: 'hg5585f-ct'
        type: choice
        options:
          - 'hg5585f-ct'
          - 'hg5382a'
      cache_mode:
        description: '缓存模式（完全重建会丢弃所有缓存）'
        required: true
        default: '使用缓存'
        type: choice
        options:
          - '使用缓存'
          - '完全重建'
      reuse_build_tree:
        description: '复用 build_dir/staging_dir 缓存（数 GB，命中才是真增量）'
        required: true
        default: true
        type: boolean
      manifest:
        description: '清单文件路径（默认 legacy；音频蓝牙专项用 configs/pon-audio-bt-packages.txt）'
        required: true
        default: 'configs/pon-legacy-packages.txt'
        type: string
      extra_packages:
        description: '临时追加要编的包（逗号分隔，不必改清单；例：samba4-server,avahi-daemon）'
        required: false
        default: ''
        type: string
      only:
        description: '只编这些 apk（逗号分隔，all=全部；例：samba4-server,avahi-daemon）'
        required: true
        default: 'all'
        type: string

      source_mode:
        description: '源码对齐方式（已弃用：包流程只编应用层，恒用本仓 HEAD）'
        required: true
        default: '追固件源码'
        type: choice
        options:
          - '追固件源码'
          - '用本仓HEAD'

jobs:
  build:
    name: Build legacy packages (${{ inputs.device }})
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record source tree (userland-only build)
        run: |
          set -euo pipefail
          # 同 incremental：只编应用层，不读固件基线、不按固件 commit 切树。
          mode="${{ inputs.source_mode }}"
          cur=$(git rev-parse HEAD)
          echo ">>> 包流程只编应用层，不读固件基线；源码树=本仓 HEAD commit=$cur（source_mode=$mode 不再触发切树）"
          {
            echo "aligned_commit=$(git rev-parse HEAD)"
            echo "firmware_commit=none"
            echo "firmware_kernel=none"
            echo "firmware_device=none"
            echo "source_mode=$mode"
          } > .ci-source-commit
          cat .ci-source-commit


      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-dev rsync swig unzip zlib1g-dev \
            file wget rsync cpio kmod dos2unix
          df -h /

      - name: Install fixed apk signing key
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APK_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::仓库未配置 APK_SIGNING_PRIVATE_KEY（全仓库固定同一把私钥），本次构建不能继续"
            exit 1
          fi
          printf '%s\n' "$APK_SIGNING_PRIVATE_KEY" > private-key.pem
          chmod 600 private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem
          sha256sum public-key.pem
          # 全链路只用同一把既有密钥：指纹对不上就立刻失败，避免"包签出来了但设备不认"
          got=$(sha256sum public-key.pem | cut -d' ' -f1)
          if [ "$got" != "d557dca1a8b8d30b48f7e4b910908342789d389a52db3d7225c6b72840eda4ed" ]; then
            echo "::error::APK_SIGNING_PRIVATE_KEY 派生公钥指纹 $got 与既有密钥不一致"
            exit 1
          fi
          echo ">>> 公钥指纹与既有密钥一致：$got"

      - name: Restore build tree cache (与固件工作流共用前缀)
        if: inputs.reuse_build_tree && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build_dir/target-*
            build_dir/host
            staging_dir/target-*
            staging_dir/host
            bin/packages
          key: ponwrt-tree-${{ inputs.device }}-legacy-${{ hashFiles('configs/**/*.config', 'target/linux/airoha/an7581/config-6.18', 'target/linux/generic/kernel-6.18', 'package/**', 'target/linux/**') }}-${{ github.run_id }}
          restore-keys: |
            ponwrt-tree-${{ inputs.device }}-legacy-${{ hashFiles('configs/**/*.config', 'target/linux/airoha/an7581/config-6.18', 'target/linux/generic/kernel-6.18', 'package/**', 'target/linux/**') }}-

      # 交叉工具链（gcc/binutils/musl）单独一份稳定 key 的缓存：
      # 原来它跟着 tree cache 走（key 带 run/sha，等于每 run 重存 300-400MB），
      # 而包流的 tree cache 根本没纳入 toolchain 路径 → 每轮重编 ~30 分钟。
      # 这里用「工具链源码内容哈希」做 key，命中一次就一直复用，
      # 只在新工具链源码/目标配置变化时自动失效并重建。
      - name: Restore host toolchain cache
        id: hosttc
        if: inputs.reuse_build_tree && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build_dir/toolchain-*
            staging_dir/toolchain-*
          key: ponwrt-hosttc-v1-${{ hashFiles('toolchain/**', 'configs/an7581.config', 'configs/release.config') }}

      - name: Restore downloads cache
        if: inputs.cache_mode != '完全重建'
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: ponwrt-dl-pkg-${{ hashFiles('feeds.conf.default', 'configs/**/*.config') }}-${{ github.run_id }}
          restore-keys: |
            ponwrt-dl-pkg-${{ hashFiles('feeds.conf.default', 'configs/**/*.config') }}-
            ponwrt-dl-pkg-

      - name: Restore compiler ccache
        if: inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ponwrt-ccache-pkg-${{ inputs.device }}-${{ github.run_id }}
          restore-keys: |
            ponwrt-ccache-pkg-${{ inputs.device }}-
            ponwrt-ccache-pkg-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Preflight 检查依赖内核树的包（只能随固件编）
        run: |
          set -euo pipefail
          # 口径：包流程只收纯用户态包（只依赖 arch + libc + uapi）。
          # 下列特征说明该包在构建期读内核源码树的派生物，产物与具体内核 config 绑定：
          # 换 config（例如 WED 分支多打 NPU/WED 补丁、改 DRAM 布局）后结构体偏移/内核符号
          # 全部失配，装上去不能正常运行。因此这类包只能随固件一起编（fw-build.yml），
          # 不许进包流程。
          hits=""
          defused=""
          for manifest in configs/pon-*.txt; do
            [ -f "$manifest" ] || continue
            while IFS='|' read -r path apk required; do
              [ -n "${path:-}" ] || continue
              case "$path" in \#*) continue ;; esac
              dir="$path"
              if [ ! -d "$dir" ]; then
                base=$(basename "$path")
                dir=$(find package/feeds feeds -maxdepth 4 \( -type d -o -type l \) -name "$base" 2>/dev/null | head -n 1 || true)
                { [ -n "$dir" ] && [ -f "$dir/Makefile" ]; } || dir=""
              fi
              [ -n "$dir" ] && [ -f "$dir/Makefile" ] || continue
              hit=""
              for pat in '$(LINUX_DIR)' '${LINUX_DIR}' '$(LINUX_KARCH)' 'vmlinux'; do
                line=$(grep -nF -- "$pat" "$dir/Makefile" 2>/dev/null | head -n 2 || true)
                [ -n "$line" ] && hit="${hit}      ${pat}: ${line}\n"
              done
              # KERNEL_MAKE 例外：只有「+$(KERNEL_MAKE) ... modules」这种整段可摘除的形态放行
              # （open-app-filter 的 oaf.ko 由它自己的 Makefile 顺手编，摘除动作在 incremental
              # 的 Strip 步骤里；本流不编它，这里只是别让清单里的它把 preflight 卡红）。
              if grep -q 'KERNEL_MAKE' "$dir/Makefile"; then
                if grep -qE '^[[:space:]]*\+\$\(KERNEL_MAKE\)' "$dir/Makefile"; then
                  defused="${defused}  ${apk} (${dir})\n"
                else
                  hit="${hit}      KERNEL_MAKE: $(grep -nF 'KERNEL_MAKE' "$dir/Makefile" | head -n 2)\n"
                fi
              fi
              if [ -n "$hit" ]; then
                hits="${hits}  ${manifest} :: ${apk} (${dir})\n${hit}"
              fi
            done < "$manifest"
          done
          if [ -n "$defused" ]; then
            echo ">>> 预检放行（内核编译段由 incremental 包流摘除）："
            echo -e "$defused"
          fi
          if [ -n "$hits" ]; then
            echo "::error::清单内存在需要内核源码树的包，必须随固件（fw-build）编译，不能进包流程："
            echo -e "$hits"
            exit 1
          fi
          echo ">>> 预检通过：清单内全部为纯用户态包"

      - name: Prepare custom packages and patches
        run: |
          bash ./scripts/customize.sh

      - name: Configure (same as firmware)
        run: |
          set -euo pipefail

          # kconfig.pl 的 + 是二元操作符：N 个文件用 N-1 个 +，最后一个不加 +
          files=(configs/an7581.config configs/release.config \
                 configs/pon-packages/*.config)
          merge_args=()
          n=${#files[@]}
          for ((i=0; i<n; i++)); do
            if [ "$i" -lt "$((n-1))" ]; then
              merge_args+=("+" "${files[$i]}")
            else
              merge_args+=("${files[$i]}")
            fi
          done
          echo ">>> kconfig.pl ${merge_args[*]}"
          ./scripts/kconfig.pl "${merge_args[@]}" > .config
          grep -c '^CONFIG_' .config

          sed -i '/^CONFIG_KERNEL_DEBUG_INFO_REDUCED=/d' .config
          printf 'CONFIG_KERNEL_DEBUG_INFO=y\n# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set\nCONFIG_KERNEL_DEBUG_INFO_BTF=y\nCONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y\nCONFIG_KERNEL_MODULE_ALLOW_BTF_MISMATCH=y\nCONFIG_KERNEL_KPROBES=y\nCONFIG_KERNEL_BPF_EVENTS=y\n' >> .config

          # 临时清单 = 清单文件 + extra_packages 里临时追加的包
          TMP=/tmp/pkg-manifest.txt
          cp "${{ inputs.manifest }}" "$TMP"
          if [ -n "${{ inputs.extra_packages }}" ]; then
            printf '%s\n' "${{ inputs.extra_packages }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' | \
              while read -r extra; do echo "auto|${extra}|required" >> "$TMP"; done
            echo ">>> 临时追加包：$(tail -n +1 "$TMP" | grep -c auto) 项清单"
          fi

          # 清单内每个包先置 m，让 feed 依赖链被解析进来
          while IFS='|' read -r path apk required; do
            [ -n "${path:-}" ] || continue
            case "$path" in \#*) continue ;; esac
            sed -i "/^CONFIG_PACKAGE_${apk}=/d;/^# CONFIG_PACKAGE_${apk} is not set/d" .config
            printf 'CONFIG_PACKAGE_%s=m\n' "$apk" >> .config
          done < "$TMP"

          if [ "${{ inputs.cache_mode }}" != "完全重建" ]; then
            sed -i '/^CONFIG_DEVEL=/d; /^CONFIG_CCACHE=/d' .config
            printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
          fi

          make defconfig

          case "${{ inputs.device }}" in
            hg5585f-ct) DEVICE="fiberhome_hg5585f-ct" ;;
            hg5382a)    DEVICE="fiberhome_hg5382a" ;;
            *)          echo "::error::未知机型 ${{ inputs.device }}"; exit 1 ;;
          esac
          sed -i '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          sed -i '/^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.* is not set/d' .config
          printf 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_%s=y\n' "$DEVICE" >> .config
          grep -q "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${DEVICE}=y" .config \
            || { echo "::error::机型符号未落地: $DEVICE"; exit 1; }

          echo ">>> 清单符号落地情况（=m 才算选中）:"
          miss=0
          while IFS='|' read -r path apk required; do
            [ -n "${path:-}" ] || continue
            case "$path" in \#*) continue ;; esac
            if grep -q "^CONFIG_PACKAGE_${apk}=m" .config; then
              echo "    OK   $apk"
            else
              if [ "$required" = "optional" ]; then
                echo "    SKIP $apk（可选，未落地）"
              else
                echo "::warning::符号未落地 $apk（编译阶段会补选 CONFIG_PACKAGE_${apk}=m）"
                miss=$((miss+1))
              fi
            fi
          done < "$TMP"
          echo ">>> 未落地必需包数: $miss"

      - name: Strip kmod / kernel selections (内核模块统一由固件流程编译)
        run: |
          set -euo pipefail
          # 设计口径：kmod 只由 fw-build 编（与固件同树同配置，vermagic 一致）。
          # legacy r15 (45766043602) 实证：只在 .config 里删 kmod/gpio 行不够——
          # package/kernel/linux/Makefile 硬写 BuildPackage,kernel（hidden+default y），
          # gpio-button-hotplug 是 KernelPackage（走 KERNEL_MAKE），两者每次 syncconfig
          # 都会被写回 y，于是任意 make package/.../compile 都先把内核拉进依赖链，
          # 包流没有内核产物 → ERROR: package/kernel/gpio-button-hotplug failed to build，
          # 连带 ffmpeg/zerotier/tailscale/nebula/n2n 全挂。
          # 做法（与 build-packages-incremental.yml 同一套）：① CI 树内摘掉 kernel 元包与
          # gpio-button-hotplug 的包定义；② package/ 与 feeds/ 下 Makefile 摘掉
          # +kmod-*/+kernel/+gpio-button-hotplug 依赖（只改 CI 工作树，不提交）；
          # ③ 删 tmpinfo 后 oldconfig 重建，再在 .config 里显式 not set 并硬校验为 0。
          strip_pkg_sel() {
            awk '
              /^CONFIG_PACKAGE_(kmod-[^=]*|gpio-button-hotplug|kernel)=/ {
                split($0, a, "="); print "# " a[1] " is not set"; next
              }
              { print }
            ' .config > .config.strip && mv .config.strip .config
          }

          kf=package/kernel/linux/Makefile
          gf=package/kernel/gpio-button-hotplug/Makefile
          for f in "$kf" "$gf"; do
            [ -f "$f" ] || { echo "::error::缺少 $f"; exit 1; }
          done
          grep -q 'BuildPackage,kernel' "$kf" || { echo "::error::$kf 形态变化：未找到 BuildPackage,kernel"; exit 1; }
          grep -q 'KernelPackage,gpio-button-hotplug' "$gf" || { echo "::error::$gf 形态变化：未找到 KernelPackage,gpio-button-hotplug"; exit 1; }
          awk '
            /^CONFIG_PACKAGE_kernel=y$/ { print "# CI(pkgs): kernel 元包由固件流程编，包流内摘除"; next }
            /BuildPackage,kernel/ { print "# CI(pkgs): " $0 "  # disabled: userland-only pkg flow"; next }
            { print }
          ' "$kf" > "$kf.ci" && mv "$kf.ci" "$kf"
          awk '
            /KernelPackage,gpio-button-hotplug/ { print "# CI(pkgs): " $0 "  # disabled: needs kernel tree"; next }
            { print }
          ' "$gf" > "$gf.ci" && mv "$gf.ci" "$gf"
          echo ">>> 已在树内摘除 kernel 元包与 gpio-button-hotplug 的包定义"

          # ② 摘掉 +kmod-*/+kernel/+gpio-button-hotplug 依赖（不动 package/kernel 下的包定义）
          stripped=$(grep -rlE '\+(kmod-[A-Za-z0-9_.+-]+|kernel|gpio-button-hotplug)' \
            --include=Makefile package feeds 2>/dev/null | grep -v '^package/kernel/' || true)
          n=0
          for f in $stripped; do
            sed -i -E 's/\+(kmod-[A-Za-z0-9_.+-]+|kernel|gpio-button-hotplug)//g' "$f"
            sed -i -E '/^[[:space:]]*DEPENDS/ s/[[:space:]]+/ /g; /^[[:space:]]*DEPENDS/ s/[[:space:]]+$//' "$f"
            n=$((n+1))
          done
          echo ">>> 摘除 kmod/kernel 依赖的 Makefile：$n 个（kmod 由固件流程编）"

          # ③ 重建包元数据（此时元数据里已无 kernel/gpio 定义），再清洁 .config
          # 元数据重建：必须连扫描缓存一起清（tmp/info 里的 .scan-*.stamp 与 .files-*）。
          # 只删 tmp/.packageinfo 时，prepare-tmpinfo 的 scan_unchanged 会走「未变化」快
          # 路径、不重新 dump，于是 .config-package.in 变成空壳 → 清单包符号全部判缺
          #（incremental #68 实证）。这里显式 prepare-tmpinfo + oldconfig，并硬门控定义数。
          # 关键：不能删掉整个 tmp/info 目录。scan.mk 要在 tmp/info 下新建
          # .overrides-*/ .files-*/ .packageinfo-* 片段，目录不存在时 touch/find 失败、
          # FILELIST 为空，tmp/.packageinfo 被写成空文件（退出码仍 0）→ PACKAGE 定义 0 个
          #（incremental #69 实证：prepare-tmpinfo “成功”但定义数 0）。
          # 正确做法：保留目录，只清陈旧缓存与 stamp，让 scan.mk 全量重扫。
          rm -rf tmp/info && mkdir -p tmp/info
          rm -f tmp/.packageinfo tmp/.packagedeps tmp/.packageauxvars \
                tmp/.packageusergroup tmp/.config-package.in \
                tmp/.config-feeds.in tmp/.config-target.in
          timeout 1800 bash -c 'make -s prepare-tmpinfo' >/tmp/pkg-tmpinfo.log 2>&1 || {
            tail -n 40 /tmp/pkg-tmpinfo.log
            echo "::error::prepare-tmpinfo 失败（包元数据无法重建）"
            exit 1
          }
          pkgmeta_lines=$(wc -l < tmp/.packageinfo 2>/dev/null || echo 0)
          echo ">>> tmp/.packageinfo 行数 ${pkgmeta_lines}"
          [ "${pkgmeta_lines:-0}" -ge 10000 ] || {
            echo "--- prepare-tmpinfo 日志尾部"
            tail -n 60 /tmp/pkg-tmpinfo.log 2>/dev/null || true
            echo "--- tmp/info 现场"
            ls -l tmp/info 2>/dev/null | tail -n 20 || true
            echo "::error::包扫描未生效（tmp/.packageinfo 仅 ${pkgmeta_lines:-0} 行，scan.mk 未真正扫描）"
            exit 1
          }
          timeout 900 bash -c 'yes "" | make oldconfig' >/tmp/pkg-oldconfig-rebuild.log 2>&1 || {
            tail -n 60 /tmp/pkg-oldconfig-rebuild.log
            echo "::error::包元数据同步失败（oldconfig）"
            exit 1
          }
          # package-metadata.pl 输出的包定义行是 "\tconfig PACKAGE_x"（带一个 TAB 缩进），
          # 用 '^config PACKAGE_' 匹配永远 0 条（#68/#69/#20 的“符号全缺/定义 0 个”都是这个正则假警报）。
          # Kconfig 里缩进无语义，直接把行首缩进抹平，后面所有 ^config PACKAGE_ 判断与 awk 块提取才成立。
          sed -i -E 's/^[[:space:]]+(menuconfig|config) PACKAGE_/\1 PACKAGE_/' tmp/.config-package.in 2>/dev/null || true
          pkgdefs=$(grep -cE '^[[:space:]]*(menu)?config PACKAGE_' tmp/.config-package.in 2>/dev/null || true)
          echo ">>> 包元数据重建：PACKAGE 定义 ${pkgdefs:-0} 个"
          [ "${pkgdefs:-0}" -ge 5000 ] || {
            echo "::error::包元数据重建后定义过少（${pkgdefs:-0}），feeds 扫描未生效"
            ls -l tmp/.config-package.in 2>/dev/null || true
            exit 1
          }
          strip_pkg_sel
          timeout 900 bash -c 'yes "" | make oldconfig' >/tmp/legacy-oldconfig2.log 2>&1 || true
          strip_pkg_sel
          touch .config

          # ④ 硬校验：.config 不得有 kmod/kernel/gpio 选择，元数据不得再含 kernel/gpio 定义
          left_kmod=$(grep -cE '^CONFIG_PACKAGE_kmod-' .config || true)
          left_kernel=$(grep -cE '^CONFIG_PACKAGE_kernel=' .config || true)
          left_gpio=$(grep -cE '^CONFIG_PACKAGE_gpio-button-hotplug=' .config || true)
          echo ">>> 剩余选择 kmod=${left_kmod:-0} kernel=${left_kernel:-0} gpio-button-hotplug=${left_gpio:-0}"
          [ "${left_kmod:-0}" -eq 0 ] && [ "${left_kernel:-0}" -eq 0 ] && [ "${left_gpio:-0}" -eq 0 ] \
            || { echo "::error::.config 里仍有 kmod/kernel 包选择，会触发内核编译"; exit 1; }
          if grep -qE '^[[:space:]]*(menu)?config PACKAGE_(kernel|gpio-button-hotplug)([[:space:]]|$)' tmp/.config-package.in 2>/dev/null; then
            grep -nE '^[[:space:]]*(menu)?config PACKAGE_(kernel|gpio-button-hotplug)([[:space:]]|$)' tmp/.config-package.in || true
            echo "::error::包元数据里仍有 kernel/gpio-button-hotplug 定义，会触发内核编译"
            exit 1
          fi
          echo ">>> 包元数据内 kernel/gpio 定义：0"

      # checkout 会把源码 mtime 刷成"现在"，而缓存解出来的产物保留旧 mtime，
      # make 一比就判定"产物过期"，把已编好的 host tools / toolchain 全部重编一遍
      # （实测这一下要 25-30 分钟）。把产物时间戳顶到未来，源码就永远比产物旧。
      # 只动 host/toolchain 两层：staging_dir/target-* 带 package stamp，
      # 推时间戳会有"stamp 在、apk 不在"的静默丢包风险（固件流注释里已踩过）。
      - name: Normalize cached host/toolchain mtimes
        if: inputs.cache_mode != '完全重建'
        run: |
          set -uo pipefail
          n=0
          for d in build_dir/host build_dir/toolchain-* staging_dir/host staging_dir/toolchain-*; do
            [ -e "$d" ] || continue
            # 只把 stamp 推到未来：make 判定的是「目标比前置新」，若源文件也推成同一刻，
            # 目标与前置等时 → 全部判成过期（extra #49/#50 实测：整套 tools 重编、
            # tools/xxhash 直接失败）。所以 stamp=2035、其余文件压到 2026-06-01（更早）。
            find "$d" -type f ! -path '*/stamp/*' -exec touch -d '2026-06-01 00:00:00' {} + 2>/dev/null || true
            # OpenWrt 的 host 包 stamp 不只在 */stamp/ 目录：新版把 .prepared<hash>/.configured/.built
            # 直接放在 build_dir/<pkg>/ 下（fakeroot/.prepared40996… 即是）。按文件名判定，
            # 否则这些点文件与源文件同一时刻 → 整套 tools 被误判过期重编（extra #55 实测 fakeroot/flex 失败）。
            find "$d" -type f -path '*/stamp/*' -exec touch -d '2035-01-01 00:00:00' {} + 2>/dev/null || true
            find "$d" -type f -regex '.*/\.(prepared|configured|built|installed|depends|quilt|patched|configure)[^/]*' \
              -exec touch -d '2035-01-01 00:00:00' {} + 2>/dev/null || true
            n=$((n+1))
          done
          echo ">>> 时间戳归一：${n} 个目录已归一（stamp=2035、源文件=2026-06-01，make 才会跳过已编产物）"

      - name: Build host tools and toolchain
        run: |
          set -euo pipefail
          # 并发编 tools 偶发失败（fakeroot/flex 同时红、无错误文本）时先串行重试；
          # 仍失败就单编这两个工具并开 V=s，把真实错误行打出来（否则日志只有 "failed to build"）。
          if ! make -j"$(nproc)" tools/compile; then
            echo "::warning::并发编 tools 失败，改串行重试"
            if ! make -j1 tools/compile; then
              for t in flex fakeroot; do
                echo "=== 诊断 tools/$t：缓存 stamp 与产物 ==="
                ls -la build_dir/host/${t}-* 2>/dev/null | head -n 60 || true
                ls -la staging_dir/host/stamp 2>/dev/null | grep -E ".${t}_installed" || true
                ls -la staging_dir/host/bin 2>/dev/null | grep -E "$t" || true
                echo "=== tools/$t 单编（V=s，末尾 150 行）==="
                make -C "tools/$t" compile V=s 2>&1 | tail -n 150 || true
              done
              exit 1
            fi
          fi
          make -j"$(nproc)" toolchain/compile


      - name: List kmod requirements (kmod 由固件流程编译)
        run: |
          set -uo pipefail
          python3 scripts/kmod-demand.py --root . \
            --manifest configs/pon-legacy-packages.txt \
            --only "${{ inputs.only }}" \
            --extra "${{ inputs.extra_packages }}" \
            --fwconfig configs/an7581.config configs/release.config configs/features/kmod-repo.config || true

      # kmod 不在这里编：统一由固件构建流程（fw-build.yml）编译并作为 apk 发布，
      # 保证 build/src/ABI 与固件同一次构建一致（清单见 configs/features/kmod-repo.config）
      - name: Build legacy packages (no silent drop)
        run: |
          set -euo pipefail
          mkdir -p output build_log
          manifest="${{ inputs.manifest }}"
          TMP=/tmp/pkg-manifest.txt
          cp "${{ inputs.manifest }}" "$TMP"
          if [ -n "${{ inputs.extra_packages }}" ]; then
            printf '%s\n' "${{ inputs.extra_packages }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*//' | sed '/^$/d' | \
              while read -r extra; do echo "auto|${extra}|required" >> "$TMP"; done
          fi
          only="${{ inputs.only }}"

          # 源码目录解析：目录名 -> Makefile 里的 Package/<apk> -> PKG_NAME 反查
          # 关键：make 只认 package/feeds/<feed>/<pkg> 这类目标；直接给 feeds/packages/utils/bluez
          # 会报 "make[1]: *** No rule to make target 'feeds/packages/utils/bluez/compile'"
          # （legacy run 44752208306 实测，libdbus/bluez-libs/bluez-daemon/bluez-utils 全挂在这）。
          resolve_path() {
            local apk="$1" hit="" feed cand
            # 1) feeds install 建立的按「包名」链接：最精确，只编这一个包
            for feed in $(ls feeds 2>/dev/null); do
              if [ -e "package/feeds/$feed/$apk" ]; then
                printf '%s' "package/feeds/$feed/$apk"; return
              fi
            done
            # 2) 目录名直接匹配
            hit=$(find package/feeds package -maxdepth 5 \( -type d -o -type l \) -name "$apk" 2>/dev/null | head -n1)
            if [ -n "$hit" ] && [ -f "$hit/Makefile" ]; then printf '%s' "$hit"; return; fi
            # 3) Makefile 里 define Package/<apk> / PKG_NAME 反查，feeds 路径映射成 package/feeds/<feed>/<dir>
            #    需要兼容两种写法：define Package/<apk>/<sub>（子包配置块）、以及
            #    多包共用一个目录时的 $(eval $(call BuildPackage,<apk>))（如 net/frp 产 frpc/frps）。
            #    run 136844207118（legacy #8）里 avahi-daemon / frpc 就是因为这两种写法漏判，
            #    报「源码目录未找到」。
            hit=$(grep -rls --include=Makefile -E "^define[[:space:]]+Package/${apk}(/[A-Za-z0-9_.-]+)?[[:space:]]*\$" package feeds 2>/dev/null | head -n1)
            if [ -z "$hit" ]; then
              hit=$(grep -rls --include=Makefile -E "^PKG_NAME[[:space:]]*[:+]?=[[:space:]]*${apk}[[:space:]]*\$" package feeds 2>/dev/null | head -n1)
            fi
            if [ -z "$hit" ]; then
              hit=$(grep -rls --include=Makefile -E "BuildPackage[,[:space:]]+${apk}([[:space:]]*)[,)]" package feeds 2>/dev/null | head -n1)
            fi
            if [ -n "$hit" ]; then
              cand=$(dirname "$hit")
              case "$cand" in
                feeds/*)
                  feed=$(printf '%s' "$cand" | cut -d/ -f2)
                  hit="package/feeds/$feed/$(basename "$cand")"
                  if [ ! -e "$hit" ]; then
                    mkdir -p "package/feeds/$feed"
                    ln -sfn "$(cd "$cand" && pwd)" "$hit"
                    echo ">>> 补齐 feeds 链接：$hit -> $(cd "$cand" && pwd)" >&2
                  fi
                  ;;
                *) hit="$cand" ;;
              esac
              printf '%s' "$hit"; return
            fi
            printf '%s' ""
          }

          fail=0; summary=""; skipped=""
          # 依赖闭包 + 虚拟包映射（legacy #10/#11 实测的两条根因）：
          #  1) 只补选主包 `CONFIG_PACKAGE_<apk>=m` 不会带出依赖，主包打包时报
          #     Package ffmpeg is missing dependencies for the following libraries: libavcodec…
          #     原本 =y 的库只进镜像、不出 apk，同样被判成「没有提供者」，所以 =y 也降成 =m
          #     （本流程只产 apk、不出镜像，降级不影响镜像）。
          #  2) 有些清单名不是真实包名：avahi-daemon 是 avahi-dbus-daemon/avahi-nodbus-daemon
          #     的 PROVIDES 虚拟名，CONFIG_PACKAGE_avahi-daemon 根本不存在，oldconfig 会把它丢掉；
          #     ffmpeg 有 `@FFMPEG_PROGRAMS` 这类裸符号依赖，必须把 CONFIG_FFMPEG_PROGRAMS=y 补上。
          #     所以这里按 tmp/.packageinfo 的 Provides / Depends 与 tmp/.config-package.in 的
          #     符号表算出「真实包名 alias、=m 包、=y 裸符号」三张清单。
          if [ -f tmp/.packageinfo ]; then
            python3 - "$TMP" <<'PY'
          import re, sys

          menus = set()
          try:
              for line in open('tmp/.config-package.in', encoding='utf-8', errors='replace'):
                  m = re.match(r'config\s+(\S+)', line.strip())
                  if m:
                      menus.add(m.group(1))
          except FileNotFoundError:
              pass

          entries, provides, cur = {}, {}, None
          for line in open('tmp/.packageinfo', encoding='utf-8', errors='replace'):
              line = line.rstrip('\n')
              if line.startswith('Package: '):
                  cur = line.split(': ', 1)[1].strip()
                  entries.setdefault(cur, [])
              elif line.startswith('Depends: ') and cur:
                  deps = []
                  for tok in re.split(r'[,\s]+', line.split(': ', 1)[1]):
                      tok = tok.strip().lstrip('+@')
                      if not tok:
                          continue
                      if ':' in tok:
                          tok = tok.split(':', 1)[1]
                      tok = re.sub(r'\(.*?\)', '', tok).strip()
                      if tok:
                          deps.append(tok)
                  entries[cur] = deps
              elif line.startswith('Provides: ') and cur:
                  for tok in re.split(r'[,\s]+', line.split(': ', 1)[1]):
                      tok = tok.strip()
                      if tok:
                          provides.setdefault(tok, []).append(cur)
              elif not line.strip():
                  cur = None

          targets = []
          for line in open(sys.argv[1], encoding='utf-8'):
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              parts = line.split('|')
              if len(parts) >= 2 and parts[1].strip():
                  targets.append(parts[1].strip())

          def has_sym(n):
              return ('PACKAGE_' + n) in menus or n in menus

          alias = {}
          for t in targets:
              if ('PACKAGE_' + t) in menus:
                  continue
              cands = provides.get(t, [])
              pick = None
              for c in cands:
                  if all(has_sym(d) or d.startswith('kmod-') for d in entries.get(c, [])):
                      pick = c
                      break
              if pick is None and cands:
                  pick = cands[0]
              if pick:
                  alias[t] = pick
                  print('ALIAS %s -> %s（PROVIDES 虚拟名，真实包名才可编）' % (t, pick), file=sys.stderr)

          seen, stack = set(), [alias.get(t, t) for t in targets]
          while stack:
              n = stack.pop()
              if n in seen:
                  continue
              seen.add(n)
              for d in entries.get(n, []):
                  if d.startswith('kmod-') or d in ('kernel', 'libc', 'base-files', 'busybox', 'procd'):
                      continue
                  if d not in seen:
                      stack.append(d)

          lines = []
          for n in sorted(seen):
              if ('PACKAGE_' + n) in menus:
                  lines.append('m|' + n)
              elif n in menus:
                  lines.append('y|' + n)
              else:
                  print('SKIP %s（依赖里既没有 PACKAGE_ 符号也不是菜单符号）' % n, file=sys.stderr)

          with open('/tmp/closure.txt', 'w', encoding='utf-8') as fh:
              fh.write('\n'.join(lines) + ('\n' if lines else ''))
          print('CLOSURE m=%d y=%d' % (len([l for l in lines if l.startswith('m|')]),
                                       len([l for l in lines if l.startswith('y|')])), file=sys.stderr)

          with open('/tmp/alias.txt', 'w', encoding='utf-8') as fh:
              for k, v in sorted(alias.items()):
                  fh.write('%s|%s\n' % (k, v))
          PY
            added=0; bare=0
            while IFS='|' read -r kind name; do
              [ -n "${name:-}" ] || continue
              if [ "$kind" = "m" ]; then
                if grep -q "^CONFIG_PACKAGE_${name}=" .config; then
                  if ! grep -q "^CONFIG_PACKAGE_${name}=m" .config; then
                    sed -i "s/^CONFIG_PACKAGE_${name}=.*/CONFIG_PACKAGE_${name}=m/" .config
                    added=$((added+1))
                  fi
                else
                  printf 'CONFIG_PACKAGE_%s=m\n' "$name" >> .config
                  added=$((added+1))
                fi
              else
                if ! grep -q "^CONFIG_${name}=" .config; then
                  printf 'CONFIG_%s=y\n' "$name" >> .config
                  bare=$((bare+1))
                fi
              fi
            done < /tmp/closure.txt
            echo ">>> 依赖闭包：$(grep -c '^m|' /tmp/closure.txt || true) 个包落成 =m（新加 ${added}），$(grep -c '^y|' /tmp/closure.txt || true) 个裸符号（新加 ${bare}）"
            [ -s /tmp/alias.txt ] && { echo ">>> 虚拟包映射："; cat /tmp/alias.txt; } || true
          else
            echo "::warning::没有 tmp/.packageinfo，跳过依赖闭包（只能逐包补选）"
          fi
          echo ">>> 用 kconfig 解析 select 依赖（oldconfig，不 defconfig，机型行必须保留）"
          set +o pipefail
          yes "" | make oldconfig > build_log/oldconfig-deps.log 2>&1
          rc=$?
          set -o pipefail
          if [ "$rc" != "0" ]; then
            echo "::error::make oldconfig 失败，日志 build_log/oldconfig-deps.log"
            tail -n 40 build_log/oldconfig-deps.log || true
            exit 1
          fi
          grep -q "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_" .config \
            || { echo "::error::oldconfig 之后机型行丢了"; exit 1; }
          echo ">>> =m 符号数：$(grep -c '^CONFIG_PACKAGE_.*=m' .config || true)"
          # ------------------------------------------------------------------
          # 批量编译：把「一个包一次 make」改成「一批包一次 make」。
          # 每次 make 都要重新解析整棵树（feeds 扫描 -> tmp/.packageinfo -> 依赖图），
          # 空转 30-60 秒；清单 29-37 个包 = 20-35 分钟纯启动开销，跟真实编译无关。
          # 增量：bin/packages 已随 tree cache 一起恢复，已编好的包 make 自己会跳过；
          # 这里再按 apk 哈希判定 REUSE，汇报里能区分「本轮真编」与「沿用上轮产物」。
          # ------------------------------------------------------------------
          BATCH="${BATCH_SIZE:-8}"
          bt_path=(); bt_apk=(); bt_apkf=()
          batch_no=0
          : > /tmp/prebuilt.txt
          if [ -d bin/packages ]; then
            ( cd bin/packages && find . -type f -name '*.apk' -exec sha256sum {} + ) >> /tmp/prebuilt.txt 2>/dev/null || true
          fi
          echo ">>> 缓存里已有 apk $(wc -l < /tmp/prebuilt.txt) 个（已编好的包不重编，直接复用）"

          apk_of() { find bin/packages bin/targets -type f -name "$1-[0-9]*.apk" 2>/dev/null | head -n 1; }

          collect_one() {  # $1=apk 文件名基  $2=包名
            local apkf="$1" apk="$2" hit sha tag
            hit=$(apk_of "$apkf")
            if [ -z "$hit" ]; then
              echo "::error::$apk 编译命令成功但没有产出 apk"
              summary="${summary}\nFAIL   $apk（无 apk 产出）"; fail=1
              return 1
            fi
            sha=$(sha256sum "$hit" | awk '{print $1}')
            if grep -q "^$sha" /tmp/prebuilt.txt 2>/dev/null; then tag="REUSE"; else tag="BUILD"; fi
            cp -f "$hit" output/
            summary="${summary}\nOK[$tag] $apk -> $hit"
            echo ">>> OK[$tag] $apk -> $hit"
          }

          flush_batch() {
            if [ "${#bt_path[@]}" -eq 0 ]; then return 0; fi
            local targets=() i
            for i in "${!bt_path[@]}"; do targets+=("${bt_path[$i]}/compile"); done
            batch_no=$((batch_no+1))
            echo ">>> 批量编译 ${#bt_path[@]} 个包（batch-${batch_no}）：${bt_apk[*]}"
            if make -j"$(nproc)" "${targets[@]}" > "build_log/batch-${batch_no}.log" 2>&1; then
              for i in "${!bt_apk[@]}"; do collect_one "${bt_apkf[$i]}" "${bt_apk[$i]}"; done
            else
              echo ">>> batch-${batch_no} 内有失败，逐包复跑定位（日志 build_log/batch-${batch_no}.log）"
              for i in "${!bt_path[@]}"; do build_one "${bt_path[$i]}" "${bt_apk[$i]}" "${bt_apkf[$i]}"; done
            fi
            bt_path=(); bt_apk=(); bt_apkf=()
          }

          build_one() {
            local path="$1" apk="$2" real="$3"
            if make -j"$(nproc)" "$path/compile" 2>&1 | tee "build_log/${apk}.log"; then
              hit=$(find bin/packages bin/targets -type f -name "${real}-[0-9]*.apk" | head -n1)
              if [ -z "$hit" ] && [ "$real" != "$apk" ]; then
                hit=$(find bin/packages bin/targets -type f -name "${apk}-[0-9]*.apk" | head -n1)
              fi
              if [ -n "$hit" ]; then
                summary="${summary}\nOK     $apk -> $hit"
                cp -f "$hit" output/
              else
                echo "::error::$apk 编译命令成功但没有产出 apk"
                summary="${summary}\nFAIL   $apk（无 apk 产出）"; fail=1
              fi
            else
              echo "::error::$apk 编译失败，日志 build_log/${apk}.log"
              { echo; echo ">>> 用 -j1 V=s 复跑取尾部 100 行"; \
                make -j1 V=s "$path/compile" 2>&1 | tail -n 100; } >> "build_log/${apk}.log" || true
              summary="${summary}\nFAIL   $apk（编译失败）"; fail=1
            fi
          }

          touch build_log/.loopstart
          while IFS='|' read -r path apk required; do
            [ -n "${path:-}" ] || continue
            case "$path" in \#*) continue ;; esac

            if [ "$only" != "all" ]; then
              echo ",$only," | grep -q ",$apk," || continue
            fi

            if [ "$path" = "auto" ]; then
              path=$(resolve_path "$apk")
            fi

            if [ -z "$path" ] || [ ! -f "$path/Makefile" ]; then
              if [ "$required" = "optional" ]; then
                echo ">>> SKIP $apk（源码目录未找到，optional）"
                skipped="${skipped}\nSKIP   $apk（源码目录未找到）"
                continue
              fi
              echo "::error::必需包 $apk 的源码目录未找到"
              summary="${summary}\nFAIL   $apk（源码目录未找到）"; fail=1
              continue
            fi

            # 闭包之外仍可能漏选（符号不在 .packageinfo 里，或清单中途加包）：
            # 补一行符号后再跑一次 oldconfig，让 select 把依赖也拉成 =m。
            # 清单名是 PROVIDES 虚拟名时（avahi-daemon），用 alias 换成本次可编的真实包名。
            real="$apk"
            if [ -s /tmp/alias.txt ]; then
              got=$(awk -F'|' -v w="$apk" '$1==w{print $2}' /tmp/alias.txt | head -n1)
              [ -n "$got" ] && real="$got"
            fi
            if [ "$real" != "$apk" ]; then
              echo ">>> ${apk} 是虚拟名，实际编 ${real}"
            fi
            if ! grep -q "^CONFIG_PACKAGE_${real}=" .config; then
              printf 'CONFIG_PACKAGE_%s=m\n' "$real" >> .config
              echo ">>> 补选 CONFIG_PACKAGE_${real}=m（原未选中；不补只会编源码、不产出 apk）"
              set +o pipefail
              yes "" | make oldconfig > "build_log/oldconfig-${apk}.log" 2>&1
              orc=$?
              set -o pipefail
              if [ "$orc" != "0" ]; then
                echo "::error::make oldconfig 失败（解析 ${apk} 依赖），日志 build_log/oldconfig-${apk}.log"
                summary="${summary}\nFAIL   $apk（oldconfig 失败）"; fail=1
                continue
              fi
              if ! grep -q "^CONFIG_PACKAGE_${real}=" .config; then
                echo "::error::${apk}（真实包 ${real}）的 CONFIG 符号不存在（oldconfig 已丢弃），检查包名与 Makefile 的 define Package/ 是否一致"
                summary="${summary}\nFAIL   $apk（符号不存在）"; fail=1
                continue
              fi
            fi

            echo ">>> 入批 $apk ($path)（真实包名 ${real}）"
            bt_path+=("$path"); bt_apk+=("$apk"); bt_apkf+=("$real")
            if [ "${#bt_path[@]}" -ge "$BATCH" ]; then flush_batch; fi
          done < "$manifest"
          flush_batch

          # 依赖包（libavcodec / libz / avahi 库 …）也要进产物，否则主包 apk 在设备上装不上。
          # 用循环前的时间戳界定「本次新编出来的 apk」，全部收进 output（同名覆盖去重）。
          if [ -f build_log/.loopstart ]; then
            n=0
            while read -r f; do
              [ -n "$f" ] || continue
              if cp -f "$f" output/ 2>/dev/null; then n=$((n+1)); fi
            done < <(find bin/packages bin/targets -type f -name '*.apk' -newer build_log/.loopstart 2>/dev/null)
            echo ">>> 连同依赖包一起收集：本次新增 apk ${n} 个（含清单内主包）"
          fi

          {
            echo "# 旧仓遗留包逐包结果（${{ inputs.device }} / only=$only）"
            echo -e "$summary"
            [ -n "$skipped" ] && echo -e "\n$skipped" || true
          } > build_log/legacy-package-summary.txt
          cat build_log/legacy-package-summary.txt
          {
            echo "### 旧仓遗留包逐包结果（${{ inputs.device }} / only=$only）"
            echo '```'
            cat build_log/legacy-package-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cd output
          for f in *; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done
          exit $fail

      - name: Record ABI snapshot (兼容性核对用)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p output
          {
            echo "device=${{ inputs.device }}"
            echo "commit=${GITHUB_SHA}"
            echo "run=${{ github.run_number }}"
            echo "kernel_release=$(cat build_dir/target-*/linux-*/include/config/kernel.release 2>/dev/null | head -n1)"
            ko=$(find build_dir/target-*/linux-*/ -name '*.ko' 2>/dev/null | head -n1 || true)
            [ -n "$ko" ] && echo "kmod_vermagic=$(modinfo -F vermagic "$ko" 2>/dev/null)"
            echo "apk_pubkey_sha256=$(sha256sum public-key.pem 2>/dev/null | cut -d' ' -f1)"
            echo "config_6_18_sha256=$(sha256sum target/linux/airoha/an7581/config-6.18 2>/dev/null | cut -d' ' -f1)"
          } > output/abi-info.txt
          cat output/abi-info.txt

      - name: Export apk signing public key
        if: always()
        run: |
          set -uo pipefail
          mkdir -p output
          if [ -f public-key.pem ]; then
            cp -f public-key.pem output/public-key.pem
            sha256sum public-key.pem | tee output/public-key.pem.sha256
          else
            echo "::warning::本 run 未生成 public-key.pem"
          fi

      - name: Save host toolchain cache
        if: always() && inputs.reuse_build_tree && inputs.cache_mode != '完全重建' && steps.hosttc.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir/toolchain-*
            staging_dir/toolchain-*
          key: ponwrt-hosttc-v1-${{ hashFiles('toolchain/**', 'configs/an7581.config', 'configs/release.config') }}

      - name: Save downloads cache
        if: always() && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ponwrt-dl-pkg-${{ hashFiles('feeds.conf.default', 'configs/**/*.config') }}-${{ github.run_id }}

      - name: Save compiler ccache
        if: always() && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ponwrt-ccache-pkg-${{ inputs.device }}-${{ github.run_id }}

      - name: Save build tree cache
        if: always() && inputs.reuse_build_tree && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir/target-*
            build_dir/host
            staging_dir/target-*
            staging_dir/host
            bin/packages
          key: ponwrt-tree-${{ inputs.device }}-legacy-${{ hashFiles('configs/**/*.config', 'target/linux/airoha/an7581/config-6.18', 'target/linux/generic/kernel-6.18', 'package/**', 'target/linux/**') }}-${{ github.run_id }}

      - name: Stage host apk tool for the publish workflow
        if: always()
        run: |
          set -uo pipefail
          # pkg-publish.yml 用同一份 host apk 生成并签名索引，避免两处工具版本不一致
          mkdir -p pubtool
          for c in staging_dir/host/bin/apk build_dir/host*/apk-*/apk; do
            if [ -f "$c" ] && [ -x "$c" ]; then
              cp -f "$c" pubtool/apk
              chmod +x pubtool/apk
              break
            fi
          done
          if [ -x pubtool/apk ]; then
            ./pubtool/apk --version || true
            sha256sum pubtool/apk
          else
            echo "::warning::本 run 没有可用的 host apk，publish 工作流需要它来签索引"
          fi
      - name: Upload packages artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-legacy-packages-${{ inputs.device }}-${{ github.run_number }}
          path: |
            output/*
            build_log/legacy-package-summary.txt
            build_log/*.log
            pubtool/apk
          retention-days: 14

      - name: Publish prerelease (本仓, apk + 公钥)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(output/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::output 为空，跳过本仓预发布"
            exit 0
          fi
          tag="pkgs-legacy-${{ inputs.device }}-r${{ github.run_number }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo ">>> 复用已有预发布 $tag"
          else
            gh release create "$tag" \
              --prerelease \
              --title "apk $tag" \
              --notes "device=${{ inputs.device }} run=${{ github.run_number }} commit=${{ github.sha }}；同私钥签名，公钥 public-key.pem(.sha256) 随包发布。"
          fi
          # 一次性丢几百个资产会撞 GitHub 二级限流（HTTP 403 secondary rate limit），
          # 改成一个一个传、失败退避重试；仍失败的记账后统一报错（重跑会 --clobber 补齐）。
          fail=0
          for f in "${files[@]}"; do
            ok=0
            for i in 1 2 3 4 5; do
              if gh release upload "$tag" "$f" --clobber; then ok=1; break; fi
              echo "::warning::上传 $f 第 $i 次失败，退避 $((i*10))s 后重试"
              sleep $((i*10))
            done
            if [ "$ok" -eq 0 ]; then
              echo "::warning::上传最终失败：$f"
              fail=1
            fi
            sleep 1
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::有资产没传上去（多为 GitHub 二级限流；重跑本工作流会 --clobber 补齐）"
            exit 1
          fi
          echo ">>> 已发布 $tag：${#files[@]} 个资产"

