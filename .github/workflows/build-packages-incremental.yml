name: Build Packages (userland only, incremental) manual

# ==============================================================================
# 只允许手动触发（workflow_dispatch）：无 push / schedule 触发。
#
# 设计要点
# 1) 与固件同源：本工作流用 configs/an7581.config + release.config +
#    pon-packages/*.config 生成与固件完全一致的 .config，编 host 工具链后直接编
#    **非 kmod 的用户态包**。本流程不含内核树步骤（原内核树开关已移除），
#    kmod 一律由 fw-build.yml 编，本流程也不选任何 kmod。
# 2) 增量：dl / .ccache / build_dir / staging_dir 全部走滚动缓存（key 带 run_id，
#    restore-keys 前缀命中上一轮），命中后 make 自身按时间戳跳过未变目标；
#    再配合 inputs.only 只编指定包，单个包改动只重编该包及其依赖。
# 3) 不静默丢弃：按 configs/pon-userspace-packages.txt 逐包核对真实 apk，
#    缺包、目录缺失、编译失败都会让 job 失败并在 summary 里列出。
# 4) 发布口径：本文件只出 artifact 与本仓 prerelease，**不 push apk-repo**；
#    进软件仓库（能力分组目录 + 签名索引）统一由 .github/workflows/pkg-publish.yml 做。
# 5) kmod 归属：本流程只编用户态包；所有 kmod（usb/wifi/bt/uvc/fs/iptv 之外的内置驱动）
#    由固件构建流程 fw-build.yml 在同一次构建里编成 apk，随固件 artifact 与
#    `kmods-<label>-r<run>` 预发布一起交付，再统一由 pkg-publish.yml 进软件仓库。
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      device:
        description: '目标机型（决定 .config 里的设备锁定）'
        required: true
        default: 'hg5585f-ct'
        type: choice
        options:
          - 'hg5585f-ct'
          - 'hg5382a'
      cache_mode:
        description: '缓存模式（完全重建会丢弃所有缓存）'
        required: true
        default: '使用缓存'
        type: choice
        options:
          - '使用缓存'
          - '完全重建'
      reuse_build_tree:
        description: '复用 build_dir/staging_dir 缓存（数 GB，命中才是真增量）'
        required: true
        default: true
        type: boolean
      only:
        description: '只编这些 apk（逗号分隔，all=全部；例：tempinfo,camlive）'
        required: true
        default: 'all'
        type: string

      source_mode:
        description: '源码对齐方式（已弃用：包流程只编应用层，恒用本仓 HEAD）'
        required: true
        default: '追固件源码'
        type: choice
        options:
          - '追固件源码'
          - '用本仓HEAD'

concurrency:
  group: manual-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_MAXSIZE: 5G
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  packages:
    name: Build packages (${{ inputs.device }})
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record source tree (userland-only build)
        run: |
          set -euo pipefail
          # 包流程只编用户态应用：不产 kmod、不编内核、也不组装镜像。
          # 因此不再读取固件基线 meta/firmware.json，也不再按固件 commit 切源码树——
          # kmod 的 vermagic 一致性由固件流程独家负责，应用层 apk 与内核版本无关。
          mode="${{ inputs.source_mode }}"
          cur=$(git rev-parse HEAD)
          echo ">>> 包流程只编应用层，不读固件基线；源码树=本仓 HEAD commit=$cur（source_mode=$mode 不再触发切树）"
          {
            echo "aligned_commit=$(git rev-parse HEAD)"
            echo "firmware_commit=none"
            echo "firmware_kernel=none"
            echo "firmware_device=none"
            echo "source_mode=$mode"
          } > .ci-source-commit
          cat .ci-source-commit


      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full pahole patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Install fixed apk signing key
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${APK_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::仓库未配置 APK_SIGNING_PRIVATE_KEY（全仓库固定同一把私钥），本次构建不能继续"
            exit 1
          fi
          # rules.mk: BUILD_KEY_APK_SEC=$(TOPDIR)/private-key.pem / BUILD_KEY_APK_PUB=$(TOPDIR)/public-key.pem
          # 全仓库固定同一把密钥：设备只需装一次 /etc/apk/keys/public-key.pem
          printf '%s\n' "$APK_SIGNING_PRIVATE_KEY" > private-key.pem
          chmod 600 private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem
          sha256sum public-key.pem
          # 全链路只用同一把既有密钥：指纹对不上就立刻失败，避免"包签出来了但设备不认"
          got=$(sha256sum public-key.pem | cut -d' ' -f1)
          if [ "$got" != "d557dca1a8b8d30b48f7e4b910908342789d389a52db3d7225c6b72840eda4ed" ]; then
            echo "::error::APK_SIGNING_PRIVATE_KEY 派生公钥指纹 $got 与既有密钥不一致"
            exit 1
          fi
          echo ">>> 公钥指纹与既有密钥一致：$got"

      - name: Restore build tree cache (真增量的关键)
        if: inputs.reuse_build_tree && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build_dir/target-*
            build_dir/host
            staging_dir/target-*
            staging_dir/host
            bin/packages
          key: ponwrt-tree-${{ inputs.device }}-inc-${{ hashFiles('configs/**/*.config', 'target/linux/airoha/an7581/config-6.18', 'target/linux/generic/kernel-6.18', 'feeds.conf.default', 'package/**', 'target/linux/**') }}-${{ github.run_id }}
          # 只复用「同一源码 commit + 同一配置」的树：跨 commit 复用会把别的内核的
          # build_dir/staging_dir 拉回来，正是 kmod ABI 对不上的一大来源
          restore-keys: |
            ponwrt-tree-${{ inputs.device }}-inc-${{ hashFiles('configs/**/*.config', 'target/linux/airoha/an7581/config-6.18', 'target/linux/generic/kernel-6.18', 'feeds.conf.default', 'package/**', 'target/linux/**') }}-

      # 交叉工具链（gcc/binutils/musl）单独一份稳定 key 的缓存：
      # 原来它跟着 tree cache 走（key 带 run/sha，等于每 run 重存 300-400MB），
      # 而包流的 tree cache 根本没纳入 toolchain 路径 → 每轮重编 ~30 分钟。
      # 这里用「工具链源码内容哈希」做 key，命中一次就一直复用，
      # 只在新工具链源码/目标配置变化时自动失效并重建。
      - name: Restore host toolchain cache
        id: hosttc
        if: inputs.reuse_build_tree && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build_dir/toolchain-*
            staging_dir/toolchain-*
          key: ponwrt-hosttc-v1-${{ hashFiles('toolchain/**', 'configs/an7581.config', 'configs/release.config') }}

      - name: Restore downloads cache
        if: inputs.cache_mode != '完全重建'
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: ponwrt-dl-pkg-${{ hashFiles('feeds.conf.default', 'configs/**/*.config') }}-${{ github.run_id }}
          restore-keys: |
            ponwrt-dl-pkg-${{ hashFiles('feeds.conf.default', 'configs/**/*.config') }}-
            ponwrt-dl-pkg-

      - name: Restore compiler ccache
        if: inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ponwrt-ccache-pkg-${{ inputs.device }}-${{ github.run_id }}
          restore-keys: |
            ponwrt-ccache-pkg-${{ inputs.device }}-
            ponwrt-ccache-pkg-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Preflight 检查依赖内核树的包（只能随固件编）
        run: |
          set -euo pipefail
          # 口径：包流程只收纯用户态包（只依赖 arch + libc + uapi）。
          # 下列特征说明该包在构建期读内核源码树的派生物，产物与具体内核 config 绑定：
          # 换 config（例如 WED 分支多打 NPU/WED 补丁、改 DRAM 布局）后结构体偏移/内核符号
          # 全部失配，装上去不能正常运行。因此这类包只能随固件一起编（fw-build.yml），
          # 不许进包流程。
          hits=""
          defused=""
          for manifest in configs/pon-*.txt; do
            [ -f "$manifest" ] || continue
            while IFS='|' read -r path apk required; do
              [ -n "${path:-}" ] || continue
              case "$path" in \#*) continue ;; esac
              dir="$path"
              if [ ! -d "$dir" ]; then
                base=$(basename "$path")
                dir=$(find package/feeds feeds -maxdepth 4 \( -type d -o -type l \) -name "$base" 2>/dev/null | head -n 1 || true)
                { [ -n "$dir" ] && [ -f "$dir/Makefile" ]; } || dir=""
              fi
              [ -n "$dir" ] && [ -f "$dir/Makefile" ] || continue
              hit=""
              for pat in '$(LINUX_DIR)' '${LINUX_DIR}' '$(LINUX_KARCH)' 'vmlinux'; do
                line=$(grep -nF -- "$pat" "$dir/Makefile" 2>/dev/null | head -n 2 || true)
                [ -n "$line" ] && hit="${hit}      ${pat}: ${line}\n"
              done
              # KERNEL_MAKE 例外：只在「+$(KERNEL_MAKE) ... M="..." modules」这种整段可摘除的
              # 形态才放行（open-app-filter 的 oaf.ko 就是它自己的 Makefile 顺手编的）。
              # 真正要编内核状态模块（读 LINUX_DIR/KARCH）的包仍然在这里被拒。
              # 摘除动作在后面的 Strip 步骤里做（会硬校验 KERNEL_MAKE 已不存在）。
              if grep -q 'KERNEL_MAKE' "$dir/Makefile"; then
                if grep -qE '^[[:space:]]*\+\$\(KERNEL_MAKE\)' "$dir/Makefile"; then
                  defused="${defused}  ${apk} (${dir})\n"
                else
                  hit="${hit}      KERNEL_MAKE: $(grep -nF 'KERNEL_MAKE' "$dir/Makefile" | head -n 2)\n"
                fi
              fi
              if [ -n "$hit" ]; then
                hits="${hits}  ${manifest} :: ${apk} (${dir})\n${hit}"
              fi
            done < "$manifest"
          done
          if [ -n "$defused" ]; then
            echo ">>> 预检放行（编译前会摘除 Makefile 里的内核编译段）："
            echo -e "$defused"
          fi
          if [ -n "$hits" ]; then
            echo "::error::清单内存在需要内核源码树的包，必须随固件（fw-build）编译，不能进包流程："
            echo -e "$hits"
            exit 1
          fi
          echo ">>> 预检通过：清单内全部为纯用户态包"

      - name: Prepare custom packages and patches
        run: |
          bash ./scripts/customize.sh

      - name: Configure (same as firmware)
        run: |
          set -euo pipefail

          # kconfig.pl 的 + 是【二元】操作符（parse_expr 里 '+' 吃两个操作数），
          # 语法是 E = '+' E E | 文件名，所以 N 个文件必须用 N-1 个 +，
          # 且【最后一个文件前面不加 +】：`+ f1 + f2 f3`
          #   · `+ f1 f2 f3`     → 多余参数残留，die "Parse error" line 189
          #   · `+ f1 + f2 + f3` → 最内层 + 缺第二个操作数，die "Parse error" line 144
          files=(configs/an7581.config configs/release.config configs/pon-packages/*.config)
          merge_args=()
          n=${#files[@]}
          for ((i=0; i<n; i++)); do
            if [ "$i" -lt "$((n-1))" ]; then
              merge_args+=("+" "${files[$i]}")
            else
              merge_args+=("${files[$i]}")
            fi
          done
          echo ">>> kconfig.pl ${merge_args[*]}"
          ./scripts/kconfig.pl "${merge_args[@]}" > .config

          sed -i '/^CONFIG_KERNEL_DEBUG_INFO_REDUCED=/d' .config
          printf 'CONFIG_KERNEL_DEBUG_INFO=y\n# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set\nCONFIG_KERNEL_DEBUG_INFO_BTF=y\nCONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y\nCONFIG_KERNEL_MODULE_ALLOW_BTF_MISMATCH=y\nCONFIG_KERNEL_KPROBES=y\nCONFIG_KERNEL_BPF_EVENTS=y\n' >> .config

          if [ "${{ inputs.cache_mode }}" != "完全重建" ]; then
            sed -i '/^CONFIG_DEVEL=/d; /^CONFIG_CCACHE=/d' .config
            printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
          fi

          make defconfig

          # 机型锁定：defconfig 之后只保留本次目标机型，之后不再 defconfig
          case "${{ inputs.device }}" in
            hg5585f-ct) DEVICE="fiberhome_hg5585f-ct" ;;
            hg5382a)    DEVICE="fiberhome_hg5382a" ;;
            *)          echo "::error::未知机型 ${{ inputs.device }}"; exit 1 ;;
          esac
          sed -i '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          sed -i '/^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.* is not set/d' .config
          printf 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_%s=y\n' "$DEVICE" >> .config
          grep -q "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${DEVICE}=y" .config \
            || { echo "::error::机型符号未落地: $DEVICE"; exit 1; }

      - name: Record kernel ABI pin (kmod 必须与固件同树同配置)
        run: |
          set -euo pipefail
          mkdir -p output
          {
            echo "device=${{ inputs.device }}"
            echo "repo_commit=$(git rev-parse HEAD)"
            echo "config_6_18_sha256=$(sha256sum target/linux/airoha/an7581/config-6.18 | awk '{print $1}')"
            echo "feeds_conf_sha256=$(sha256sum feeds.conf.default | awk '{print $1}')"
            echo "note=安装 kmod apk 前必须确认固件来自同一 commit 且 config-6.18 未变"
          } | tee output/build-info.txt

      - name: Strip kmod / kernel selections (内核模块统一由固件流程编译)
        run: |
          set -euo pipefail
          # 设计口径：kmod 只由 fw-build 编（与固件同树同配置，vermagic 一致）。
          # run 45604647722 / 45604653366 实证：只在 .config 里写 not set 不够——
          # package/kernel/linux/Makefile 第 50 行硬写 CONFIG_PACKAGE_kernel=y 且无条件
          # BuildPackage,kernel（hidden + default y），gpio-button-hotplug 是 KernelPackage
          # （用 KERNEL_MAKE 编）；两者只要还在包元数据里，每次 syncconfig 都会把它们
          # 写回 y，任何 make package/.../compile 都先把内核拉进依赖链，包流没有内核
          # 构建产物 → ERROR: package/kernel/linux failed to build（modules.builtin 缺失）。
          # 因此：① 在 CI 树内摘掉这两个包定义（不改仓库、不碰内核源码，modules/*.mk
          # 里的 kmod 定义保留）；② 清单包 Makefile 摘掉 +kmod-*/+kernel/+gpio-button-hotplug；
          # ③ 删 tmpinfo 后 oldconfig 重建，再在 .config 里显式 not set 并硬校验为零。
          strip_pkg_sel() {
            awk '
              /^CONFIG_PACKAGE_(kmod-[^=]*|gpio-button-hotplug|kernel)=/ {
                split($0, a, "="); print "# " a[1] " is not set"; next
              }
              { print }
            ' .config > .config.strip && mv .config.strip .config
          }

          # ① 摘掉 kernel 元包与 gpio-button-hotplug 的包定义
          kf=package/kernel/linux/Makefile
          gf=package/kernel/gpio-button-hotplug/Makefile
          for f in "$kf" "$gf"; do
            [ -f "$f" ] || { echo "::error::缺少 $f"; exit 1; }
          done
          grep -q 'BuildPackage,kernel' "$kf" || { echo "::error::$kf 形态变化：未找到 BuildPackage,kernel"; exit 1; }
          grep -q 'KernelPackage,gpio-button-hotplug' "$gf" || { echo "::error::$gf 形态变化：未找到 KernelPackage,gpio-button-hotplug"; exit 1; }
          awk '
            /^CONFIG_PACKAGE_kernel=y$/ { print "# CI(pkgs): kernel 元包由固件流程编，包流内摘除"; next }
            /BuildPackage,kernel/ { print "# CI(pkgs): " $0 "  # disabled: userland-only pkg flow"; next }
            { print }
          ' "$kf" > "$kf.ci" && mv "$kf.ci" "$kf"
          awk '
            /KernelPackage,gpio-button-hotplug/ { print "# CI(pkgs): " $0 "  # disabled: needs kernel tree"; next }
            { print }
          ' "$gf" > "$gf.ci" && mv "$gf.ci" "$gf"
          echo ">>> 已在树内摘除 kernel 元包与 gpio-button-hotplug 的包定义"

          # ② 清单包 Makefile 摘掉 kmod / kernel / gpio 依赖
          : > /tmp/stripped-kmods.txt
          touched=0
          for manifest in configs/pon-userspace-packages.txt configs/pon-extra-packages.txt; do
            [ -f "$manifest" ] || continue
            while IFS='|' read -r path apk required; do
              [ -n "${path:-}" ] || continue
              case "$path" in \#*) continue ;; esac
              [ -f "$path/Makefile" ] || continue
              hits=$(grep -oE '\+(kmod-[A-Za-z0-9_.+-]+|kernel|gpio-button-hotplug)' "$path/Makefile" | sed 's/^+//' | sort -u || true)
              [ -n "$hits" ] || continue
              sed -i -E 's/\+(kmod-[A-Za-z0-9_.+-]+|kernel|gpio-button-hotplug)//g' "$path/Makefile"
              sed -i -E '/^[[:space:]]*DEPENDS/ s/[[:space:]]+/ /g; /^[[:space:]]*DEPENDS/ s/[[:space:]]+$//' "$path/Makefile"
              touched=$((touched+1))
              printf '%s\n' "$hits" >> /tmp/stripped-kmods.txt
              echo ">>> 摘掉依赖：$apk ->$(printf ' %s' $hits)"
            done < "$manifest"
          done
          sort -u /tmp/stripped-kmods.txt -o /tmp/stripped-kmods.txt
          echo ">>> 共 $touched 个包、$(wc -l < /tmp/stripped-kmods.txt) 个不同依赖被摘除（kmod 由固件流程编）"
          { echo "### 已摘除的 kmod 依赖（由固件流程编译）"; echo '```'; cat /tmp/stripped-kmods.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          # ③ 重建包元数据（此时元数据里已无 kernel/gpio 定义），再清洁 .config
          # 元数据重建：必须连扫描缓存一起清（tmp/info 里的 .scan-*.stamp 与 .files-*）。
          # 只删 tmp/.packageinfo 时，prepare-tmpinfo 的 scan_unchanged 会走「未变化」快
          # 路径、不重新 dump，于是 .config-package.in 变成空壳 → 清单包符号全部判缺
          #（incremental #68 实证）。这里显式 prepare-tmpinfo + oldconfig，并硬门控定义数。
          # 关键：不能删掉整个 tmp/info 目录。scan.mk 要在 tmp/info 下新建
          # .overrides-*/ .files-*/ .packageinfo-* 片段，目录不存在时 touch/find 失败、
          # FILELIST 为空，tmp/.packageinfo 被写成空文件（退出码仍 0）→ PACKAGE 定义 0 个
          #（incremental #69 实证：prepare-tmpinfo “成功”但定义数 0）。
          # 正确做法：保留目录，只清陈旧缓存与 stamp，让 scan.mk 全量重扫。
          rm -rf tmp/info && mkdir -p tmp/info
          rm -f tmp/.packageinfo tmp/.packagedeps tmp/.packageauxvars \
                tmp/.packageusergroup tmp/.config-package.in \
                tmp/.config-feeds.in tmp/.config-target.in
          timeout 1800 bash -c 'make -s prepare-tmpinfo' >/tmp/pkg-tmpinfo.log 2>&1 || {
            tail -n 40 /tmp/pkg-tmpinfo.log
            echo "::error::prepare-tmpinfo 失败（包元数据无法重建）"
            exit 1
          }
          pkgmeta_lines=$(wc -l < tmp/.packageinfo 2>/dev/null || echo 0)
          echo ">>> tmp/.packageinfo 行数 ${pkgmeta_lines}"
          [ "${pkgmeta_lines:-0}" -ge 10000 ] || {
            echo "--- prepare-tmpinfo 日志尾部"
            tail -n 60 /tmp/pkg-tmpinfo.log 2>/dev/null || true
            echo "--- tmp/info 现场"
            ls -l tmp/info 2>/dev/null | tail -n 20 || true
            echo "::error::包扫描未生效（tmp/.packageinfo 仅 ${pkgmeta_lines:-0} 行，scan.mk 未真正扫描）"
            exit 1
          }
          timeout 900 bash -c 'yes "" | make oldconfig' >/tmp/pkg-oldconfig-rebuild.log 2>&1 || {
            tail -n 60 /tmp/pkg-oldconfig-rebuild.log
            echo "::error::包元数据同步失败（oldconfig）"
            exit 1
          }
          # package-metadata.pl 输出的包定义行是 "\tconfig PACKAGE_x"（带一个 TAB 缩进），
          # 用 '^config PACKAGE_' 匹配永远 0 条（#68/#69/#20 的“符号全缺/定义 0 个”都是这个正则假警报）。
          # Kconfig 里缩进无语义，直接把行首缩进抹平，后面所有 ^config PACKAGE_ 判断与 awk 块提取才成立。
          sed -i -E 's/^[[:space:]]+config PACKAGE_/config PACKAGE_/' tmp/.config-package.in 2>/dev/null || true
          pkgdefs=$(grep -cE '^[[:space:]]*config PACKAGE_' tmp/.config-package.in 2>/dev/null || true)
          echo ">>> 包元数据重建：PACKAGE 定义 ${pkgdefs:-0} 个"
          [ "${pkgdefs:-0}" -ge 5000 ] || {
            echo "::error::包元数据重建后定义过少（${pkgdefs:-0}），feeds 扫描未生效"
            ls -l tmp/.config-package.in 2>/dev/null || true
            exit 1
          }
          strip_pkg_sel
          timeout 900 bash -c 'yes "" | make oldconfig' >/tmp/inc-oldconfig2.log 2>&1 || true
          strip_pkg_sel
          touch .config

          # ④ 硬校验：.config 不得有 kmod/kernel/gpio 选择，元数据不得再含 kernel/gpio 定义
          left_kmod=$(grep -cE '^CONFIG_PACKAGE_kmod-' .config || true)
          left_kernel=$(grep -cE '^CONFIG_PACKAGE_kernel=' .config || true)
          left_gpio=$(grep -cE '^CONFIG_PACKAGE_gpio-button-hotplug=' .config || true)
          echo ">>> 剩余选择 kmod=${left_kmod:-0} kernel=${left_kernel:-0} gpio-button-hotplug=${left_gpio:-0}"
          [ "${left_kmod:-0}" -eq 0 ] && [ "${left_kernel:-0}" -eq 0 ] && [ "${left_gpio:-0}" -eq 0 ] \
            || { echo "::error::.config 里仍有 kmod/kernel 包选择，会触发内核编译"; exit 1; }
          if grep -qE '^[[:space:]]*config PACKAGE_(kernel|gpio-button-hotplug)([[:space:]]|$)' tmp/.config-package.in 2>/dev/null; then
            grep -nE '^[[:space:]]*config PACKAGE_(kernel|gpio-button-hotplug)([[:space:]]|$)' tmp/.config-package.in || true
            echo "::error::包元数据里仍有 kernel/gpio-button-hotplug 定义，会触发内核编译"
            exit 1
          fi
          echo ">>> 包元数据内 kernel/gpio 定义：0"
          # ⑤ 清单包显式选中：包流 .config 来自固件配置，清单里的包未必在其中。
          #    没有 CONFIG_PACKAGE_<符号>=m 时 make <path>/compile 只做 build 不打包，
          #    表现为「编译命令成功但没有产出 apk」（run 45625439183 的 camlive/tailscale/cifs-utils）。
          #    清单第二列是 apk 文件名（可能带 ABI 后缀或为虚拟名），符号一律经
          #    scripts/pkg-name-map.sh 映射后再写 .config；符号是否存在由 oldconfig 后的
          #    .config 硬校验判定（映射覆盖不到的真名错误会在此报红，不静默丢）。
          . scripts/pkg-name-map.sh
          only_pkgs="${{ inputs.only }}"
          selmiss=""
          manifest=configs/pon-userspace-packages.txt
          while IFS='|' read -r pkgpath pkgname pkgreq; do
            [ -n "${pkgpath:-}" ] || continue
            case "$pkgpath" in \#*) continue ;; esac
            if [ "$only_pkgs" != "all" ]; then
              echo ",$only_pkgs," | grep -q ",${pkgname}," || continue
            fi
            [ -d "$pkgpath" ] || continue
            sym=$(pkg_sym_for "$pkgname")
            grep -qE "^CONFIG_PACKAGE_${sym}=[ym]$" .config && continue
            sed -i "/^CONFIG_PACKAGE_${sym}=/d; /^# CONFIG_PACKAGE_${sym} is not set/d" .config
            printf 'CONFIG_PACKAGE_%s=m\n' "$sym" >> .config
            if [ "$sym" = "$pkgname" ]; then
              echo ">>> 显式选中清单包 ${pkgname}=m"
            else
              echo ">>> 显式选中清单包 ${pkgname} -> ${sym}=m（apk 文件名 $(pkg_apk_for "$pkgname")）"
            fi
          done < "$manifest"
          timeout 900 bash -c 'yes "" | make oldconfig' >/tmp/pkg-oldconfig-sel.log 2>&1 || {
            tail -n 40 /tmp/pkg-oldconfig-sel.log
            echo "::error::清单包选择同步失败（oldconfig）"
            exit 1
          }
          strip_pkg_sel
          while IFS='|' read -r pkgpath pkgname pkgreq; do
            [ -n "${pkgpath:-}" ] || continue
            case "$pkgpath" in \#*) continue ;; esac
            if [ "$only_pkgs" != "all" ]; then
              echo ",$only_pkgs," | grep -q ",${pkgname}," || continue
            fi
            [ -d "$pkgpath" ] || continue
            sym=$(pkg_sym_for "$pkgname")
            grep -qE "^CONFIG_PACKAGE_${sym}=[ym]$" .config || selmiss="$selmiss ${pkgname}(符号 ${sym})"
          done < "$manifest"
          [ -z "$selmiss" ] || { echo "::error::清单包在 .config 未被选中（包名不存在或依赖不可选）:${selmiss}"; exit 1; }
          echo ">>> 清单包全部已在 .config 选中（kmod/kernel/gpio 选择仍为 0）"

      # checkout 会把源码 mtime 刷成"现在"，而缓存解出来的产物保留旧 mtime，
      # make 一比就判定"产物过期"，把已编好的 host tools / toolchain 全部重编一遍
      # （实测这一下要 25-30 分钟）。把产物时间戳顶到未来，源码就永远比产物旧。
      # 只动 host/toolchain 两层：staging_dir/target-* 带 package stamp，
      # 推时间戳会有"stamp 在、apk 不在"的静默丢包风险（固件流注释里已踩过）。
      - name: Normalize cached host/toolchain mtimes
        if: inputs.cache_mode != '完全重建'
        run: |
          set -uo pipefail
          n=0
          for d in build_dir/host build_dir/toolchain-* staging_dir/host staging_dir/toolchain-*; do
            [ -e "$d" ] || continue
            find "$d" -type f -exec touch -d '2035-01-01 00:00:00' {} + 2>/dev/null || true
            n=$((n+1))
          done
          echo ">>> 时间戳归一：${n} 个目录已推到 2035-01-01（make 才会跳过已编产物）"

      - name: Build host tools and toolchain
        run: |
          set -euo pipefail
          make -j"$(nproc)" tools/compile
          make -j"$(nproc)" toolchain/compile


      - name: List kmod requirements (kmod 由固件流程编译)
        run: |
          set -uo pipefail
          python3 scripts/kmod-demand.py --root . \
            --manifest configs/pon-userspace-packages.txt \
            --only "${{ inputs.only }}" \
            --fwconfig configs/an7581.config configs/release.config configs/features/kmod-repo.config || true

      # kmod 不在这里编：统一由固件构建流程（fw-build.yml）编译并作为 apk 发布，
      # 保证 build/src/ABI 与固件同一次构建一致（清单见 configs/features/kmod-repo.config）
      - name: Build pon-userspace packages (incremental, no silent drop)
        run: |
          set -euo pipefail
          mkdir -p output build_log
          . scripts/pkg-name-map.sh
          manifest="configs/pon-userspace-packages.txt"
          [ -f "$manifest" ] || { echo "::error::缺少 $manifest"; exit 1; }
          # 诊断：luci 应用报 “No rule to make target <path>/compile” 说明扫描未登记该包，先把证据落盘
          {
            echo "--- feeds/luci/luci.mk:"
            ls -l feeds/luci/luci.mk 2>&1 || true
            echo "--- package/pon-userspace 目录:"
            ls -1 package/pon-userspace 2>&1 || true
            echo "--- package/feeds 下的 luci-app-camlive/go2rtc/btsp/blueaudio/ser2net 副本:"
            ls -d package/feeds/*/luci-app-* 2>/dev/null | grep -E 'camlive|go2rtc|btsp|blueaudio|ser2net' || echo "(no feed copy)"
            echo "--- tmp/.packageinfo 中 pon-userspace 相关登记:"
            grep -o "package/pon-userspace/[a-z0-9-]*" tmp/.packageinfo 2>/dev/null | sort -u || echo "(no packageinfo entry)"
            echo "--- .config 相关符号:"
            grep -E "CONFIG_PACKAGE_(luci-app-|gensio|camlive|go2rtc|ser2net)" .config 2>/dev/null || echo "(none)"
          } > build_log/scan-diag.txt 2>&1 || true
          cat build_log/scan-diag.txt || true

          only="${{ inputs.only }}"
          # ------------------------------------------------------------------
          # 批量编译：把「一个包一次 make」改成「一批包一次 make」。
          # 每次 make 都要重新解析整棵树（feeds 扫描 -> tmp/.packageinfo -> 依赖图），
          # 空转 30-60 秒；清单 29-37 个包 = 20-35 分钟纯启动开销，跟真实编译无关。
          # 增量：bin/packages 已随 tree cache 一起恢复，已编好的包 make 自己会跳过；
          # 这里再按 apk 哈希判定 REUSE，汇报里能区分「本轮真编」与「沿用上轮产物」。
          # ------------------------------------------------------------------
          BATCH="${BATCH_SIZE:-8}"
          bt_path=(); bt_apk=(); bt_apkf=()
          batch_no=0
          : > /tmp/prebuilt.txt
          if [ -d bin/packages ]; then
            ( cd bin/packages && find . -type f -name '*.apk' -exec sha256sum {} + ) >> /tmp/prebuilt.txt 2>/dev/null || true
          fi
          echo ">>> 缓存里已有 apk $(wc -l < /tmp/prebuilt.txt) 个（已编好的包不重编，直接复用）"

          apk_of() { find bin/packages bin/targets -type f -name "$1-[0-9]*.apk" 2>/dev/null | head -n 1; }

          collect_one() {  # $1=apk 文件名基  $2=包名
            local apkf="$1" apk="$2" hit sha tag
            hit=$(apk_of "$apkf")
            if [ -z "$hit" ]; then
              echo "::error::$apk 编译命令成功但没有产出 apk"
              summary="${summary}\nFAIL   $apk（无 apk 产出）"; fail=1
              return 1
            fi
            sha=$(sha256sum "$hit" | awk '{print $1}')
            if grep -q "^$sha" /tmp/prebuilt.txt 2>/dev/null; then tag="REUSE"; else tag="BUILD"; fi
            cp -f "$hit" output/
            summary="${summary}\nOK[$tag] $apk -> $hit"
            echo ">>> OK[$tag] $apk -> $hit"
          }

          flush_batch() {
            if [ "${#bt_path[@]}" -eq 0 ]; then return 0; fi
            local targets=() i
            for i in "${!bt_path[@]}"; do targets+=("${bt_path[$i]}/compile"); done
            batch_no=$((batch_no+1))
            echo ">>> 批量编译 ${#bt_path[@]} 个包（batch-${batch_no}）：${bt_apk[*]}"
            if make -j"$(nproc)" "${targets[@]}" > "build_log/batch-${batch_no}.log" 2>&1; then
              for i in "${!bt_apk[@]}"; do collect_one "${bt_apkf[$i]}" "${bt_apk[$i]}"; done
            else
              echo ">>> batch-${batch_no} 内有失败，逐包复跑定位（日志 build_log/batch-${batch_no}.log）"
              for i in "${!bt_path[@]}"; do build_one "${bt_path[$i]}" "${bt_apk[$i]}" "${bt_apkf[$i]}"; done
            fi
            bt_path=(); bt_apk=(); bt_apkf=()
          }

          build_one() {
            local path="$1" apk="$2" apkf="$3"
            log="build_log/${apk}.log"
            sym=$(pkg_sym_for "$apk")
            ok=0
            # 只编指定包时，先把它自己的历史构建状态清干净（缓存树里 .built 在、ipkg-install 空
            # 会让 make 误判“已编译”，直接跳 Install 报 cp: cannot stat）
            : > "$log"
            # 诊断：ser2net 这种「purge 干净了仍 0.0x 秒跳打包」的情况，要先确认该包
            # 在 .config 与包元数据里是真的存在；不在的话 compile 只是空转，打包必然报
            # cp: cannot stat .../ipkg-install/...
            {
              echo "--- 配置检查 $apk（符号 ${sym}）："
              grep -n "^CONFIG_PACKAGE_${sym}=" .config || echo "    .config 无 CONFIG_PACKAGE_${sym}"
              if [ -f tmp/.packageinfo ]; then
                echo -n "    .packageinfo 记录数: "; grep -c "^Package: ${sym}$" tmp/.packageinfo || true
                awk -v p="$sym" '/^Package: /{cur=$2} cur==p && /^Depends: /{print "    depends: "$0; exit}' tmp/.packageinfo || true
              else
                echo "    tmp/.packageinfo 不存在"
              fi
            } >> "$log" 2>&1 || true
            # 缓存树可能「stamp 在、build_dir/ipkg-install 不在」，这种包无论 only 取
            # 什么值都必须先清干净，否则 make 直接跳到打包阶段（run 44830801575 的 ser2net）。
            bd=""
            for cand in build_dir/target-*/"$(basename "$path")" build_dir/target-*/"$(basename "$path")"-*; do
              [ -e "$cand" ] && { bd="$cand"; break; }
            done
            if [ -z "$bd" ] || [ ! -d "$bd/ipkg-install" ]; then
              echo ">>> 预先清理 $apk 的历史构建状态（build_dir=${bd:-无}）" >> "$log"
              purge_pkg "$path" "$apkf" "$log"
            fi
            # 首轮就用 V=s：非 verbose 时包内 prepare/configure/build 的实际动作不可见，
            # 只剩一句 ERROR: package/... failed to build，定位不了「为什么直接跳打包」。
            if make -j"$(nproc)" V=s "$path/compile" 2>&1 | tee -a "$log"; then
              ok=1
            else
              # 首轮失败：用 make -pn 探测真实 stamp 路径并精确删除，再编一次
              echo "" >> "$log"
              echo ">>> 首轮失败：探测 STAMP_* 真实路径后精确清理，再编一次" >> "$log"
              purge_pkg "$path" "$apkf" "$log"
              if make -j"$(nproc)" "$path/compile" >> "$log" 2>&1; then
                ok=2
              else
                echo ">>> 清理重试仍失败，用 -j1 V=s 取尾部 100 行" >> "$log"
                { make -j1 V=s "$path/compile" 2>&1 | tail -n 100; } >> "$log" || true
                ok=0
              fi
            fi
            if [ "$ok" -ge 1 ]; then
              hit=$(find bin/packages -type f -name "${apkf}-[0-9]*.apk" | head -n 1)
              if [ -n "$hit" ]; then
                if [ "$ok" = "2" ]; then
                  summary="${summary}\nOK     $apk -> $hit（清理重试后成功）"
                else
                  summary="${summary}\nOK     $apk -> $hit"
                fi
                cp -f "$hit" output/
              else
                {
                  echo "--- 缓存树里该包残余 stamp/ipkg 目录："
                  ls -ld build_dir/target-*/"$apkf"-* build_dir/target-*/"$apkf"/.built* 2>/dev/null || echo "(none)"
                  find staging_dir/target-* -maxdepth 2 -name "*.${apk}*install" 2>/dev/null || true
                } >> "$log" 2>&1 || true
                echo "::error::$apk 编译命令成功但没有产出 apk"
                summary="${summary}\nFAIL   $apk（无 apk 产出）"; fail=1
              fi
            else
              echo "::error::$apk 编译失败，日志 $log"
              summary="${summary}\nFAIL   $apk（编译失败）"; fail=1
            fi
          }

          fail=0; summary=""; missing_dirs=""

          # purge_pkg：把某个包的历史构建状态彻底清干净。
          # run 44830801575（#24）实测：make "$path/clean" + 删 build_dir 目录 + 删
          # staging/stamp/.<name>_installed，三样都做完，compile 仍只用 0.07s 就跳到
          # apk 打包阶段（cp: cannot stat .../ipkg-install/usr/bin/ser2net）。
          # 说明 make 认账的 stamp 既不在 build_dir/<pkg>-<ver>/.built，也不叫
          # .<name>_installed。这里改成按包名递归删掉 staging_dir / build_dir 下
          # 一切 ".<dir>_*"、".<dir>.*" 形式的 stamp（不限后缀、不限深度），
          # 删完做硬校验，有残留直接报红，不再静默跳过。
          purge_pkg() {
            local path="$1" apk="$2" log="$3" d bd left
            d=$(basename "$path")
            bd=""
            for cand in build_dir/target-*/"$d" build_dir/target-*/"$d"-*; do
              [ -e "$cand" ] && { bd="$cand"; break; }
            done
            {
              echo ">>> purge $apk（PKG_DIR_NAME=$d，build_dir=${bd:-无}）"
              echo "--- purge 前 stamp 现存："
              find staging_dir build_dir \( -name ".${d}_*" -o -name ".${d}.*" \) -print 2>/dev/null || true
            } >> "$log" 2>&1 || true
            if [ -n "$bd" ]; then
              make "$path/clean" >> "$log" 2>&1 || true
            fi
            find staging_dir build_dir \( -name ".${d}_*" -o -name ".${d}.*" \) -exec rm -rf {} + 2>/dev/null || true
            for p in build_dir/target-*/"$d" build_dir/target-*/"$d"-* build_dir/target-*/"$apk" build_dir/target-*/"$apk"-*; do
              [ -e "$p" ] || continue
              echo "  整目录删除 $p" >> "$log" 2>&1 || true
              rm -rf "$p" 2>/dev/null || true
            done
            rm -f staging_dir/target-*/stamp/."$d"_installed \
                  staging_dir/target-*/stamp/."$d".*_installed \
                  staging_dir/target-*/pkginfo/"$d".*.install 2>/dev/null || true
            # 残留硬校验：stamp 删不干净就报红，避免下一轮又静默跳过编译
            left=$(find staging_dir build_dir \( -name ".${d}_*" -o -name ".${d}.*" \) 2>/dev/null | head -n 5)
            if [ -n "$left" ]; then
              echo "::error::purge 后 stamp 仍残留：$left"
              echo "  残留：$left" >> "$log" 2>&1 || true
            fi
            left=$(ls -d build_dir/target-*/"$d"-* 2>/dev/null | head -n 5 || true)
            if [ -n "$left" ]; then
              echo "::error::purge 后 build_dir 仍残留：$left"
              echo "  残留：$left" >> "$log" 2>&1 || true
            fi
            {
              echo "--- 清理后残留（build_dir）："
              ls -d build_dir/target-*/"$d" build_dir/target-*/"$d"-* 2>/dev/null || true
              echo "--- 清理后残留（stamp）："
              find staging_dir build_dir \( -name ".${d}_*" -o -name ".${d}.*" \) -print 2>/dev/null | head -n 10 || true
            } >> "$log" 2>&1 || true
            find bin/packages -type f -name "${apk}-[0-9]*.apk" -delete 2>/dev/null || true
          }


          while IFS='|' read -r path apk required; do
            [ -n "${path:-}" ] || continue
            case "$path" in \#*) continue ;; esac
            if [ "$only" != "all" ]; then
              echo ",$only," | grep -q ",$apk," || continue
            fi
            if [ ! -d "$path" ]; then
              if [ "$required" = "optional" ]; then
                summary="${summary}\nSKIP   $apk（源码目录 $path 不存在，optional）"; missing_dirs="$missing_dirs $apk"
                continue
              fi
              echo "::error::必需包 $apk 的源码目录不存在: $path"
              summary="${summary}\nFAIL   $apk（源码目录缺失 $path）"; fail=1
              continue
            fi
            log="build_log/${apk}.log"
            sym=$(pkg_sym_for "$apk")
            apkf=$(pkg_apk_for "$apk")
            echo ">>> 入批 $apk ($path)（符号 ${sym}，产物 ${apkf}-*.apk）"
            bt_path+=("$path"); bt_apk+=("$apk"); bt_apkf+=("$apkf")
            if [ "${#bt_path[@]}" -ge "$BATCH" ]; then flush_batch; fi
          done < "$manifest"
          flush_batch

          # ------------------------------------------------------------------
          # 收集本次编译产出的**全部** apk，不再按 only 白名单丢弃：
          # bin/packages 在每轮 run 里从空开始（缓存只存 build_dir/staging_dir，
          # 不含 bin/），所以这里的每个 apk 都是本轮 make 编出来的——包括
          # make 自动拉起来编的依赖包（libnl-core/libnl-genl、libtirpc 等）。
          # 按 only 过滤会把依赖漏掉，设备上 apk add 时就缺包；这里全收。
          # 只排除 host 工具目录（bin/packages/*/host 之类），那不是设备包。
          # ------------------------------------------------------------------
          mkdir -p output
          n_collect=0
          collect_list=$(find bin/packages -type f -name '*.apk' -not -path '*/host/*' 2>/dev/null | sort || true)
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if cp -f "$f" output/; then
              n_collect=$((n_collect+1))
            else
              echo "::error::收集 apk 失败：$f"; fail=1
            fi
          done <<< "$collect_list"
          echo ">>> 本次收集 apk 共 ${n_collect} 个（output/）"
          ls -1 output/*.apk 2>/dev/null | sed 's#.*/##' | sed 's/^/    /' || true
          {
            echo ""
            echo "收集 apk ${n_collect} 个（不按 only 过滤）"
          } >> build_log/package-summary.txt
          {
            echo "# pon-userspace 逐包结果（${{ inputs.device }}）"
            echo "$summary"
            echo ""
            [ -n "$missing_dirs" ] && echo "optional 缺失：$missing_dirs"
          } > build_log/package-summary.txt
          cat build_log/package-summary.txt
          {
            echo "### 逐包结果（${{ inputs.device }}）"
            echo '```'
            cat build_log/package-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cd output
          for f in *; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done
          exit $fail

      - name: Record ABI snapshot (与固件兼容性核对用)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p output
          kver=$(cat build_dir/target-*/linux-*/include/config/kernel.release 2>/dev/null | head -n1 || true)
          ko=$(find build_dir/target-*/linux-*/ -name '*.ko' -print 2>/dev/null | head -n1 || true)
          ver=""
          if [ -n "$ko" ]; then
            ver=$(modinfo -F vermagic "$ko" 2>/dev/null | head -n1 || true)
          fi
          pub=$(sha256sum public-key.pem 2>/dev/null | awk '{print $1}' || true)
          {
            echo "device=${{ inputs.device }}"
            echo "target=aarch64_cortex-a53_musl"
            echo "kernel_version=${kver:-unknown}"
            echo "kmod_vermagic=${ver:-unknown}"
            echo "apk_pubkey_sha256=${pub:-none}"
            echo "config_6_18_sha256=$(sha256sum target/linux/airoha/an7581/config-6.18 2>/dev/null | awk '{print $1}')"
            echo "repo_commit=$(git rev-parse HEAD)"
            echo "note=kmod 需 target+kernel_version+kmod_vermagic 全同；用户态 apk 只需 target+libc+apk_pubkey 相同"
          } | tee output/abi-info.txt

      - name: Export apk signing public key
        if: always()
        run: |
          set -uo pipefail
          mkdir -p output
          # rules.mk: BUILD_KEY_APK_PUB=$(TOPDIR)/public-key.pem，BUILD_KEY_APK_SEC=$(TOPDIR)/private-key.pem
          # 每次 run 现生成一套密钥，设备只认固件里那把；把本次公钥放进 artifact，
          # 装包前丢进设备 /etc/apk/keys/ 即可免 --allow-untrusted。
          if [ -f public-key.pem ]; then
            cp -f public-key.pem output/public-key.pem
            sha256sum output/public-key.pem | tee output/public-key.pem.sha256
          else
            echo "::warning::本 run 未生成 public-key.pem（命中缓存或未签名），artifact 里不含公钥"
          fi

      - name: Save host toolchain cache
        if: always() && inputs.reuse_build_tree && inputs.cache_mode != '完全重建' && steps.hosttc.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir/toolchain-*
            staging_dir/toolchain-*
          key: ponwrt-hosttc-v1-${{ hashFiles('toolchain/**', 'configs/an7581.config', 'configs/release.config') }}

      - name: Save downloads cache
        if: always() && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ponwrt-dl-pkg-${{ hashFiles('feeds.conf.default', 'configs/**/*.config') }}-${{ github.run_id }}

      - name: Save compiler ccache
        if: always() && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ponwrt-ccache-pkg-${{ inputs.device }}-${{ github.run_id }}

      - name: Save build tree cache
        if: always() && inputs.reuse_build_tree && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir/target-*
            build_dir/host
            staging_dir/target-*
            staging_dir/host
            bin/packages
          key: ponwrt-tree-${{ inputs.device }}-inc-${{ hashFiles('configs/**/*.config', 'target/linux/airoha/an7581/config-6.18', 'target/linux/generic/kernel-6.18', 'feeds.conf.default', 'package/**', 'target/linux/**') }}-${{ github.run_id }}

      - name: Stage host apk tool for the publish workflow
        if: always()
        run: |
          set -uo pipefail
          # pkg-publish.yml 用同一份 host apk 生成并签名索引，避免两处工具版本不一致
          mkdir -p pubtool
          for c in staging_dir/host/bin/apk build_dir/host*/apk-*/apk; do
            if [ -f "$c" ] && [ -x "$c" ]; then
              cp -f "$c" pubtool/apk
              chmod +x pubtool/apk
              break
            fi
          done
          if [ -x pubtool/apk ]; then
            ./pubtool/apk --version || true
            sha256sum pubtool/apk
          else
            echo "::warning::本 run 没有可用的 host apk，publish 工作流需要它来签索引"
          fi
      - name: Upload packages artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-packages-${{ inputs.device }}-${{ github.run_number }}
          path: |
            output/*
            build_log/package-summary.txt
            build_log/*.log
            pubtool/apk
          retention-days: 14

      - name: Publish prerelease (apk + public key, 长期保留)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(output/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::output 为空，跳过预发布"
            exit 0
          fi
          tag="pkgs-${{ inputs.device }}-r${{ github.run_number }}"
          # artifact 只保留 14 天，Release 资产长期可用；公钥随包一起发布，换机/过期后仍能重取
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --prerelease \
              --title "apk $tag" \
              --notes "自动预发布：device=${{ inputs.device }} run=${{ github.run_number }} commit=${{ github.sha }}；含本次 apk 与签名公钥 public-key.pem(.sha256)。安装：public-key.pem 放到 /etc/apk/keys/ 后 apk add，或 apk add --allow-untrusted --no-network。"
          fi
