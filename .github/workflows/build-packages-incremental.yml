name: Build Packages (same kernel tree, incremental) manual

# ==============================================================================
# 只允许手动触发（workflow_dispatch）：无 push / schedule 触发。
#
# 设计要点
# 1) 与固件同源同 ABI：本工作流用 configs/an7581.config + release.config +
#    pon-packages/*.config 生成与固件完全一致的 .config，先编 host 工具链、
#    再编 target/linux（内核树），最后才编 kmod 与上层包。kmod 的 vermagic
#    因此和 build-firmware-manual.yml 出来的固件逐字节一致，apk 可直接装。
# 2) 增量：dl / .ccache / build_dir / staging_dir 全部走滚动缓存（key 带 run_id，
#    restore-keys 前缀命中上一轮），命中后 make 自身按时间戳跳过未变目标；
#    再配合 inputs.only 只编指定包，单个包改动只重编该包及其依赖。
# 3) 不静默丢弃：按 configs/pon-userspace-packages.txt 逐包核对真实 apk，
#    缺包、目录缺失、编译失败都会让 job 失败并在 summary 里列出。
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      device:
        description: '目标机型（决定 .config 里的设备锁定）'
        required: true
        default: 'hg5585f-ct'
        type: choice
        options:
          - 'hg5585f-ct'
          - 'hg5382a'
      cache_mode:
        description: '缓存模式（完全重建会丢弃所有缓存）'
        required: true
        default: '使用缓存'
        type: choice
        options:
          - '使用缓存'
          - '完全重建'
      reuse_build_tree:
        description: '复用 build_dir/staging_dir 缓存（数 GB，命中才是真增量）'
        required: true
        default: true
        type: boolean
      only:
        description: '只编这些 apk（逗号分隔，all=全部；例：tempinfo,camlive）'
        required: true
        default: 'all'
        type: string
      with_kernel:
        description: '是否先编内核树（首次/改内核配置时必须为 true）'
        required: true
        default: true
        type: boolean

concurrency:
  group: manual-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_MAXSIZE: 5G
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  packages:
    name: Build packages (${{ inputs.device }})
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full pahole patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Install fixed apk signing key
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${APK_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::仓库未配置 APK_SIGNING_PRIVATE_KEY，本次用 run 内临时密钥（跨 run 不可互信）"
            exit 0
          fi
          # rules.mk: BUILD_KEY_APK_SEC=$(TOPDIR)/private-key.pem / BUILD_KEY_APK_PUB=$(TOPDIR)/public-key.pem
          # 全仓库固定同一把密钥：设备只需装一次 /etc/apk/keys/public-key.pem
          printf '%s\n' "$APK_SIGNING_PRIVATE_KEY" > private-key.pem
          chmod 600 private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem
          sha256sum public-key.pem

      - name: Restore build tree cache (真增量的关键)
        if: inputs.reuse_build_tree && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build_dir/target-*
            build_dir/host
            staging_dir/target-*
            staging_dir/host
          key: ponwrt-tree-${{ inputs.device }}-${{ hashFiles('configs/**/*.config', 'target/linux/airoha/an7581/config-6.18', 'feeds.conf.default') }}-${{ github.run_id }}
          restore-keys: |
            ponwrt-tree-${{ inputs.device }}-${{ hashFiles('configs/**/*.config', 'target/linux/airoha/an7581/config-6.18', 'feeds.conf.default') }}-
            ponwrt-tree-${{ inputs.device }}-

      - name: Restore downloads cache
        if: inputs.cache_mode != '完全重建'
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: ponwrt-dl-pkg-${{ hashFiles('feeds.conf.default', 'configs/**/*.config') }}-${{ github.run_id }}
          restore-keys: |
            ponwrt-dl-pkg-${{ hashFiles('feeds.conf.default', 'configs/**/*.config') }}-
            ponwrt-dl-pkg-

      - name: Restore compiler ccache
        if: inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ponwrt-ccache-pkg-${{ inputs.device }}-${{ github.run_id }}
          restore-keys: |
            ponwrt-ccache-pkg-${{ inputs.device }}-
            ponwrt-ccache-pkg-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare custom packages and patches
        run: |
          bash ./scripts/customize.sh

      - name: Configure (same as firmware)
        run: |
          set -euo pipefail

          # kconfig.pl 的 + 是【二元】操作符（parse_expr 里 '+' 吃两个操作数），
          # 语法是 E = '+' E E | 文件名，所以 N 个文件必须用 N-1 个 +，
          # 且【最后一个文件前面不加 +】：`+ f1 + f2 f3`
          #   · `+ f1 f2 f3`     → 多余参数残留，die "Parse error" line 189
          #   · `+ f1 + f2 + f3` → 最内层 + 缺第二个操作数，die "Parse error" line 144
          files=(configs/an7581.config configs/release.config configs/pon-packages/*.config)
          merge_args=()
          n=${#files[@]}
          for ((i=0; i<n; i++)); do
            if [ "$i" -lt "$((n-1))" ]; then
              merge_args+=("+" "${files[$i]}")
            else
              merge_args+=("${files[$i]}")
            fi
          done
          echo ">>> kconfig.pl ${merge_args[*]}"
          ./scripts/kconfig.pl "${merge_args[@]}" > .config

          sed -i '/^CONFIG_KERNEL_DEBUG_INFO_REDUCED=/d' .config
          printf 'CONFIG_KERNEL_DEBUG_INFO=y\n# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set\nCONFIG_KERNEL_DEBUG_INFO_BTF=y\nCONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y\nCONFIG_KERNEL_MODULE_ALLOW_BTF_MISMATCH=y\nCONFIG_KERNEL_KPROBES=y\nCONFIG_KERNEL_BPF_EVENTS=y\n' >> .config

          if [ "${{ inputs.cache_mode }}" != "完全重建" ]; then
            sed -i '/^CONFIG_DEVEL=/d; /^CONFIG_CCACHE=/d' .config
            printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
          fi

          make defconfig

          # 机型锁定：defconfig 之后只保留本次目标机型，之后不再 defconfig
          case "${{ inputs.device }}" in
            hg5585f-ct) DEVICE="fiberhome_hg5585f-ct" ;;
            hg5382a)    DEVICE="fiberhome_hg5382a" ;;
            *)          echo "::error::未知机型 ${{ inputs.device }}"; exit 1 ;;
          esac
          sed -i '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          sed -i '/^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.* is not set/d' .config
          printf 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_%s=y\n' "$DEVICE" >> .config
          grep -q "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${DEVICE}=y" .config \
            || { echo "::error::机型符号未落地: $DEVICE"; exit 1; }

      - name: Record kernel ABI pin (kmod 必须与固件同树同配置)
        run: |
          set -euo pipefail
          mkdir -p output
          {
            echo "device=${{ inputs.device }}"
            echo "repo_commit=$(git rev-parse HEAD)"
            echo "config_6_18_sha256=$(sha256sum target/linux/airoha/an7581/config-6.18 | awk '{print $1}')"
            echo "feeds_conf_sha256=$(sha256sum feeds.conf.default | awk '{print $1}')"
            echo "note=安装 kmod apk 前必须确认固件来自同一 commit 且 config-6.18 未变"
          } | tee output/build-info.txt

      - name: Build host tools and toolchain
        run: |
          set -euo pipefail
          make -j"$(nproc)" tools/compile
          make -j"$(nproc)" toolchain/compile

      - name: Build kernel tree (kmod ABI 来源)
        if: inputs.with_kernel
        run: |
          set -euo pipefail
          # 编内核本身与内核模块树；kmod 包的 vermagic 取自这里
          make -j"$(nproc)" target/linux/compile
          make -j"$(nproc)" target/linux/install || true

      - name: Build kernel modules selected by config
        run: |
          set -euo pipefail
          make -j"$(nproc)" package/kernel/linux/compile

      - name: Build pon-userspace packages (incremental, no silent drop)
        run: |
          set -euo pipefail
          mkdir -p output build_log
          manifest="configs/pon-userspace-packages.txt"
          [ -f "$manifest" ] || { echo "::error::缺少 $manifest"; exit 1; }
          # 诊断：luci 应用报 “No rule to make target <path>/compile” 说明扫描未登记该包，先把证据落盘
          {
            echo "--- feeds/luci/luci.mk:"
            ls -l feeds/luci/luci.mk 2>&1 || true
            echo "--- package/pon-userspace 目录:"
            ls -1 package/pon-userspace 2>&1 || true
            echo "--- package/feeds 下的 luci-app-camlive/go2rtc/btsp/blueaudio/ser2net 副本:"
            ls -d package/feeds/*/luci-app-* 2>/dev/null | grep -E 'camlive|go2rtc|btsp|blueaudio|ser2net' || echo "(no feed copy)"
            echo "--- tmp/.packageinfo 中 pon-userspace 相关登记:"
            grep -o "package/pon-userspace/[a-z0-9-]*" tmp/.packageinfo 2>/dev/null | sort -u || echo "(no packageinfo entry)"
            echo "--- .config 相关符号:"
            grep -E "CONFIG_PACKAGE_(luci-app-|gensio|camlive|go2rtc|ser2net)" .config 2>/dev/null || echo "(none)"
          } > build_log/scan-diag.txt 2>&1 || true
          cat build_log/scan-diag.txt || true

          only="${{ inputs.only }}"
          fail=0; summary=""; missing_dirs=""

          # purge_pkg：彻底清掉某个包的历史构建状态（只删到真正的 stamp 才会重编）
          # 实测（run 44754949643，ser2net.log）：缓存树恢复出来的 build_dir 里 .built 在、
          # ipkg-install 却是空的（缓存打包排除了 ipkg*），于是 make 认为已编译完，直接跳到
          # apk 打包阶段，报 cp: cannot stat .../ipkg-install/usr/bin/ser2net。
          # 之前用 `make -C <pkg> -pn` 探测 STAMP_* 拿不到任何值（日志里 STAMP_DIR=未探测到），
          # 因为 package.mk 依赖 TOPDIR，在包目录里跑 -pn 不展开。这里改为按 include/package.mk
          # 的真实定义直接删：
          #   STAMP_PREPARED/CONFIGURED/BUILT = $(PKG_BUILD_DIR)/.prepared|.configured|.built
          #   STAMP_INSTALLED = $(STAGING_DIR)/stamp/.<PKG_DIR_NAME>_installed
          #   PKG_INSTALL_STAMP = $(STAGING_DIR)/pkginfo/<PKG_DIR_NAME>.default.install
          purge_pkg() {
            local path="$1" apk="$2" log="$3" d p
            d=$(basename "$path")          # = PKG_DIR_NAME
            make "$path/clean" >> "$log" 2>&1 || true
            {
              echo ">>> purge $apk（PKG_DIR_NAME=$d）"
            } >> "$log" 2>&1 || true
            # run 44771614897（#23）实测：只删 stamp/ipkg* 时 make 仍认为已编译
            # （compile 段 0.07s、无任何 Build/Compile 输出，直接进 apk 打包，
            #  报 cp: cannot stat .../ser2net-4.6.0/ipkg-install/usr/bin/ser2net）。
            # 缓存恢复出来的树里 .built 在、ipkg* 被缓存策略排除，任何"部分清理"
            # 都可能留下 make 认账的目标；这里整目录删掉（含源码树），只保留 dl/ 的
            # tarball，强制 prepare → configure → Build/Compile → Build/Install 全链路重跑。
            for p in build_dir/target-*/"$d" build_dir/target-*/"$d"-* build_dir/target-*/"$apk" build_dir/target-*/"$apk"-*; do
              [ -e "$p" ] || continue
              echo "  整目录删除 $p" >> "$log" 2>&1 || true
              rm -rf "$p" 2>/dev/null || true
            done
            # 残留硬校验：删不掉就直接报红，避免下一轮又静默跑过
            left=$(ls -d build_dir/target-*/"$d"-* build_dir/target-*/"$apk"-* 2>/dev/null || true)
            if [ -n "$left" ]; then
              echo "::error::purge 后 build_dir 仍有残留：$left"
              echo "  残留：$left" >> "$log" 2>&1 || true
            fi
            rm -f staging_dir/target-*/stamp/."$d"_installed \
                  staging_dir/target-*/stamp/."$d".*_installed \
                  staging_dir/target-*/pkginfo/"$d".default.install 2>/dev/null || true
            find staging_dir -maxdepth 3 \( -name ".${d}_installed" -o -name ".${d}.*_installed" \) -delete 2>/dev/null || true
            {
              echo "--- 清理后残留（build_dir）："
              ls -d build_dir/target-*/"$d" build_dir/target-*/"$d"-* 2>/dev/null || true
              echo "--- 清理后残留（staging stamp）："
              find staging_dir -maxdepth 3 -name ".${d}*_installed" 2>/dev/null || true
            } >> "$log" 2>&1 || true
            find bin/packages -type f -name "${apk}-[0-9]*.apk" -delete 2>/dev/null || true
          }


          while IFS='|' read -r path apk required; do
            [ -n "${path:-}" ] || continue
            case "$path" in \#*) continue ;; esac
            if [ "$only" != "all" ]; then
              echo ",$only," | grep -q ",$apk," || continue
            fi
            if [ ! -d "$path" ]; then
              if [ "$required" = "optional" ]; then
                summary="${summary}\nSKIP   $apk（源码目录 $path 不存在，optional）"; missing_dirs="$missing_dirs $apk"
                continue
              fi
              echo "::error::必需包 $apk 的源码目录不存在: $path"
              summary="${summary}\nFAIL   $apk（源码目录缺失 $path）"; fail=1
              continue
            fi
            log="build_log/${apk}.log"
            echo ">>> 编译 $apk ($path)"
            ok=0
            # 只编指定包时，先把它自己的历史构建状态清干净（缓存树里 .built 在、ipkg-install 空
            # 会让 make 误判“已编译”，直接跳 Install 报 cp: cannot stat）
            : > "$log"
            if [ "$only" != "all" ]; then
              echo ">>> 预先清理 $apk 的历史构建状态" >> "$log"
              purge_pkg "$path" "$apk" "$log"
            fi
            if make -j"$(nproc)" "$path/compile" 2>&1 | tee -a "$log"; then
              ok=1
            else
              # 首轮失败：用 make -pn 探测真实 stamp 路径并精确删除，再编一次
              echo "" >> "$log"
              echo ">>> 首轮失败：探测 STAMP_* 真实路径后精确清理，再编一次" >> "$log"
              purge_pkg "$path" "$apk" "$log"
              if make -j"$(nproc)" "$path/compile" >> "$log" 2>&1; then
                ok=2
              else
                echo ">>> 清理重试仍失败，用 -j1 V=s 取尾部 100 行" >> "$log"
                { make -j1 V=s "$path/compile" 2>&1 | tail -n 100; } >> "$log" || true
                ok=0
              fi
            fi
            if [ "$ok" -ge 1 ]; then
              hit=$(find bin/packages -type f -name "${apk}-[0-9]*.apk" | head -n 1)
              if [ -n "$hit" ]; then
                if [ "$ok" = "2" ]; then
                  summary="${summary}\nOK     $apk -> $hit（清理重试后成功）"
                else
                  summary="${summary}\nOK     $apk -> $hit"
                fi
                cp -f "$hit" output/
              else
                {
                  echo "--- 缓存树里该包残余 stamp/ipkg 目录："
                  ls -ld build_dir/target-*/"$apk"-* build_dir/target-*/"$apk"/.built* 2>/dev/null || echo "(none)"
                  find staging_dir/target-* -maxdepth 2 -name "*.${apk}*install" 2>/dev/null || true
                } >> "$log" 2>&1 || true
                echo "::error::$apk 编译命令成功但没有产出 apk"
                summary="${summary}\nFAIL   $apk（无 apk 产出）"; fail=1
              fi
            else
              echo "::error::$apk 编译失败，日志 $log"
              summary="${summary}\nFAIL   $apk（编译失败）"; fail=1
            fi
          done < "$manifest"

          {
            echo "# pon-userspace 逐包结果（${{ inputs.device }}）"
            echo "$summary"
            echo ""
            [ -n "$missing_dirs" ] && echo "optional 缺失：$missing_dirs"
          } > build_log/package-summary.txt
          cat build_log/package-summary.txt
          {
            echo "### 逐包结果（${{ inputs.device }}）"
            echo '```'
            cat build_log/package-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cd output
          for f in *; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done
          exit $fail

      - name: Record ABI snapshot (与固件兼容性核对用)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p output
          kver=$(cat build_dir/target-*/linux-*/include/config/kernel.release 2>/dev/null | head -n1 || true)
          ko=$(find build_dir/target-*/linux-*/ -name '*.ko' -print 2>/dev/null | head -n1 || true)
          ver=""
          if [ -n "$ko" ]; then
            ver=$(modinfo -F vermagic "$ko" 2>/dev/null | head -n1 || true)
          fi
          pub=$(sha256sum public-key.pem 2>/dev/null | awk '{print $1}' || true)
          {
            echo "device=${{ inputs.device }}"
            echo "target=aarch64_cortex-a53_musl"
            echo "kernel_version=${kver:-unknown}"
            echo "kmod_vermagic=${ver:-unknown}"
            echo "apk_pubkey_sha256=${pub:-none}"
            echo "config_6_18_sha256=$(sha256sum target/linux/airoha/an7581/config-6.18 2>/dev/null | awk '{print $1}')"
            echo "repo_commit=$(git rev-parse HEAD)"
            echo "note=kmod 需 target+kernel_version+kmod_vermagic 全同；用户态 apk 只需 target+libc+apk_pubkey 相同"
          } | tee output/abi-info.txt

      - name: Export apk signing public key
        if: always()
        run: |
          set -uo pipefail
          mkdir -p output
          # rules.mk: BUILD_KEY_APK_PUB=$(TOPDIR)/public-key.pem，BUILD_KEY_APK_SEC=$(TOPDIR)/private-key.pem
          # 每次 run 现生成一套密钥，设备只认固件里那把；把本次公钥放进 artifact，
          # 装包前丢进设备 /etc/apk/keys/ 即可免 --allow-untrusted。
          if [ -f public-key.pem ]; then
            cp -f public-key.pem output/public-key.pem
            sha256sum output/public-key.pem | tee output/public-key.pem.sha256
          else
            echo "::warning::本 run 未生成 public-key.pem（命中缓存或未签名），artifact 里不含公钥"
          fi

      - name: Save downloads cache
        if: always() && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ponwrt-dl-pkg-${{ hashFiles('feeds.conf.default', 'configs/**/*.config') }}-${{ github.run_id }}

      - name: Save compiler ccache
        if: always() && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ponwrt-ccache-pkg-${{ inputs.device }}-${{ github.run_id }}

      - name: Save build tree cache
        if: always() && inputs.reuse_build_tree && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir/target-*
            build_dir/host
            staging_dir/target-*
            staging_dir/host
          key: ponwrt-tree-${{ inputs.device }}-${{ hashFiles('configs/**/*.config', 'target/linux/airoha/an7581/config-6.18', 'feeds.conf.default') }}-${{ github.run_id }}

      - name: Build apk index and publish to apk repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(output/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::本次没有 apk，跳过索引生成"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::未配置 APK_REPO_TOKEN，跳过仓库索引推送"
            exit 0
          fi
          APKBIN=""
          for c in staging_dir/host/bin/apk build_dir/host*/apk-*/apk; do
            if [ -x "$c" ]; then APKBIN="$c"; break; fi
          done
          if [ -z "$APKBIN" ]; then
            echo "::warning::找不到 host 版 apk 工具，跳过索引生成（apk 仍可单独下载安装）"
            exit 0
          fi
          echo ">>> host apk: $APKBIN"
          "$APKBIN" --version || true
          rm -f packages.adb index.err
          # 索引工具是 apk mkndx（OpenWrt 自己的 package/Makefile 也是用它）。
          # apk index 是 v2 索引生成器（输出 APKINDEX.tar.gz），遇到 v3 ADB 包直接报
          #   ERROR: output/xxx.apk: file format not supported (in this applet)
          # —— legacy run 44763931465 实测，于是 packages.adb 从未生成、repo 分支只留 README。
          SIGN_ARG=""
          if [ -f "$PWD/private-key.pem" ]; then SIGN_ARG="--sign $PWD/private-key.pem"; fi
          if ! "$APKBIN" mkndx --root "$PWD" --keys-dir "$PWD" --allow-untrusted $SIGN_ARG \
                 --output packages.adb "${files[@]}" 2>index.err; then
            cat index.err || true
            echo "::warning::apk mkndx 生成索引失败，跳过在线源发布"
            exit 0
          fi
          ls -l packages.adb
          echo ">>> packages.adb 生成成功（$(stat -c%s packages.adb) 字节，${#files[@]} 个 apk）"

          # 托管到 ufo1cn/ponwrt-apk-repo 的 repo 分支，保持固定 URL 目录结构
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/ufo1cn/ponwrt-apk-repo.git"
          rm -rf /tmp/apkrepo
          if ! git clone --depth=1 --branch repo "$REPO_URL" /tmp/apkrepo 2>/dev/null; then
            git clone --depth=1 "$REPO_URL" /tmp/apkrepo
            git -C /tmp/apkrepo checkout -b repo
          fi
          DEST=/tmp/apkrepo/aarch64_cortex-a53/ponwrt
          mkdir -p "$DEST"
          cp -f output/*.apk "$DEST"/
          cp -f packages.adb "$DEST"/
          ( cd "$DEST" && sha256sum *.apk > SHA256SUMS )
          git -C /tmp/apkrepo add -A
          git -C /tmp/apkrepo -c user.email=ci@ponwrt -c user.name=ponwrt-ci \
            commit -m "repo: run=${{ github.run_number }} device=${{ inputs.device }} apk=${#files[@]}" || true
          if ! git -C /tmp/apkrepo push origin repo; then
            echo "::error::在线源推送失败（apk 已进 Release，但 raw 目录未更新）"
            exit 1
          fi
          echo ">>> 在线源：https://raw.githubusercontent.com/ufo1cn/ponwrt-apk-repo/repo/aarch64_cortex-a53/ponwrt"

      - name: Upload packages artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-packages-${{ inputs.device }}-${{ github.run_number }}
          path: |
            output/*
            build_log/package-summary.txt
            build_log/*.log
          retention-days: 14

      - name: Publish prerelease (apk + public key, 长期保留)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(output/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::output 为空，跳过预发布"
            exit 0
          fi
          tag="pkgs-${{ inputs.device }}-r${{ github.run_number }}"
          # artifact 只保留 14 天，Release 资产长期可用；公钥随包一起发布，换机/过期后仍能重取
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --prerelease \
              --title "apk $tag" \
              --notes "自动预发布：device=${{ inputs.device }} run=${{ github.run_number }} commit=${{ github.sha }}；含本次 apk 与签名公钥 public-key.pem(.sha256)。安装：public-key.pem 放到 /etc/apk/keys/ 后 apk add，或 apk add --allow-untrusted --no-network。"
          fi
