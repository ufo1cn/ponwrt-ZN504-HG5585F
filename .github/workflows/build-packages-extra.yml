name: PonWrt 软件包编译（扩展 C 类）

# ==============================================================================
# 只允许手动触发（workflow_dispatch）：无 push / schedule 触发。
#
# 用途：把旧仓库（ufo1cn/PonWrt-HG5382A）里"新仓树内没有、靠外挂 feed"的 C 类包
#       在**新仓同一内核源码树**上编成独立 apk，ABI 与固件一致、可直接安装。
#
# C 类清单与源码来源（全部来自旧仓库 build-package.yml 的实际做法）：
#   iptv        : https://github.com/yveming/openwrt-iptv.git        -> kmod-iptv / luci-app-iptv
#   nikki       : https://github.com/nikkinikki-org/OpenWrt-nikki.git -> nikki / luci-app-nikki / mihomo-meta / mihomo-alpha
#   passwall2   : https://github.com/Openwrt-Passwall/openwrt-passwall2.git -> luci-app-passwall2
#   homeproxy   : https://github.com/immortalwrt/homeproxy.git        -> luci-app-homeproxy
#   xray-core   : 已在 feeds 的 immortalwrt/packages（net/xray-core）
#
# 兼容性注意（已核对，写在这里防后人踩）：
#   1) kmod-iptv 是**现代 netdev API** 的模块（netdev_hold/netdev_put + dev_tracker、
#      dev_sw_netstats_rx_add/tx_add、dev->pcpu_stat_type、3 参 netdev_upper_dev_link、
#      gro_cells）。本树 config-6.18 已有 CONFIG_GRO_CELLS=y，故不是 6.6 时代老代码，
#      可直接在新内核树上重编。
#   2) luci-app-passwall2 的 LUCI_DEPENDS 含 +lyaml，而 immortalwrt/packages master 已移除
#      lyaml（只有 openwrt-24.10 保留）。这里按旧仓库同样做法 sparse 取
#      lang/lyaml + lang/luarocks + libs/yaml 注入本地 package/，不走"放宽依赖"。
#   3) mihomo-meta 与 mihomo-alpha 互 PROVIDES/CONFLICTS，一次只能选一个：用 inputs.mihomo 决定，
#      绝不两个都 sel 进 .config。
#   4) 只选 =m（不 =y），产物是 apk，不进固件。
#   5) 发布口径：本文件只出 artifact 与本仓 prerelease，**不 push apk-repo**；
#      进软件仓库（aarch64_cortex-a53/ponwrt-k<kver>/<能力>/）统一由 pkg-publish.yml 做。
# 5) kmod 归属：本流程只编用户态包；kmod 一律由固件构建流程 fw-build.yml 在同一次
#    构建里编成 apk，随固件 artifact 与 kmods-<label>-r<run> 预发布交付，
#    再由 pkg-publish.yml 统一搬进软件仓库。
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      device:
        description: '目标机型（决定 .config 里的设备锁定与 ABI）'
        required: true
        default: 'hg5585f-ct'
        type: choice
        options:
          - 'hg5585f-ct'
          - 'hg5382a'
      cache_mode:
        description: '缓存模式（完全重建会丢弃所有缓存）'
        required: true
        default: '使用缓存'
        type: choice
        options:
          - '使用缓存'
          - '完全重建'
      reuse_build_tree:
        description: '复用 build_dir/staging_dir 缓存（数 GB，命中才是真增量）'
        required: true
        default: true
        type: boolean
      only:
        description: '只编这些 apk（逗号分隔，all=全部；例：kmod-iptv,luci-app-iptv）'
        required: true
        default: 'all'
        type: string
      mihomo:
        description: 'mihomo 变体：meta=官方 release / alpha=滚动 commit / both=两个都编（安装期仍互斥）/ none=不编'
        required: true
        default: 'meta'
        type: choice
        options:
          - 'meta'
          - 'alpha'
          - 'both'
          - 'none'
      scope:
        description: '编哪一组：both=B类+C类，pon-userspace=B类，extra=C类（默认 extra：B 类由 incremental 编，避免重复）'
        required: true
        default: 'extra'
        type: choice
        options:
          - 'both'
          - 'pon-userspace'
          - 'extra'

concurrency:
  group: manual-extra-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_MAXSIZE: 5G
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  packages:
    name: 编译扩展包（${{ inputs.device }}）
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record source tree (userland-only build)
        run: |
          set -euo pipefail
          # 包流只编应用层；这里落一个 commit 标记，供 tree cache 的 key 使用，
          # 保证「换 commit 就换缓存」，增量复用不会把旧 commit 的产物带进来。
          {
            echo "aligned_commit=$(git rev-parse HEAD)"
            echo "firmware_commit=none"
            echo "firmware_kernel=none"
            echo "firmware_device=none"
          } > .ci-source-commit
          cat .ci-source-commit

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full pahole patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Install fixed apk signing key
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${APK_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::仓库未配置 APK_SIGNING_PRIVATE_KEY（全仓库固定同一把私钥），本次构建不能继续"
            exit 1
          fi
          # rules.mk: BUILD_KEY_APK_SEC=$(TOPDIR)/private-key.pem / BUILD_KEY_APK_PUB=$(TOPDIR)/public-key.pem
          # 全仓库固定同一把密钥：设备只需装一次 /etc/apk/keys/public-key.pem
          printf '%s\n' "$APK_SIGNING_PRIVATE_KEY" > private-key.pem
          chmod 600 private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem
          want=d557dca1a8b8d30b48f7e4b910908342789d389a52db3d7225c6b72840eda4ed
          got=$(sha256sum public-key.pem | cut -d' ' -f1)
          echo ">>> 签名公钥指纹：$got"
          [ "$got" = "$want" ] || { echo "::error::派生公钥指纹 $got 与固定密钥 $want 不一致"; exit 1; }

      - name: Restore build tree cache (与固件/增量包工作流共用前缀)
        if: inputs.reuse_build_tree && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build_dir/target-*
            build_dir/host
            staging_dir/target-*
            staging_dir/host
            bin/packages
          key: ponwrt-tree-${{ inputs.device }}-extra-${{ hashFiles('configs/**/*.config', 'target/linux/airoha/an7581/config-6.18', 'package/**', 'target/linux/**') }}-${{ github.run_id }}
          restore-keys: |
            ponwrt-tree-${{ inputs.device }}-extra-${{ hashFiles('configs/**/*.config', 'target/linux/airoha/an7581/config-6.18', 'package/**', 'target/linux/**') }}-
            ponwrt-tree-${{ inputs.device }}-extra-

      # 交叉工具链（gcc/binutils/musl）单独一份稳定 key 的缓存：
      # 原来它跟着 tree cache 走（key 带 run/sha，等于每 run 重存 300-400MB），
      # 而包流的 tree cache 根本没纳入 toolchain 路径 → 每轮重编 ~30 分钟。
      # 这里用「工具链源码内容哈希」做 key，命中一次就一直复用，
      # 只在新工具链源码/目标配置变化时自动失效并重建。
      - name: Restore host toolchain cache
        id: hosttc
        if: inputs.reuse_build_tree && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build_dir/toolchain-*
            staging_dir/toolchain-*
          key: ponwrt-hosttc-v1-${{ hashFiles('toolchain/**', 'configs/an7581.config', 'configs/release.config') }}

      - name: Restore downloads cache
        if: inputs.cache_mode != '完全重建'
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: ponwrt-dl-pkg-${{ hashFiles('feeds.conf.default', 'configs/**/*.config') }}-${{ github.run_id }}
          restore-keys: |
            ponwrt-dl-pkg-${{ hashFiles('feeds.conf.default', 'configs/**/*.config') }}-
            ponwrt-dl-pkg-

      - name: Restore compiler ccache
        if: inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ponwrt-ccache-pkg-${{ inputs.device }}-${{ github.run_id }}
          restore-keys: |
            ponwrt-ccache-pkg-${{ inputs.device }}-
            ponwrt-ccache-pkg-

      - name: Add extra feeds (C 类源码来源)
        run: |
          set -euo pipefail
          # 先删同名行，避免和我方新加的重复
          sed -i '/src-git nikki /d;/src-git homeproxy /d;/src-git passwall2 /d;/src-git oaf /d' feeds.conf.default
          cat >> feeds.conf.default <<'EOF'
          src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main
          # iptv feed 不再注入：kmod-iptv 与其上层已移交固件流程 fw-build.yml
          src-git homeproxy https://github.com/immortalwrt/homeproxy.git;master
          src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main
          # oaf feed：只取用户态 appfilter 与 luci-app-oaf；kmod-oaf 由固件流程编，包流 strip 掉该依赖
          src-git oaf https://github.com/destan19/OpenAppFilter.git
          EOF
          dos2unix feeds.conf.default 2>/dev/null || true
          cat feeds.conf.default

      - name: Inject lyaml chain (luci-app-passwall2 的硬依赖)
        run: |
          set -euo pipefail
          if [ -n "$(find package feeds -maxdepth 4 -type d -name lyaml -print -quit 2>/dev/null)" ]; then
            echo ">>> 树里已有 lyaml，跳过注入"
            exit 0
          fi
          echo "=== 注入 lyaml 依赖链（immortalwrt/packages openwrt-24.10）==="
          rm -rf /tmp/pk24
          git clone --depth=1 --filter=blob:none --sparse -b openwrt-24.10 \
            https://github.com/immortalwrt/packages.git /tmp/pk24
          git -C /tmp/pk24 sparse-checkout set lang/lyaml lang/luarocks libs/yaml
          mkdir -p package/lang package/libs
          cp -a /tmp/pk24/lang/lyaml package/lang/lyaml
          [ -d package/lang/luarocks ] || cp -a /tmp/pk24/lang/luarocks package/lang/luarocks
          [ -d package/libs/yaml ] || cp -a /tmp/pk24/libs/yaml package/libs/yaml
          grep -q 'PKG_NAME:=lyaml' package/lang/lyaml/Makefile \
            || { echo "::error::lyaml 注入失败"; exit 1; }
          grep -q 'PKG_NAME:=luarocks' package/lang/luarocks/Makefile \
            || { echo "::error::luarocks 注入失败（lyaml 的 Build 段依赖它）"; exit 1; }
          # 24.10 的 libs/yaml 里 PKG_NAME:=yaml，真正提供的是 Package/libyaml
          grep -q 'define Package/libyaml' package/libs/yaml/Makefile \
            || { echo "::error::libyaml(yaml) 注入失败"; exit 1; }
          echo ">>> lyaml / luarocks / libyaml 注入完成"

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Preflight 检查依赖内核树的包（只能随固件编）
        run: |
          set -euo pipefail
          # 口径：包流程只收纯用户态包（只依赖 arch + libc + uapi）。
          # 下列特征说明该包在构建期读内核源码树的派生物，产物与具体内核 config 绑定：
          # 换 config（例如 WED 分支多打 NPU/WED 补丁、改 DRAM 布局）后结构体偏移/内核符号
          # 全部失配，装上去不能正常运行。因此这类包只能随固件一起编（fw-build.yml），
          # 不许进包流程。
          hits=""
          defused=""
          for manifest in configs/pon-*.txt; do
            [ -f "$manifest" ] || continue
            while IFS='|' read -r path apk required || [ -n "${path:-}" ]; do
              [ -n "${path:-}" ] || continue
              case "$path" in \#*) continue ;; esac
              dir="$path"
              if [ ! -d "$dir" ]; then
                base=$(basename "$path")
                dir=$(find package/feeds feeds -maxdepth 4 \( -type d -o -type l \) -name "$base" 2>/dev/null | head -n 1 || true)
                { [ -n "$dir" ] && [ -f "$dir/Makefile" ]; } || dir=""
              fi
              [ -n "$dir" ] && [ -f "$dir/Makefile" ] || continue
              hit=""
              for pat in '$(LINUX_DIR)' '${LINUX_DIR}' '$(LINUX_KARCH)' 'vmlinux'; do
                line=$(grep -nF -- "$pat" "$dir/Makefile" 2>/dev/null | head -n 2 || true)
                [ -n "$line" ] && hit="${hit}      ${pat}: ${line}\n"
              done
              # KERNEL_MAKE 例外：只有「+$(KERNEL_MAKE) ... modules」这种整段可摘除的形态放行
              # （open-app-filter 的 oaf.ko 由它自己的 Makefile 顺手编，摘除动作在 incremental
              # 的 Strip 步骤里；本流不编它，这里只是别让清单里的它把 preflight 卡红）。
              if grep -q 'KERNEL_MAKE' "$dir/Makefile"; then
                if grep -qE '^[[:space:]]*\+\$\(KERNEL_MAKE\)' "$dir/Makefile"; then
                  defused="${defused}  ${apk} (${dir})\n"
                else
                  hit="${hit}      KERNEL_MAKE: $(grep -nF 'KERNEL_MAKE' "$dir/Makefile" | head -n 2)\n"
                fi
              fi
              if [ -n "$hit" ]; then
                hits="${hits}  ${manifest} :: ${apk} (${dir})\n${hit}"
              fi
            done < "$manifest"
          done
          if [ -n "$defused" ]; then
            echo ">>> 预检放行（内核编译段由 incremental 包流摘除）："
            echo -e "$defused"
          fi
          if [ -n "$hits" ]; then
            echo "::error::清单内存在需要内核源码树的包，必须随固件（fw-build）编译，不能进包流程："
            echo -e "$hits"
            exit 1
          fi
          echo ">>> 预检通过：清单内全部为纯用户态包"

      - name: Prepare custom packages and patches
        run: |
          bash ./scripts/customize.sh

      - name: Configure (same as firmware + B/C 类选择)
        run: |
          set -euo pipefail

          # kconfig.pl 的 + 是【二元】操作符（parse_expr 里 '+' 吃两个操作数），
          # 语法是 E = '+' E E | 文件名，所以 N 个文件必须用 N-1 个 +，
          # 且【最后一个文件前面不加 +】：`+ f1 + f2 f3`
          #   · `+ f1 f2 f3`     → 多余参数残留，die "Parse error" line 189
          #   · `+ f1 + f2 + f3` → 最内层 + 缺第二个操作数，die "Parse error" line 144
          files=(configs/an7581.config configs/release.config \
                 configs/pon-packages/*.config configs/pon-extra/*.config)
          merge_args=()
          n=${#files[@]}
          for ((i=0; i<n; i++)); do
            if [ "$i" -lt "$((n-1))" ]; then
              merge_args+=("+" "${files[$i]}")
            else
              merge_args+=("${files[$i]}")
            fi
          done
          echo ">>> kconfig.pl ${merge_args[*]}"
          ./scripts/kconfig.pl "${merge_args[@]}" > .config
          grep -c '^CONFIG_' .config

          sed -i '/^CONFIG_KERNEL_DEBUG_INFO_REDUCED=/d' .config
          printf 'CONFIG_KERNEL_DEBUG_INFO=y\n# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set\nCONFIG_KERNEL_DEBUG_INFO_BTF=y\nCONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y\nCONFIG_KERNEL_MODULE_ALLOW_BTF_MISMATCH=y\nCONFIG_KERNEL_KPROBES=y\nCONFIG_KERNEL_BPF_EVENTS=y\n' >> .config

          # mihomo 变体：两个包各自 PKG_BUILD_DIR，同一次构建里都 =m 不冲突
          # （kconfig 侧 package-metadata.pl 的 mconf_conflicts 只写
          #   `depends on m || (PACKAGE_<另一个> != y)`，即只禁止同时 =y；
          #   互斥落在安装期：两者都 PROVIDES:=mihomo 且互写 CONFLICTS）
          sed -i '/^CONFIG_PACKAGE_mihomo-meta=/d;/^CONFIG_PACKAGE_mihomo-alpha=/d' .config
          case "${{ inputs.mihomo }}" in
            meta)  echo 'CONFIG_PACKAGE_mihomo-meta=m' >> .config ;;
            alpha) echo 'CONFIG_PACKAGE_mihomo-alpha=m' >> .config ;;
            both)  echo 'CONFIG_PACKAGE_mihomo-meta=m' >> .config
                   echo 'CONFIG_PACKAGE_mihomo-alpha=m' >> .config ;;
            none) ;;
            *) echo "::error::未知 mihomo 变体 ${{ inputs.mihomo }}"; exit 1 ;;
          esac

          if [ "${{ inputs.cache_mode }}" != "完全重建" ]; then
            sed -i '/^CONFIG_DEVEL=/d; /^CONFIG_CCACHE=/d' .config
            printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
          fi

          make defconfig

          case "${{ inputs.device }}" in
            hg5585f-ct) DEVICE="fiberhome_hg5585f-ct" ;;
            hg5382a)    DEVICE="fiberhome_hg5382a" ;;
            *)          echo "::error::未知机型 ${{ inputs.device }}"; exit 1 ;;
          esac
          sed -i '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          sed -i '/^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.* is not set/d' .config
          printf 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_%s=y\n' "$DEVICE" >> .config
          grep -q "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${DEVICE}=y" .config \
            || { echo "::error::机型符号未落地: $DEVICE"; exit 1; }

          # 关键选择落地自检（缺失即报错，不靠放松依赖绕过）
          # iptv 已整体移交固件流程，这里只自检本流程仍要编的包
          for sym in CONFIG_PACKAGE_luci-app-passwall2 CONFIG_PACKAGE_xray-core \
                     CONFIG_PACKAGE_lyaml CONFIG_PACKAGE_honk CONFIG_PACKAGE_luci-app-honk; do
            grep -q "^${sym}=m" .config || { echo "::error::符号未落地: $sym"; exit 1; }
          done

      - name: Strip kmod selections (内核模块统一由固件流程编译)
        run: |
          set -euo pipefail
          # 设计口径：kmod 只由 fw-build 编（与固件同树同配置，vermagic 一致）。
          # run 45604653366 实证：只在 .config 里写 not set 不够——package/kernel/linux
          # Makefile 第 50 行硬写 CONFIG_PACKAGE_kernel=y 且无条件 BuildPackage,kernel
          # （hidden + default y），gpio-button-hotplug 是 KernelPackage（KERNEL_MAKE）。
          # 两者只要还在包元数据里，每次 syncconfig 都把 y 写回，任何
          # make package/.../compile 都会拉起 package/kernel/linux，包流没有内核构建
          # 产物 → install: cannot stat .../modules.builtin → package/kernel/linux failed
          # to build。因此在 CI 树内摘掉这两个包定义（不改仓库、不碰内核源码；
          # modules/*.mk 里的 kmod 定义保留），再删 tmpinfo 让元数据重建。
          kf=package/kernel/linux/Makefile
          gf=package/kernel/gpio-button-hotplug/Makefile
          for f in "$kf" "$gf"; do
            [ -f "$f" ] || { echo "::error::缺少 $f"; exit 1; }
          done
          grep -q 'BuildPackage,kernel' "$kf" || { echo "::error::$kf 形态变化：未找到 BuildPackage,kernel"; exit 1; }
          grep -q 'KernelPackage,gpio-button-hotplug' "$gf" || { echo "::error::$gf 形态变化：未找到 KernelPackage,gpio-button-hotplug"; exit 1; }
          awk '
            /^CONFIG_PACKAGE_kernel=y$/ { print "# CI(pkgs): kernel 元包由固件流程编，包流内摘除"; next }
            /BuildPackage,kernel/ { print "# CI(pkgs): " $0 "  # disabled: userland-only pkg flow"; next }
            { print }
          ' "$kf" > "$kf.ci" && mv "$kf.ci" "$kf"
          awk '
            /KernelPackage,gpio-button-hotplug/ { print "# CI(pkgs): " $0 "  # disabled: needs kernel tree"; next }
            { print }
          ' "$gf" > "$gf.ci" && mv "$gf.ci" "$gf"
          echo ">>> 已在树内摘除 kernel 元包与 gpio-button-hotplug 的包定义"
          rm -f tmp/.config-package.in tmp/.packageinfo tmp/.packagedeps

          sed -i -E '/^CONFIG_PACKAGE_(kmod-[^=]*|gpio-button-hotplug|kernel|appfilter|open-app-filter|oaf)=[my]/d' .config
          sed -i -E '/^# CONFIG_PACKAGE_(kmod-[^=]*|gpio-button-hotplug|kernel) is not set/d' .config
          left=$(grep -cE '^CONFIG_PACKAGE_(kmod-[^=]*|kernel|appfilter|open-app-filter|oaf)=' .config || true)
          echo ">>> 剩余 kmod / kernel 选择：${left:-0}"
          [ "${left:-0}" -eq 0 ] || { grep -E '^CONFIG_PACKAGE_(kmod-[^=]*|kernel|appfilter|open-app-filter|oaf)=' .config || true; echo "::error::.config 里仍有 kmod 或 kernel 选择，会触发内核编译"; exit 1; }

      # checkout 会把源码 mtime 刷成"现在"，而缓存解出来的产物保留旧 mtime，
      # make 一比就判定"产物过期"，把已编好的 host tools / toolchain 全部重编一遍
      # （实测这一下要 25-30 分钟）。把产物时间戳顶到未来，源码就永远比产物旧。
      # 只动 host/toolchain 两层：staging_dir/target-* 带 package stamp，
      # 推时间戳会有"stamp 在、apk 不在"的静默丢包风险（固件流注释里已踩过）。
      - name: Normalize cached host/toolchain mtimes
        if: inputs.cache_mode != '完全重建'
        run: |
          set -uo pipefail
          n=0
          for d in build_dir/host build_dir/toolchain-* staging_dir/host staging_dir/toolchain-*; do
            [ -e "$d" ] || continue
            # 只把 stamp 推到未来：make 判定的是「目标比前置新」，若源文件也推成同一刻，
            # 目标与前置等时 → 全部判成过期（extra #49/#50 实测：整套 tools 重编、
            # tools/xxhash 直接失败）。所以 stamp=2035、其余文件压到 2026-06-01（更早）。
            find "$d" -type f ! -path '*/stamp/*' -exec touch -d '2026-06-01 00:00:00' {} + 2>/dev/null || true
            # OpenWrt 的 host 包 stamp 不只在 */stamp/ 目录：新版把 .prepared<hash>/.configured/.built
            # 直接放在 build_dir/<pkg>/ 下（fakeroot/.prepared40996… 即是）。按文件名判定，
            # 否则这些点文件与源文件同一时刻 → 整套 tools 被误判过期重编（extra #55 实测 fakeroot/flex 失败）。
            find "$d" -type f -path '*/stamp/*' -exec touch -d '2035-01-01 00:00:00' {} + 2>/dev/null || true
            find "$d" -type f -regex '.*/\.(prepared|configured|built|installed|depends|quilt|patched|configure)[^/]*' \
              -exec touch -d '2035-01-01 00:00:00' {} + 2>/dev/null || true
            n=$((n+1))
          done
          # 缓存可能「有 stamp 无实物」：staging_dir/host/stamp/.libtool_installed 在，但
          # share/aclocal/libtool.m4 或 bin/ 下的工具没了 → automake/autoreconf 直接挂，
          # 表现为 flex（Makefile.in 重生成失败）/ fakeroot（LIBTOOL undefined）稳定暴红。
          # 缺关键文件就整层重编一次（约 15 分钟；修好后缓存即完整，后续照常跳过）。
          miss=""
          for b in flex bison m4 autoconf automake libtool pkgconf cmake ninja meson patch tar sed zstd fakeroot; do
            [ -x "staging_dir/host/bin/$b" ] || miss="$miss $b"
          done
          [ -f staging_dir/host/share/aclocal/libtool.m4 ] || miss="$miss libtool.m4"
          if [ -n "$miss" ]; then
            echo "::warning::host tools 缓存不完整，缺:$miss；清掉 host 层重编"
            ls -la staging_dir/host/share/aclocal 2>/dev/null | head -n 10 || true
            rm -rf build_dir/host staging_dir/host
            mkdir -p staging_dir/host
          fi
          echo ">>> 时间戳归一：${n} 个目录已归一（stamp=2035、源文件=2026-06-01，make 才会跳过已编产物）"

      - name: Build host tools and toolchain
        run: |
          set -uo pipefail
          fail=0
          make -j"$(nproc)" tools/compile || echo "::warning::并发编 tools 有失败，下面逐个排查"
          # flex / fakeroot 连续两轮稳定暴红，父级只打印 "failed to build"（子 make 的真实输出被吞）。
          # 这里单编这两个工具并开 V=s，把真实错误行落盘后打印出来。
          for t in flex fakeroot; do
            echo "=== 单编 tools/$t（V=s）==="
            if ! make -r -j1 V=s "tools/$t/compile" > "/tmp/tools_$t.log" 2>&1; then
              fail=1
              echo "::warning::tools/$t 单编失败，以下是被父级吞掉的真实输出"
              df -h . | tail -n 2 || true
              tail -n 200 "/tmp/tools_$t.log" || true
            else
              echo "tools/$t 单编通过"
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          make -j"$(nproc)" tools/compile
          make -j"$(nproc)" toolchain/compile
          make -j"$(nproc)" toolchain/compile


      - name: List kmod requirements (kmod 由固件流程编译)
        run: |
          set -uo pipefail
          python3 scripts/kmod-demand.py --root . \
            --manifest configs/pon-userspace-packages.txt configs/pon-extra-packages.txt \
            --only "${{ inputs.only }}" \
            --fwconfig configs/an7581.config configs/release.config configs/features/kmod-repo.config || true

      # kmod 的编译依赖一律从目标包 Makefile 里摘掉：包构建只要看到 +kmod-xxx，
      # make package/.../compile 就会去拉 package/kernel/linux（内核树不在这里，
      # 必挂 ERROR: package/kernel/linux failed to build）。kmod 本体统一由固件流程
      # fw-build.yml 编译发布，这里只编用户态，产出的 apk 不再声明 kmod 依赖。
      - name: Strip kmod DEPENDS from target packages (kmod 只由固件编)
        run: |
          set -uo pipefail
          : > /tmp/stripped-kmods.txt
          dumped=0; touched=0
          for manifest in configs/pon-userspace-packages.txt configs/pon-extra-packages.txt; do
            [ -f "$manifest" ] || continue
            while IFS='|' read -r path apk required || [ -n "${path:-}" ]; do
              [ -n "${path:-}" ] || continue
              case "$path" in \#*) continue ;; esac
              [ -f "$path/Makefile" ] || { echo "::warning::缺 Makefile：$path"; continue; }
              hits=$(sed -n -e '/^[[:space:]]*#/!p' "$path/Makefile" | grep -oE '\+(kmod-[A-Za-z0-9_.+-]+|kernel|gpio-button-hotplug|appfilter|open-app-filter|oaf)' | sed 's/^+//' | sort -u || true)
              # 有些包的 Makefile 用 $(KERNEL_MAKE) 在同一份文件里编内核模块（open-app-filter
              # 就是：+$(KERNEL_MAKE) ... M="$(PKG_BUILD_DIR)/oaf/src" modules）。包流没有内核
              # 构建产物，这段必须摘掉，只留用户态编译；oaf.ko 由固件流以 kmod-oaf apk 出。
              if grep -q 'KERNEL_MAKE' "$path/Makefile"; then
                cp -f "$path/Makefile" "/tmp/kernelmk-$(echo "$apk" | tr '/' '_').bak"
                sed -i -E '/^[[:space:]]*\+\$\(KERNEL_MAKE\)/{N;d}' "$path/Makefile"
                if grep -q 'KERNEL_MAKE' "$path/Makefile"; then
                  echo "::error::$apk 的 Makefile 仍有 KERNEL_MAKE 编译段（形态与预期不符），拒绝在包流编它"
                  exit 1
                fi
                echo ">>> 已摘除 $apk 的 Makefile 内核编译段（内核模块由固件流程编）"
              fi
              [ -n "$hits" ] || continue
              sed -i -E '/^[[:space:]]*#/! s/\+(kmod-[A-Za-z0-9_.+-]+|kernel|gpio-button-hotplug|appfilter|open-app-filter|oaf)//g' "$path/Makefile"
              sed -i -E '/^[[:space:]]*DEPENDS/ s/[[:space:]]+/ /g; /^[[:space:]]*DEPENDS/ s/[[:space:]]+$//' "$path/Makefile"
              touched=$((touched+1)); dumped=$((dumped+$(printf '%s\n' "$hits" | wc -l)))
              printf '%s\n' "$hits" >> /tmp/stripped-kmods.txt
              echo ">>> 摘掉 kmod 依赖：$apk ->$(printf ' %s' $hits)"
            done < "$manifest"
          done
          sort -u /tmp/stripped-kmods.txt -o /tmp/stripped-kmods.txt
          echo ">>> 共 $touched 个包、$(wc -l < /tmp/stripped-kmods.txt) 个不同 kmod 依赖被摘除（这些 kmod 由固件流程编）"
          echo "STRIPPED_KMODS<<EOF" >> "$GITHUB_ENV"
          cat /tmp/stripped-kmods.txt >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          { echo "### 已摘除的 kmod 依赖（由固件流程编译）"; echo '```'; cat /tmp/stripped-kmods.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # DEPENDS 摘掉之后必须重建包元数据：tmp/.config-package.in 还是摘之前的旧依赖图，
      # make 又会提示 configuration out of sync，于是每次 make package/.../compile
      # 都顺着旧图把 package/kernel/linux 拉起来（本流程没有内核树 →
      # ERROR: package/kernel/linux failed to build）。重建后依赖图才与打过补丁的
      # Makefile 一致，内核包不再被调度。
      - name: Refresh package metadata after DEPENDS strip
        run: |
          set -euo pipefail
          # 元数据重建：必须连扫描缓存一起清（tmp/info 里的 .scan-*.stamp 与 .files-*）。
          # 只删 tmp/.packageinfo 时，prepare-tmpinfo 的 scan_unchanged 会走「未变化」快
          # 路径、不重新 dump，于是 .config-package.in 变成空壳 → 清单包符号全部判缺
          #（incremental #68 实证）。这里显式 prepare-tmpinfo + oldconfig，并硬门控定义数。
          # 关键：不能删掉整个 tmp/info 目录。scan.mk 要在 tmp/info 下新建
          # .overrides-*/ .files-*/ .packageinfo-* 片段，目录不存在时 touch/find 失败、
          # FILELIST 为空，tmp/.packageinfo 被写成空文件（退出码仍 0）→ PACKAGE 定义 0 个
          #（incremental #69 实证：prepare-tmpinfo “成功”但定义数 0）。
          # 正确做法：保留目录，只清陈旧缓存与 stamp，让 scan.mk 全量重扫。
          rm -rf tmp/info && mkdir -p tmp/info
          rm -f tmp/.packageinfo tmp/.packagedeps tmp/.packageauxvars \
                tmp/.packageusergroup tmp/.config-package.in \
                tmp/.config-feeds.in tmp/.config-target.in
          timeout 1800 bash -c 'make -s prepare-tmpinfo' >/tmp/pkg-tmpinfo.log 2>&1 || {
            tail -n 40 /tmp/pkg-tmpinfo.log
            echo "::error::prepare-tmpinfo 失败（包元数据无法重建）"
            exit 1
          }
          pkgmeta_lines=$(wc -l < tmp/.packageinfo 2>/dev/null || echo 0)
          echo ">>> tmp/.packageinfo 行数 ${pkgmeta_lines}"
          [ "${pkgmeta_lines:-0}" -ge 10000 ] || {
            echo "--- prepare-tmpinfo 日志尾部"
            tail -n 60 /tmp/pkg-tmpinfo.log 2>/dev/null || true
            echo "--- tmp/info 现场"
            ls -l tmp/info 2>/dev/null | tail -n 20 || true
            echo "::error::包扫描未生效（tmp/.packageinfo 仅 ${pkgmeta_lines:-0} 行，scan.mk 未真正扫描）"
            exit 1
          }
          timeout 900 bash -c 'yes "" | make oldconfig' >/tmp/pkg-oldconfig-rebuild.log 2>&1 || {
            tail -n 60 /tmp/pkg-oldconfig-rebuild.log
            echo "::error::包元数据同步失败（oldconfig）"
            exit 1
          }
          # package-metadata.pl 输出的包定义行是 "\tconfig PACKAGE_x"（带一个 TAB 缩进），
          # 用 '^config PACKAGE_' 匹配永远 0 条（#68/#69/#20 的“符号全缺/定义 0 个”都是这个正则假警报）。
          # Kconfig 里缩进无语义，直接把行首缩进抹平，后面所有 ^config PACKAGE_ 判断与 awk 块提取才成立。
          sed -i -E 's/^[[:space:]]+(menuconfig|config) PACKAGE_/\1 PACKAGE_/' tmp/.config-package.in 2>/dev/null || true
          pkgdefs=$(grep -cE '^[[:space:]]*(menu)?config PACKAGE_' tmp/.config-package.in 2>/dev/null || true)
          echo ">>> 包元数据重建：PACKAGE 定义 ${pkgdefs:-0} 个"
          [ "${pkgdefs:-0}" -ge 5000 ] || {
            echo "::error::包元数据重建后定义过少（${pkgdefs:-0}），feeds 扫描未生效"
            ls -l tmp/.config-package.in 2>/dev/null || true
            exit 1
          }
          # oldconfig 会把 CONFIG_PACKAGE_kernel 之类的默认选项写回来，必须再摘一次
          sed -i -E '/^CONFIG_PACKAGE_(kmod-[^=]*|gpio-button-hotplug|kernel|appfilter|open-app-filter|oaf)=[my]/d' .config
          sed -i -E '/^# CONFIG_PACKAGE_(kmod-[^=]*|kernel|appfilter|open-app-filter|oaf) is not set/d' .config
          left=$(grep -cE '^CONFIG_PACKAGE_(kmod-[^=]*|kernel|appfilter|open-app-filter|oaf)=' .config || true)
          echo ">>> 元数据重建后剩余 kmod / kernel 选择：${left:-0}"
          [ "${left:-0}" -eq 0 ] || {
            grep -E '^CONFIG_PACKAGE_(kmod-[^=]*|kernel|appfilter|open-app-filter|oaf)=' .config || true
            echo "::error::重建包元数据后 .config 仍带 kmod 或 kernel 选择"
            exit 1
          }
          # 元数据层面再次确认 kernel 元包 / gpio-button-hotplug 已不在依赖图里
          if grep -qE '^[[:space:]]*(menu)?config PACKAGE_(kernel|gpio-button-hotplug)([[:space:]]|$)' tmp/.config-package.in 2>/dev/null; then
            grep -nE '^[[:space:]]*(menu)?config PACKAGE_(kernel|gpio-button-hotplug)([[:space:]]|$)' tmp/.config-package.in || true
            echo "::error::包元数据里仍有 kernel/gpio-button-hotplug 定义，会触发内核编译"
            exit 1
          fi
          echo ">>> 包元数据内 kernel/gpio 定义：0"
          # ffmpeg CLI（Package/ffmpeg）的存在由 FFMPEG_PROGRAMS 开关决定。开关没开时
          # PACKAGE_ffmpeg 不可选，清单包元数据里的 depends on FFMPEG_PROGRAMS 就不成立，
          # oldconfig 会把该清单包静默清回 not set（incremental #72：camwatch 写回 =m 后仍被清）。
          # 这是纯应用层构建开关（不碰内核），直接置 y；没有包依赖 ffmpeg CLI 时也不产生副作用。
          if ! grep -q '^CONFIG_FFMPEG_PROGRAMS=y' .config; then
            sed -i '/^CONFIG_FFMPEG_PROGRAMS=/d; /^# CONFIG_FFMPEG_PROGRAMS is not set/d' .config
            printf 'CONFIG_FFMPEG_PROGRAMS=y\n' >> .config
            echo ">>> 置 CONFIG_FFMPEG_PROGRAMS=y（让 ffmpeg CLI 可被清单包选中）"
          fi
          # ⑤ 清单包显式选中：包流 .config 来自固件配置，清单里的包未必在其中。
          #    没有 CONFIG_PACKAGE_<符号>=m 时 make <path>/compile 只做 build 不打包，
          #    表现为「编译命令成功但没有产出 apk」（run 45625439183 的 camlive/tailscale/cifs-utils）。
          #    清单第二列是 apk 文件名（可能带 ABI 后缀或为虚拟名），符号一律经
          #    scripts/pkg-name-map.sh 映射后再写 .config；符号是否存在由 oldconfig 后的
          #    .config 硬校验判定（映射覆盖不到的真名错误会在此报红，不静默丢）。
          strip_pkg_sel() {
            sed -i -E '/^CONFIG_PACKAGE_(kmod-[^=]*|gpio-button-hotplug|kernel|appfilter|open-app-filter|oaf)=[my]/d' .config
            sed -i -E '/^# CONFIG_PACKAGE_(kmod-[^=]*|kernel|appfilter|open-app-filter|oaf) is not set/d' .config
          }
          . scripts/pkg-name-map.sh
          only_pkgs="${{ inputs.only }}"
          case "${{ inputs.scope }}" in
            both)          sel_manifests=(configs/pon-userspace-packages.txt configs/pon-extra-packages.txt) ;;
            pon-userspace) sel_manifests=(configs/pon-userspace-packages.txt) ;;
            extra)         sel_manifests=(configs/pon-extra-packages.txt) ;;
            *)             sel_manifests=(configs/pon-userspace-packages.txt configs/pon-extra-packages.txt) ;;
          esac
          # 诊断：新包目录到底进没进扫描（省得下一轮再猜）
          echo ">>> [diag] packageinfo 里 camwatch 的 Source-Makefile 行数: $(grep -c 'package/pon-userspace/camwatch/Makefile' tmp/.packageinfo 2>/dev/null || echo 0)"
          echo ">>> [diag] config-package.in 里 PACKAGE_camwatch 定义行数: $(grep -c 'config PACKAGE_camwatch' tmp/.config-package.in 2>/dev/null || echo 0)"
          if [ -f logs/package/pon-userspace/camwatch/dump.txt ]; then
            echo ">>> [diag] camwatch dump 末尾："
            tail -n 12 logs/package/pon-userspace/camwatch/dump.txt || true
          fi
          selmiss=""
          selmissym=""
          # 依赖闭包：清单包的运行期依赖若在 .config 里没选中，oldconfig 会把本包静默清回
          # not set（r38 的 camwatch：依赖 ffmpeg / curl / jsonfilter 均未选中 → 被丢弃）。
          # 依赖列表取自刚重建的 tmp/.config-package.in（此时 Makefile 的 +kmod-* 已摘掉，
          # 元数据里不再有内核依赖）；kmod / kernel 类一律跳过（由固件流程提供）。
          : > /tmp/sel-seen.txt
          dep_skip() {
            case "$1" in kmod-*|kernel|gpio-button-hotplug|appfilter|open-app-filter|oaf) return 0 ;; esac
            return 1
          }
          dep_deps() {
            # 只取「depends on PACKAGE_x」会漏两类依赖（incremental #73 的 camwatch）：
            #   1) select PACKAGE_x —— 运行期硬依赖（ffmpeg/curl/jsonfilter 就是这么漏的）；
            #   2) depends on !(COND) || PACKAGE_x —— 条件依赖写成多 token，旧正则只认第一个词。
            # 所以这里把整段里的 PACKAGE_ 符号全部榨出来；不带 PACKAGE_ 的裸符号只认白名单
            # （FFMPEG_PROGRAMS 这类控制包本身是否存在的开关，=y 是安全的；BUILD_PATENTED 之类不碰）。
            awk -v sym="$1" '
              $0 ~ ("^[[:space:]]*(menu)?config PACKAGE_" sym "[[:space:]]*$") {inside=1; next}
              inside && /^[[:space:]]*(menu)?config / {inside=0}
              inside && $1=="select" {
                t=$2; sub(/^PACKAGE_/, "", t); print t; next
              }
              inside && $1=="depends" && $2=="on" {
                line=$0
                while (match(line, /PACKAGE_[A-Za-z0-9_+.-]+/)) {
                  t=substr(line, RSTART+8, RLENGTH-8); print t
                  line=substr(line, RSTART+RLENGTH)
                }
                if ($0 ~ /^[[:space:]]*depends on [A-Za-z0-9_]+[[:space:]]*$/) print "BARE:" $3
              }
            ' tmp/.config-package.in 2>/dev/null || true
          }

          sel_dep() {
            d_sym="$1"; d_depth="$2"
            [ -n "$d_sym" ] || return 0
            # 裸符号（dep_deps 用 BARE: 前缀标出）：只允许白名单里的构建开关置 =y。
            case "$d_sym" in
              BARE:*)
                d_sym="${d_sym#BARE:}"
                case "$d_sym" in
                  FFMPEG_PROGRAMS) ;;
                  *) return 0 ;;
                esac
                if ! grep -q "^CONFIG_${d_sym}=y" .config; then
                  sed -i "/^CONFIG_${d_sym}=/d; /^# CONFIG_${d_sym} is not set/d" .config
                  printf 'CONFIG_%s=y\n' "$d_sym" >> .config
                  echo ">>> 补选裸符号 ${d_sym}=y（深度 ${d_depth}）"
                fi
                return 0
                ;;
            esac
            dep_skip "$d_sym" && return 0
            grep -qxF "$d_sym" /tmp/sel-seen.txt 2>/dev/null && return 0
            echo "$d_sym" >> /tmp/sel-seen.txt
            if ! grep -qE "^[[:space:]]*(menu)?config PACKAGE_${d_sym}[[:space:]]*$" tmp/.config-package.in 2>/dev/null; then
              echo ">>> 依赖符号不在包元数据里，跳过：${d_sym}"
              return 0
            fi
            if ! grep -qE "^CONFIG_PACKAGE_${d_sym}=[ym]$" .config; then
              sed -i "/^CONFIG_PACKAGE_${d_sym}=/d; /^# CONFIG_PACKAGE_${d_sym} is not set/d" .config
              printf 'CONFIG_PACKAGE_%s=m\n' "$d_sym" >> .config
              echo ">>> 补选依赖 ${d_sym}=m（深度 ${d_depth}）"
            fi
            [ "$d_depth" -lt 12 ] || return 0
            for d_next in $(dep_deps "$d_sym"); do
              sel_dep "$d_next" $((d_depth+1))
            done
            return 0
          }
          sym_list=""
          for manifest in "${sel_manifests[@]}"; do
            [ -f "$manifest" ] || continue
            while IFS='|' read -r pkgpath pkgname pkgreq || [ -n "${pkgpath:-}" ]; do
              [ -n "${pkgpath:-}" ] || continue
              case "$pkgpath" in \#*) continue ;; esac
              if [ "$only_pkgs" != "all" ]; then
                echo ",$only_pkgs," | grep -q ",${pkgname}," || continue
              fi
              [ -d "$pkgpath" ] || continue
              sym=$(pkg_sym_for "$pkgname")
              sym_list="$sym_list $sym"
              if ! grep -qE "^CONFIG_PACKAGE_${sym}=[ym]$" .config; then
                sed -i "/^CONFIG_PACKAGE_${sym}=/d; /^# CONFIG_PACKAGE_${sym} is not set/d" .config
                printf 'CONFIG_PACKAGE_%s=m\n' "$sym" >> .config
                if [ "$sym" = "$pkgname" ]; then
                  echo ">>> 显式选中清单包 ${pkgname}=m"
                else
                  echo ">>> 显式选中清单包 ${pkgname} -> ${sym}=m（apk 文件名 $(pkg_apk_for "$pkgname")）"
                fi
              fi
              sel_dep "$sym" 1
            done < "$manifest"
          done
          timeout 900 bash -c 'yes "" | make oldconfig' >/tmp/pkg-oldconfig-sel.log 2>&1 || {
            tail -n 40 /tmp/pkg-oldconfig-sel.log
            echo "::error::清单包选择同步失败（oldconfig）"
            exit 1
          }
          # 缓存树上新加入的包目录（r38/r39 的 camwatch）：scan.mk 生成的
          # tmp/info/.files-packageinfo.mk 是「先 include 后重建」，单次 make 只认旧规则，
          # 新包既不进 tmp/.packageinfo、也就不进 tmp/.config-package.in —— Kconfig 里没有
          # 这个符号，oldconfig 会把 CONFIG_PACKAGE_<新包>=m 静默清掉（报成「包名不存在或
          # 依赖不可选」）。所以再跑一遍 oldconfig 让新规则生效；符号仍缺就清 tmp/info 全量重扫。
          timeout 900 bash -c 'yes "" | make oldconfig' >/tmp/pkg-oldconfig-sel2.log 2>&1 || true
          meta_miss=""
          for s in $sym_list; do
            if ! grep -qE "^[[:space:]]*(menu)?config PACKAGE_${s}[[:space:]]*$" tmp/.config-package.in; then
              meta_miss="$meta_miss $s"
              echo ">>> [diag] ${s} 未精确命中，近似行（cat -A 看隐藏字符）："
              grep -n "PACKAGE_${s}" tmp/.config-package.in 2>/dev/null | head -n 5 | cat -A || true
            fi
          done
          if [ -n "$meta_miss" ]; then
            echo ">>> 包元数据缺这些清单包符号，强制全量重扫：${meta_miss}"
          # 元数据重建：必须连扫描缓存一起清（tmp/info 里的 .scan-*.stamp 与 .files-*）。
          # 只删 tmp/.packageinfo 时，prepare-tmpinfo 的 scan_unchanged 会走「未变化」快
          # 路径、不重新 dump，于是 .config-package.in 变成空壳 → 清单包符号全部判缺
          #（incremental #68 实证）。这里显式 prepare-tmpinfo + oldconfig，并硬门控定义数。
          # 关键：不能删掉整个 tmp/info 目录。scan.mk 要在 tmp/info 下新建
          # .overrides-*/ .files-*/ .packageinfo-* 片段，目录不存在时 touch/find 失败、
          # FILELIST 为空，tmp/.packageinfo 被写成空文件（退出码仍 0）→ PACKAGE 定义 0 个
          #（incremental #69 实证：prepare-tmpinfo “成功”但定义数 0）。
          # 正确做法：保留目录，只清陈旧缓存与 stamp，让 scan.mk 全量重扫。
          rm -rf tmp/info && mkdir -p tmp/info
          rm -f tmp/.packageinfo tmp/.packagedeps tmp/.packageauxvars \
                tmp/.packageusergroup tmp/.config-package.in \
                tmp/.config-feeds.in tmp/.config-target.in
          timeout 1800 bash -c 'make -s prepare-tmpinfo' >/tmp/pkg-tmpinfo.log 2>&1 || {
            tail -n 40 /tmp/pkg-tmpinfo.log
            echo "::error::prepare-tmpinfo 失败（包元数据无法重建）"
            exit 1
          }
          pkgmeta_lines=$(wc -l < tmp/.packageinfo 2>/dev/null || echo 0)
          echo ">>> tmp/.packageinfo 行数 ${pkgmeta_lines}"
          [ "${pkgmeta_lines:-0}" -ge 10000 ] || {
            echo "--- prepare-tmpinfo 日志尾部"
            tail -n 60 /tmp/pkg-tmpinfo.log 2>/dev/null || true
            echo "--- tmp/info 现场"
            ls -l tmp/info 2>/dev/null | tail -n 20 || true
            echo "::error::包扫描未生效（tmp/.packageinfo 仅 ${pkgmeta_lines:-0} 行，scan.mk 未真正扫描）"
            exit 1
          }
          timeout 900 bash -c 'yes "" | make oldconfig' >/tmp/pkg-oldconfig-rebuild.log 2>&1 || {
            tail -n 60 /tmp/pkg-oldconfig-rebuild.log
            echo "::error::包元数据同步失败（oldconfig）"
            exit 1
          }
          # package-metadata.pl 输出的包定义行是 "\tconfig PACKAGE_x"（带一个 TAB 缩进），
          # 用 '^config PACKAGE_' 匹配永远 0 条（#68/#69/#20 的“符号全缺/定义 0 个”都是这个正则假警报）。
          # Kconfig 里缩进无语义，直接把行首缩进抹平，后面所有 ^config PACKAGE_ 判断与 awk 块提取才成立。
          sed -i -E 's/^[[:space:]]+(menuconfig|config) PACKAGE_/\1 PACKAGE_/' tmp/.config-package.in 2>/dev/null || true
          pkgdefs=$(grep -cE '^[[:space:]]*(menu)?config PACKAGE_' tmp/.config-package.in 2>/dev/null || true)
          echo ">>> 包元数据重建：PACKAGE 定义 ${pkgdefs:-0} 个"
          [ "${pkgdefs:-0}" -ge 5000 ] || {
            echo "::error::包元数据重建后定义过少（${pkgdefs:-0}），feeds 扫描未生效"
            ls -l tmp/.config-package.in 2>/dev/null || true
            exit 1
          }
            meta_miss=""
            for s in $sym_list; do
              if ! grep -qE "^[[:space:]]*(menu)?config PACKAGE_${s}[[:space:]]*$" tmp/.config-package.in; then
              meta_miss="$meta_miss $s"
              echo ">>> [diag] ${s} 未精确命中，近似行（cat -A 看隐藏字符）："
              grep -n "PACKAGE_${s}" tmp/.config-package.in 2>/dev/null | head -n 5 | cat -A || true
            fi
            done
            [ -z "$meta_miss" ] || { echo "::error::清单包符号始终不在包元数据里（Makefile 未扫描到或 dump 失败）:${meta_miss}"; exit 1; }
          fi
          # 二次 oldconfig / 重扫期间被清掉的 =m 在这里写回，再同步一次并重跑依赖闭包
          for s in $sym_list; do
            grep -qE "^CONFIG_PACKAGE_${s}=[ym]$" .config && continue
            sed -i "/^CONFIG_PACKAGE_${s}=/d; /^# CONFIG_PACKAGE_${s} is not set/d" .config
            printf 'CONFIG_PACKAGE_%s=m\n' "$s" >> .config
            echo ">>> 重新写回清单包选择 ${s}=m"
          done
          : > /tmp/sel-seen.txt
          for s in $sym_list; do sel_dep "$s" 1; done
          strip_pkg_sel
          timeout 900 bash -c 'yes "" | make oldconfig' >/tmp/pkg-oldconfig-sel3.log 2>&1 || {
            tail -n 40 /tmp/pkg-oldconfig-sel3.log
            echo "::error::清单包选择复同步失败（oldconfig）"
            exit 1
          }
          for manifest in "${sel_manifests[@]}"; do
            [ -f "$manifest" ] || continue
            while IFS='|' read -r pkgpath pkgname pkgreq || [ -n "${pkgpath:-}" ]; do
              [ -n "${pkgpath:-}" ] || continue
              case "$pkgpath" in \#*) continue ;; esac
              if [ "$only_pkgs" != "all" ]; then
                echo ",$only_pkgs," | grep -q ",${pkgname}," || continue
              fi
              [ -d "$pkgpath" ] || continue
              sym=$(pkg_sym_for "$pkgname")
              grep -qE "^CONFIG_PACKAGE_${sym}=[ym]$" .config || { selmiss="$selmiss ${pkgname}(符号 ${sym})"; selmissym="$selmissym $sym"; }
            done < "$manifest"
          done
          if [ -n "$selmiss" ]; then
            echo "::error::清单包在 .config 未被选中（包名不存在或依赖不可选）:${selmiss}"
            for s in $selmissym; do
              echo "--- 元数据里的 PACKAGE_${s} ---"
              grep -n -A12 -E "^(menu)?config PACKAGE_${s}" tmp/.config-package.in 2>/dev/null | head -n 30 || true
            done
            exit 1
          fi
          echo ">>> 清单包全部已在 .config 选中（kmod/kernel/gpio 选择仍为 0）"

      # kmod 不在这里编：统一由固件构建流程（fw-build.yml）编译并作为 apk 发布，
      # 保证 build/src/ABI 与固件同一次构建一致（清单见 configs/features/kmod-repo.config）
      - name: Build packages (B/C 两组清单, no silent drop)
        run: |
          set -euo pipefail
          mkdir -p output build_log
          . scripts/pkg-name-map.sh

          scope="${{ inputs.scope }}"
          manifests=()
          case "$scope" in
            both)          manifests=(configs/pon-userspace-packages.txt configs/pon-extra-packages.txt) ;;
            pon-userspace) manifests=(configs/pon-userspace-packages.txt) ;;
            extra)         manifests=(configs/pon-extra-packages.txt) ;;
            *)             echo "::error::未知 scope $scope"; exit 1 ;;
          esac

          only="${{ inputs.only }}"
          fail=0; summary=""; skipped=""

          # only 名单必须能在清单里命中：拿一堆清单里没有的包名来派发时，
          # 过滤会把整轮全部跳过，产物 0 个却仍报 success（run 45731416136 / 45734129911 的坑）。
          if [ "$only" != "all" ]; then
            miss_only=""; hit_only=0
            IFS=',' read -r -a only_arr <<< "$only"
            for name in "${only_arr[@]}"; do
              [ -n "$name" ] || continue
              found=0
              for manifest in "${manifests[@]}"; do
                [ -f "$manifest" ] || continue
                grep -qE "^[^#][^|]*\|${name}\|" "$manifest" && found=1
              done
              if [ "$found" -eq 1 ]; then hit_only=$((hit_only+1)); else miss_only="$miss_only $name"; fi
            done
            if [ "$hit_only" -eq 0 ]; then
              echo "::error::only 名单在清单里一个都没命中：${only}（清单只认 configs/pon-*-packages.txt 里的包名）"
              exit 1
            fi
            [ -z "$miss_only" ] || echo "::warning::only 名单里这些包不在清单中，将被忽略：${miss_only}"
          fi
          # ------------------------------------------------------------------
          # 批量编译：把「一个包一次 make」改成「一批包一次 make」。
          # 每次 make 都要重新解析整棵树（feeds 扫描 -> tmp/.packageinfo -> 依赖图），
          # 空转 30-60 秒；清单 29-37 个包 = 20-35 分钟纯启动开销，跟真实编译无关。
          # 增量：bin/packages 已随 tree cache 一起恢复，已编好的包 make 自己会跳过；
          # 这里再按 apk 哈希判定 REUSE，汇报里能区分「本轮真编」与「沿用上轮产物」。
          # ------------------------------------------------------------------
          BATCH="${BATCH_SIZE:-8}"
          bt_path=(); bt_apk=(); bt_apkf=()
          batch_no=0
          : > /tmp/prebuilt.txt
          if [ -d bin/packages ]; then
            ( cd bin/packages && find . -type f -name '*.apk' -exec sha256sum {} + ) >> /tmp/prebuilt.txt 2>/dev/null || true
          fi
          echo ">>> 缓存里已有 apk $(wc -l < /tmp/prebuilt.txt) 个（已编好的包不重编，直接复用）"

          apk_of() { find bin/packages bin/targets -type f -name "$1-[0-9]*.apk" 2>/dev/null | head -n 1; }

          collect_one() {  # $1=apk 文件名基  $2=包名
            local apkf="$1" apk="$2" hit sha tag
            hit=$(apk_of "$apkf")
            if [ -z "$hit" ]; then
              echo "::error::$apk 编译命令成功但没有产出 apk"
              summary="${summary}\nFAIL   $apk（无 apk 产出）"; fail=1
              return 1
            fi
            sha=$(sha256sum "$hit" | awk '{print $1}')
            if grep -q "^$sha" /tmp/prebuilt.txt 2>/dev/null; then tag="REUSE"; else tag="BUILD"; fi
            cp -f "$hit" output/
            summary="${summary}\nOK[$tag] $apk -> $hit"
            echo ">>> OK[$tag] $apk -> $hit"
          }

          # ------------------------------------------------------------------
          # 包流零 kmod、零内核：每次 make 之前重申一遍（#61 / #86 根因）
          #   rebuild 元数据后，若 .config 比 tmp/.config-package.in 旧，make 会自动
          #   跑 oldconfig，把 CONFIG_PACKAGE_kernel / kmod-* 的默认选择写回，于是把
          #   package/kernel/linux 拉进构建；包流树里没有内核产物，LINUX_VERMAGIC
          #   落到 unknown，kmod 的 EXTRA_DEPENDS 变成 “kernel (=6.18.60~unknown-r1)”
          #   这种非法依赖串 —— apk 元数据校验直接 Error 99 → kernel 包失败、整批失败。
          #   这里把 kernel/kmod 选择清成显式 not set，并 touch .config 抬高 mtime，
          #   让 make 判定无需 oldconfig。
          # ------------------------------------------------------------------
          sanitize_config() {
            sed -i -E 's#^CONFIG_PACKAGE_(kmod-[A-Za-z0-9_.+-]+|gpio-button-hotplug)=.*#\# CONFIG_PACKAGE_\1 is not set#' .config
            sed -i -E 's#^CONFIG_PACKAGE_kernel=.*#\# CONFIG_PACKAGE_kernel is not set#' .config
            grep -q '^# CONFIG_PACKAGE_kernel is not set' .config \
              || echo '# CONFIG_PACKAGE_kernel is not set' >> .config
            local n
            n=$(grep -c '^CONFIG_PACKAGE_kmod-' .config 2>/dev/null || true)
            if [ "${n:-0}" -gt 0 ]; then
              echo "::error::净化后仍有 ${n} 个 CONFIG_PACKAGE_kmod-* 被选中（包流不允许编 kmod）"
              exit 1
            fi
            if grep -q '^CONFIG_PACKAGE_kernel=' .config; then
              echo "::error::净化后 CONFIG_PACKAGE_kernel 仍被选中（会拉 package/kernel/linux 进构建）"
              exit 1
            fi
            touch .config
          }

          # 用户态清单里「同一份 Makefile 内联编内核模块」的包（open-app-filter 的 oaf.ko）：
          # 包流没有内核源码树，编前把 +kmod-* 依赖摘掉、Build/Compile 改写回默认用户态编译，
          # kmod 本体仍由固件流程交付（不在包流产出）。
          strip_embedded_kernel_build() {
            local path="$1" mk="$1/Makefile"
            [ -f "$mk" ] || return 0
            grep -q 'define KernelPackage/' "$mk" || return 0
            grep -q 'define Package/' "$mk" || return 0
            grep -q 'KERNEL_MAKE' "$mk" || return 0
            sed -i -E 's/\+(kmod-[A-Za-z0-9_.+-]+)//g' "$mk"
            # 只摘 Build/Compile 不够：KernelPackage/xxx 这段定义会让 .built 依赖
            # build_dir/.../linux-<ver>/.config（内核树），包流没有内核源码，会报
            # "No rule to make target .../.config"。整段定义和它的 eval 一行一起删掉。
            sed -i '/^define KernelPackage\//,/^endef/d' "$mk"
            sed -i '/^\$(eval \$(call KernelPackage,/d' "$mk"
            # kernel.mk 自带 `-include $(LINUX_DIR)/.config`，且它的 KernelPackage 机制会把内核树
            # .config 变成 .built 的前置依赖。包流没有内核源码，光删 KernelPackage 段不够，
            # 必须把 include kernel.mk 一起摘掉（r89 实证：删段后仍报 No rule to make target
            # .../linux-6.18.60/.config, needed by .../.built）。
            sed -i '\#^include \$(INCLUDE_DIR)/kernel.mk#d' "$mk"
            # 含 KERNEL_MAKE 的 Build/Compile 定义块整体丢弃，再在 BuildPackage 之前补默认用户态编译，
            # 保证 eval 时拿到的是 $(call Build/Compile/Default)，而不是残留的 oaf.ko 编译段。
            awk '
              /^define Build\/Compile/ { inblk=1; buf=$0 "\n"; next }
              inblk { buf=buf $0 "\n"; if ($0 ~ /^endef/) { inblk=0; if (buf !~ /KERNEL_MAKE/) printf "%s", buf; buf="" } next }
              { print }
              END { if (inblk) printf "%s", buf }
            ' "$mk" > "$mk.stripped" && mv "$mk.stripped" "$mk"
            awk '{ if (!done && $0 ~ /\$\(eval \$\(call BuildPackage,/) { print "Build/Compile=$(call Build/Compile/Default)"; done=1 } print }' "$mk" > "$mk.stripped" && mv "$mk.stripped" "$mk"
            if grep -q 'KernelPackage\|KERNEL_MAKE\|include \$(INCLUDE_DIR)/kernel.mk' "$mk"; then
              echo "::warning::$mk 剥离后仍有内核依赖残留，请检查"
            fi
            echo ">>> 已改写 $mk：删掉内联 KernelPackage 段、摘掉 +kmod-*，Build/Compile 回落到默认用户态编译"
          }

          flush_batch() {
            sanitize_config
            if [ "${#bt_path[@]}" -eq 0 ]; then return 0; fi
            local targets=() i k
            for k in "${!bt_path[@]}"; do strip_embedded_kernel_build "${bt_path[$k]}"; done
            for i in "${!bt_path[@]}"; do targets+=("${bt_path[$i]}/compile"); done
            batch_no=$((batch_no+1))
            echo ">>> 批量编译 ${#bt_path[@]} 个包（batch-${batch_no}）：${bt_apk[*]}"
            if make -j"$(nproc)" "${targets[@]}" > "build_log/batch-${batch_no}.log" 2>&1; then
              for i in "${!bt_apk[@]}"; do collect_one "${bt_apkf[$i]}" "${bt_apk[$i]}"; done
            else
              echo ">>> batch-${batch_no} 内有失败，逐包复跑定位（日志 build_log/batch-${batch_no}.log）"
              for i in "${!bt_path[@]}"; do build_one "${bt_path[$i]}" "${bt_apk[$i]}" "${bt_apkf[$i]}"; done
            fi
            bt_path=(); bt_apk=(); bt_apkf=()
          }

          build_one() {
            local path="$1" apk="$2" apkf="$3"
            sanitize_config
            strip_embedded_kernel_build "$path"
            if make -j"$(nproc)" "$path/compile" 2>&1 | tee "build_log/${apk}.log"; then
              hit=$(find bin/packages bin/targets -type f -name "${apkf}-[0-9]*.apk" | head -n 1)
              if [ -n "$hit" ]; then
                summary="${summary}\nOK     $apk -> $hit"
                cp -f "$hit" output/
              else
                echo "::error::$apk 编译命令成功但没有产出 apk"
                summary="${summary}\nFAIL   $apk（无 apk 产出）"; fail=1
              fi
            else
              echo "::error::$apk 编译失败，日志 build_log/${apk}.log"
              { echo; echo ">>> 并行编译看不到原始错误，用 -j1 V=s 复跑取尾部 100 行"; \
                make -j1 V=s "$path/compile" 2>&1 | tail -n 100; } >> "build_log/${apk}.log" || true
              summary="${summary}\nFAIL   $apk（编译失败）"; fail=1
            fi
          }

          for manifest in "${manifests[@]}"; do
            if [ ! -f "$manifest" ]; then
              echo "::error::缺少清单 $manifest"
              summary="${summary}\nFAIL   (manifest) 缺失 $manifest"; fail=1
              continue
            fi
            echo ">>> 清单 $manifest"
          while IFS='|' read -r path apk required || [ -n "${path:-}" ]; do
            [ -n "${path:-}" ] || continue
            case "$path" in \#*) continue ;; esac

            if [ "$only" != "all" ]; then
              echo ",$only," | grep -q ",$apk," || continue
            fi

            # mihomo 变体门控：both 时两个都编；meta/alpha 时只编其一
            case "$apk" in
              mihomo-meta)
                case "${{ inputs.mihomo }}" in meta|both) ;; *)
                  skipped="${skipped}\nSKIP   $apk（本次变体为 ${{ inputs.mihomo }}）"; continue ;; esac ;;
              mihomo-alpha)
                case "${{ inputs.mihomo }}" in alpha|both) ;; *)
                  skipped="${skipped}\nSKIP   $apk（本次变体为 ${{ inputs.mihomo }}）"; continue ;; esac ;;
            esac

            # feed 内包路径可能被 feeds install 换成 package/feeds/<feed>/<dir>：
            # 路径不存在时按目录名回退查找，不写死、也不静默跳过。
            if [ ! -d "$path" ]; then
              base=$(basename "$path")
              # package/feeds/<feed>/<pkg> 是 symbols link，find -type d 会漏掉，
              # 必须把 -type l 也算进来；同时只认真正带 Makefile 的目录，
              # 裸 feeds/ 目录没有 <path>/compile 规则，编它必然失败。
              hit_dir=$(find package/feeds -maxdepth 4 \( -type d -o -type l \) -name "$base" 2>/dev/null | head -n 1)
              [ -n "$hit_dir" ] || hit_dir=$(find feeds -maxdepth 4 \( -type d -o -type l \) -name "$base" 2>/dev/null | head -n 1)
              if [ -n "$hit_dir" ] && [ ! -f "$hit_dir/Makefile" ]; then hit_dir=""; fi
              if [ -n "$hit_dir" ]; then
                echo ">>> 路径回退: $path -> $hit_dir"
                path="$hit_dir"
              fi
            fi

            if [ ! -d "$path" ]; then
              if [ "$required" = "optional" ]; then
                summary="${summary}\nSKIP   $apk（源码目录缺失 $path，optional）"
                continue
              fi
              echo "::error::必需包 $apk 的源码目录不存在: $path"
              summary="${summary}\nFAIL   $apk（源码目录缺失 $path）"; fail=1
              continue
            fi

            sym=$(pkg_sym_for "$apk")
            apkf=$(pkg_apk_for "$apk")
            echo ">>> 入批 $apk ($path)（符号 ${sym}，产物 ${apkf}-*.apk）"
            bt_path+=("$path"); bt_apk+=("$apk"); bt_apkf+=("$apkf")
            if [ "${#bt_path[@]}" -ge "$BATCH" ]; then flush_batch; fi
          done < "$manifest"
          done
          flush_batch

          # 本次编译产出的 apk 全部收集（不再只收 only 名单里的）：
          # make 自动拉起来编的依赖包也在 bin/packages 里，按 only 过滤会丢依赖
          n_extra=0
          collect_list=$(find bin/packages bin/targets -type f -name '*.apk' -not -path '*/host/*' 2>/dev/null | sort || true)
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if cp -f "$f" output/ 2>/dev/null; then n_extra=$((n_extra+1)); fi
          done <<< "$collect_list"
          echo ">>> 收集 apk 共 ${n_extra} 个（含依赖，output/）"

          {
            echo "# 独立包逐包结果（${{ inputs.device }} / scope=$scope / mihomo=${{ inputs.mihomo }}）"
            echo -e "$summary"
            [ -n "$skipped" ] && echo -e "\n$skipped" || true
          } > build_log/extra-package-summary.txt
          cat build_log/extra-package-summary.txt
          {
            echo "### 逐包结果（${{ inputs.device }} / scope=$scope / mihomo=${{ inputs.mihomo }}）"
            echo '```'
            cat build_log/extra-package-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 0 产物必须报红：空 artifact 只带公钥时不能算成功
          if [ "${n_extra:-0}" -eq 0 ]; then
            echo "::error::本轮 0 个 apk 产出（only='${only}'），判为失败"
            exit 1
          fi

          cd output
          for f in *; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done
          exit $fail

      - name: Export apk signing public key
        if: always()
        run: |
          set -uo pipefail
          mkdir -p output
          # rules.mk: BUILD_KEY_APK_PUB=$(TOPDIR)/public-key.pem
          # 每次 run 现生成一套签名密钥，把本次公钥放进 artifact，
          # 设备装包前丢进 /etc/apk/keys/ 即可免 --allow-untrusted。
          if [ -f public-key.pem ]; then
            cp -f public-key.pem output/public-key.pem
            sha256sum output/public-key.pem | tee output/public-key.pem.sha256
          else
            echo "::warning::本 run 未生成 public-key.pem（命中缓存或未签名），artifact 里不含公钥"
          fi

      - name: Save host toolchain cache
        if: always() && inputs.reuse_build_tree && inputs.cache_mode != '完全重建' && steps.hosttc.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir/toolchain-*
            staging_dir/toolchain-*
          key: ponwrt-hosttc-v1-${{ hashFiles('toolchain/**', 'configs/an7581.config', 'configs/release.config') }}

      - name: Save downloads cache
        if: always() && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ponwrt-dl-pkg-${{ hashFiles('feeds.conf.default', 'configs/**/*.config') }}-${{ github.run_id }}

      - name: Save compiler ccache
        if: always() && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ponwrt-ccache-pkg-${{ inputs.device }}-${{ github.run_id }}

      - name: Save build tree cache
        if: always() && inputs.reuse_build_tree && inputs.cache_mode != '完全重建'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir/target-*
            build_dir/host
            staging_dir/target-*
            staging_dir/host
            bin/packages
          key: ponwrt-tree-${{ inputs.device }}-extra-${{ hashFiles('configs/**/*.config', 'target/linux/airoha/an7581/config-6.18', 'package/**', 'target/linux/**') }}-${{ github.run_id }}

      - name: Stage host apk tool for the publish workflow
        if: always()
        run: |
          set -uo pipefail
          # pkg-publish.yml 用同一份 host apk 生成并签名索引，避免两处工具版本不一致
          mkdir -p pubtool
          for c in staging_dir/host/bin/apk build_dir/host*/apk-*/apk; do
            if [ -f "$c" ] && [ -x "$c" ]; then
              cp -f "$c" pubtool/apk
              chmod +x pubtool/apk
              break
            fi
          done
          if [ -x pubtool/apk ]; then
            ./pubtool/apk --version || true
            sha256sum pubtool/apk
          else
            echo "::warning::本 run 没有可用的 host apk，publish 工作流需要它来签索引"
          fi
      - name: Upload packages artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-extra-packages-${{ inputs.device }}-${{ github.run_number }}
          path: |
            output/*
            build_log/extra-package-summary.txt
            build_log/*.log
            pubtool/apk
          retention-days: 14

      - name: Publish prerelease (apk + public key, 长期保留)
        # 只在构建成功且确有 apk 时发布：空 run 曾留下 r29/r30 两个只含公钥的空预发布
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(output/*)
          apks=(output/*.apk)
          if [ ${#files[@]} -eq 0 ] || [ ${#apks[@]} -eq 0 ]; then
            echo "::warning::没有 apk 产物，跳过预发布（避免空 release）"
            exit 0
          fi
          tag="pkgs-extra-${{ inputs.device }}-r${{ github.run_number }}"
          # artifact 只保留 14 天，Release 资产长期可用；公钥随包一起发布
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --prerelease \
              --title "apk $tag" \
              --notes "自动预发布：device=${{ inputs.device }} run=${{ github.run_number }} commit=${{ github.sha }}；含本次 apk 与签名公钥 public-key.pem(.sha256)。安装：public-key.pem 放到 /etc/apk/keys/ 后 apk add，或 apk add --allow-untrusted --no-network。"
          fi
