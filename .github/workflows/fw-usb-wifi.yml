name: PonWrt 固件构建（USB + WiFi 机型）

# 机型类别：usb-wifi
# 这一类机型的软件能力集合完全一致（见 configs/device-features.txt），
# 所以可以放在同一条工作流里编；真正的编译逻辑在 fw-build.yml（reusable）。
# 现有：HG5585F-CT（USB 3.0 主机 + MT7916 内置无线）
# 将来同类的 HG5585F-CU / -usb-sfp 变体直接加进 device_list（空格分隔）
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: '上传 GitHub Release'
        required: false
        default: true
        type: boolean
      cache_mode:
        description: '编译缓存模式（使用缓存 / 重新编译 / 不使用缓存）'
        required: false
        default: '使用缓存'
        type: choice
        options:
          - '使用缓存'
          - '重新编译'
          - '不使用缓存'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/fw-build.yml
    with:
      label: 'usb-wifi'
      device_list: 'fiberhome_hg5585f-ct'
      upload_release: ${{ inputs.upload_release }}
      cache_mode: ${{ inputs.cache_mode }}
    secrets: inherit
