name: CI 结果通知（飞书）

on:
  workflow_run:
    workflows:
      - "PonWrt 固件构建（全机型）"
      - "Build Packages (userland only, incremental) manual"
      - "Build Packages (legacy | 旧仓有、新仓无的用户态软件) manual"
      - "Build Packages (extra C-class | iptv/nikki/passwall2/homeproxy) manual"
    types: [completed]
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: feishu-ci-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 推送飞书卡片
        env:
          FEISHU_HOOK: ${{ secrets.FEISHU_HOOK }}
          FEISHU_SIGN: ${{ secrets.FEISHU_SIGN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, hmac, json, os, time, urllib.request

          HOOK = os.environ["FEISHU_HOOK"]
          SECRET = os.environ["FEISHU_SIGN"]
          TOKEN = os.environ["GH_TOKEN"]
          REPO = os.environ["REPO"]


          def api(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + TOKEN,
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "ci-notify",
              })
              return json.load(urllib.request.urlopen(req, timeout=30))


          def push(card):
              ts = str(int(time.time()))
              sign = base64.b64encode(
                  hmac.new(f"{ts}\n{SECRET}".encode(), digestmod=hashlib.sha256).digest()
              ).decode()
              body = json.dumps({"timestamp": ts, "sign": sign, "msg_type": "interactive", "card": card},
                                ensure_ascii=False).encode()
              req = urllib.request.Request(HOOK, data=body,
                                           headers={"Content-Type": "application/json; charset=utf-8"})
              r = json.loads(urllib.request.urlopen(req, timeout=20).read().decode())
              print("feishu resp:", json.dumps(r, ensure_ascii=False))
              if r.get("code") not in (0, None):
                  raise SystemExit("feishu rejected: %s" % r)


          def minutes(run):
              try:
                  fmt = "%Y-%m-%dT%H:%M:%SZ"
                  d = time.mktime(time.strptime(run["updated_at"], fmt)) - \
                      time.mktime(time.strptime(run["created_at"], fmt))
                  return "%d 分 %02d 秒" % (int(d) // 60, int(d) % 60)
              except Exception:
                  return "未知"


          def card_for_run(run, failed_steps):
              concl = run.get("conclusion") or "unknown"
              color, label = {
                  "success": ("green", "✅ 成功"),
                  "failure": ("red", "❌ 失败"),
                  "cancelled": ("grey", "⚪ 已取消"),
                  "skipped": ("grey", "⚪ 跳过"),
              }.get(concl, ("blue", concl))
              branch = run.get("head_branch") or "-"
              title = "%s %s · %s" % (label, run.get("name", ""), branch)
              fields = [
                  ("分支", branch, True),
                  ("提交", (run.get("head_sha") or "")[:8], True),
                  ("触发", run.get("event", "-"), True),
                  ("耗时", minutes(run), True),
                  ("run", "#%s" % run.get("run_number"), True),
                  ("状态", concl, True),
              ]
              els = [{"tag": "div", "fields": [
                  {"is_short": s, "text": {"tag": "lark_md", "content": "**%s**\n%s" % (k, v)}} for k, v, s in fields
              ]}]
              if failed_steps:
                  els.append({"tag": "hr"})
                  els.append({"tag": "div", "text": {"tag": "lark_md",
                                                           "content": "**失败步骤**\n" + "\n".join("· " + x for x in failed_steps[:8])}})
              els.append({"tag": "action", "actions": [{
                  "tag": "button", "text": {"tag": "plain_text", "content": "打开 run"},
                  "url": run.get("html_url"), "type": "primary"}]})
              els.append({"tag": "note", "elements": [{"tag": "plain_text",
                                                        "content": "仓库 %s · head %s" % (REPO, (run.get("head_sha") or "")[:8])}]})
              return {"config": {"wide_screen_mode": True},
                      "header": {"template": color, "title": {"tag": "plain_text", "content": title}},
                      "elements": els}


          ev = {}
          p = os.environ.get("GITHUB_EVENT_PATH")
          if p and os.path.exists(p):
              ev = json.load(open(p, encoding="utf-8"))
          run = ev.get("workflow_run")

          if not run:
              push({"config": {"wide_screen_mode": True},
                    "header": {"template": "blue", "title": {"tag": "plain_text", "content": "CI 通知通道测试"}},
                    "elements": [{"tag": "div", "text": {"tag": "lark_md",
                                                               "content": "手动触发成功：webhook 与签名校验均可用。后续每次固件/包工作流结束都会自动推送。"}}]})
          else:
              failed = []
              if run.get("conclusion") == "failure":
                  try:
                      jobs = api("https://api.github.com/repos/%s/actions/runs/%s/jobs?per_page=100"
                                 % (REPO, run["id"]))["jobs"]
                      for j in jobs:
                          if j.get("conclusion") == "failure":
                              bad = [s["name"] for s in j.get("steps", []) if s.get("conclusion") == "failure"]
                              failed.append("%s → %s" % (j["name"], bad[0] if bad else "（job 失败）"))
                  except Exception as e:
                      failed.append("（读取 job 明细失败：%s）" % e)
              push(card_for_run(run, failed))
          PY
