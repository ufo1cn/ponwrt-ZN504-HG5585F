name: PonWrt 固件构建（USB 无 WiFi 机型）

# 机型类别：usb
# 这一类机型的软件能力集合完全一致（见 configs/device-features.txt），
# 所以可以放在同一条工作流里编；真正的编译逻辑在 fw-build.yml（reusable）。
# 现有：Nokia XG-040G-MD（USB 主机 + 无内置无线，USB 网卡驱动走 usb 片段）
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: '上传 GitHub Release'
        required: false
        default: true
        type: boolean
      cache_mode:
        description: '编译缓存模式（使用缓存 / 重新编译 / 不使用缓存）'
        required: false
        default: '使用缓存'
        type: choice
        options:
          - '使用缓存'
          - '重新编译'
          - '不使用缓存'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/fw-build.yml
    with:
      label: 'usb'
      device_list: 'nokia_xg-040g-md-ubi'
      upload_release: ${{ inputs.upload_release }}
      cache_mode: ${{ inputs.cache_mode }}
    secrets: inherit
