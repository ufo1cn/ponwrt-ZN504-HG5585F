name: PonWrt 固件发布（写入软仓索引与 Release）
# 配套 package/luci-app-ponwrt-update：把已编好的固件搬进 apk-repo 的 Release，
# 再写 meta/fw/<device>.json（字段与 app 读取的完全一致：tag / run /
# sysupgrade{name,sha256,url}）。app 用 run 与本机 /etc/ponwrt-version 的 run 比大小，
# 所以这里的 run 必须是【源固件构建 run】的编号，不是本工作流的编号。
run-name: 发布固件索引 ${{ inputs.devices }}${{ inputs.dry_run && '（dry-run）' || '' }}

on:
  workflow_dispatch:
    inputs:
      devices:
        description: 要发布的机型
        type: choice
        options:
          - all
          - ct+5382a
          - hg5585f-ct
          - hg5585f-ct-usb-sfp
          - zn504xg-d
          - hg5382a
          - xg040md
        default: all
      source_run:
        description: 源固件构建的 run id（留空=每个机型各取最近一次成功构建）
        type: string
        default: ''
      dry_run:
        description: 只校验产物、不建 Release 不写索引
        type: boolean
        default: false
      force_republish:
        description: 内容相同也强制发版（默认 false=镜像 sha256 没变就跳过）
        type: boolean
        default: false
      idx_branch:
        description: '写哪个索引分支（repo=主线五台 / 源 master+label all；repo-wed=WED 两台 HG5585F / 源 feat/wed-npu-offload-6.18+label wed）'
        type: choice
        options:
          - repo
          - repo-wed
        default: repo
      src_branch:
        description: '源固件分支（留空=按 idx_branch 自动：repo→master、repo-wed→feat/wed-npu-offload-6.18）。可在 master 上直接发布 wed 分支产物'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

# 与 pkg-publish、apk-repo 的 reindex 共用同一把写锁（按索引分支区分）：
# 三者都往同一个分支 commit，串行排队比各自 rebase 重试可靠。
concurrency:
  group: apk-repo-write-${{ inputs.idx_branch }}
  cancel-in-progress: false

env:
  SRC_REPO: ${{ github.repository }}
  DST_REPO: ufo1cn/ponwrt-apk-repo
  IDX_BRANCH: ${{ inputs.idx_branch }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 解析发布计划
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEL: ${{ inputs.devices }}
          SRC_RUN: ${{ inputs.source_run }}
          IDXB: ${{ inputs.idx_branch }}
          SRCF: ${{ inputs.src_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess, sys

          # 索引分支决定源分支、产物 label 与可发布机型：
          #   repo     -> master（五台，fw-all.yml label=all）
          #   repo-wed -> feat/wed-npu-offload-6.18（两台 HG5585F，fw-all.yml label=wed）
          MAP = {
              'fiberhome_hg5585f-ct': 'fw-all.yml',
              'fiberhome_hg5585f-ct-usb-sfp': 'fw-all.yml',
              'fiberhome_hg5382a': 'fw-all.yml',
              'nokia_xg-040g-md-ubi': 'fw-all.yml',
              'znxt_zn504xg-d': 'fw-all.yml',
          }
          IDX = (os.environ.get('IDXB') or 'repo').strip()
          SRC_OVERRIDE = (os.environ.get('SRCF') or '').strip()
          # 两个索引分支都能从 master 触发：源分支可用 src_branch 显式指定，
          # 不再要求「repo-wed 只能在 wed 分支上发」。
          if IDX == 'repo-wed':
              SRC_BRANCH = SRC_OVERRIDE or 'feat/wed-npu-offload-6.18'
              LABEL = 'wed'
              ONLY = ['fiberhome_hg5585f-ct', 'fiberhome_hg5585f-ct-usb-sfp']
          elif IDX == 'repo':
              SRC_BRANCH = SRC_OVERRIDE or 'master'
              LABEL = 'all'
              ONLY = []
          else:
              sys.exit('未知索引分支：%s' % IDX)

          SEL = os.environ['SEL']
          SRC = os.environ['SRC_REPO']
          SRC_RUN = os.environ.get('SRC_RUN', '').strip()

          if SEL == 'all':
              devices = ONLY or list(MAP)
          elif SEL == 'ct+5382a':
              devices = ['fiberhome_hg5585f-ct', 'fiberhome_hg5382a']
          elif SEL == 'hg5585f-ct':
              devices = ['fiberhome_hg5585f-ct']
          elif SEL == 'hg5585f-ct-usb-sfp':
              devices = ['fiberhome_hg5585f-ct-usb-sfp']
          elif SEL == 'hg5382a':
              devices = ['fiberhome_hg5382a']
          elif SEL == 'zn504xg-d':
              devices = ['znxt_zn504xg-d']
          elif SEL == 'xg040md':
              devices = ['nokia_xg-040g-md-ubi']
          else:
              sys.exit('未知机型选择：%s' % SEL)

          if ONLY:
              bad = [d for d in devices if d not in ONLY]
              if bad:
                  sys.exit('repo-wed 只收 WED 分支编出的 %s，%s 不在其中' % (' / '.join(ONLY), ','.join(bad)))

          QBRANCH = SRC_BRANCH.replace('/', '%2F')
          _arts = {}
          def has_label_artifact(rid, label, rnum):
              # 产物名 PonWrt-firmware-<label>-r<run_number>，用来判定这个 run 是否编出了该 label
              key = (rid, label, rnum)
              if key not in _arts:
                  try:
                      names = subprocess.check_output(
                          ['gh', 'api', 'repos/%s/actions/runs/%s/artifacts?per_page=100' % (SRC, rid),
                           '--jq', '.artifacts[].name'], text=True).split('\n')
                  except Exception:
                      names = []
                  want = 'PonWrt-firmware-%s-r%s' % (label, rnum)
                  _arts[key] = any(x.strip() == want for x in names)
              return _arts[key]
          rows = []
          for dev in devices:
              wf = MAP[dev]
              if SRC_RUN:
                  out = subprocess.check_output(
                      ['gh', 'api', 'repos/%s/actions/runs/%s' % (SRC, SRC_RUN),
                       '--jq',
                       '[.id,.run_number,.head_sha,.name,.conclusion,.created_at,.path,.head_branch]|@tsv'],
                      text=True).strip()
              else:
                  out = subprocess.check_output(
                      ['gh', 'api',
                       'repos/%s/actions/workflows/%s/runs?status=success&per_page=1&branch=%s'
                       % (SRC, wf, QBRANCH),
                       '--jq',
                       '.workflow_runs[0] | [.id,.run_number,.head_sha,.name,.conclusion,.created_at,.path,.head_branch]|@tsv'],
                      text=True).strip()
              if not out:
                  sys.exit('机型 %s 在 %s 上找不到可用的成功构建（%s）' % (dev, SRC_BRANCH, wf))
              rid, rnum, sha, name, concl, created, path, hb = out.split('\t')
              # 源 run 归属：分支自己编自己发，或 master 统一入口编出来的对应 label 产物
              if hb and hb != SRC_BRANCH:
                  if not has_label_artifact(rid, LABEL, rnum):
                      sys.exit('源 run %s 分支是 %s，且没有 label=%s 的产物，不能发到 %s'
                               % (rid, hb, LABEL, IDX))
                  print('    run %s 来自统一入口（head_branch=%s），按 label=%s 产物归属发布'
                        % (rid, hb, LABEL))
              if concl and concl != 'success':
                  sys.exit('源 run %s 结论是 %s，不是 success' % (rid, concl))
              # 指定 source_run 时可能是 manual 之类的入口，索引里要写实际入口文件名
              wf_used = path.rsplit('/', 1)[-1] if path.endswith('.yml') else wf
              rows.append((dev, wf_used, rid, rnum, sha, created))

          with open('plan.tsv', 'w', encoding='utf-8') as f:
              for r in rows:
                  f.write('\t'.join(r) + '\n')
              print('计划（索引分支 %s / 源分支 %s / label %s）：' % (IDX, SRC_BRANCH, LABEL))
              for r in rows:
                  print('  %-22s %-16s run#%-4s id=%s sha=%s at=%s' % (r[0], r[1], r[3], r[2], r[4][:10], r[5]))

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('devices=%s\n' % ','.join(r[0] for r in rows))
              f.write('label=%s\n' % LABEL)
          PY

      - name: 下载固件 Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 一次构建三机型：同一个 run 只下一次，三台共用这份 dl/run-<rid>
          declare -A got_rid
          while IFS=$'\t' read -r dev wf rid rnum sha created; do
            if [ -z "${got_rid[$rid]:-}" ]; then
              echo ">>> 下载 run #$rnum / $rid 的全部机型产物"
              mkdir -p "dl/run-$rid"
              gh run download "$rid" -R "$SRC_REPO" -D "dl/run-$rid"
              got_rid[$rid]=1
            fi
          done < plan.tsv
          du -sh dl/* | sed 's/^/    /'

      - name: 校验固件 Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force_republish }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, sys

          DEV_LABEL = {
              'fiberhome_hg5585f-ct': 'HG5585F-CT',
              'fiberhome_hg5585f-ct-usb-sfp': 'HG5585F-CT (USB-SFP)',
              'fiberhome_hg5382a': 'HG5382A',
              'nokia_xg-040g-md-ubi': 'XG-040G-MD',
              'znxt_zn504xg-d': 'ZN504XG-D',
          }

          def sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for b in iter(lambda: f.read(1 << 20), b''):
                      h.update(b)
              return h.hexdigest()

          def remote_sha(dev):
              # 读 apk-repo 里已发布的索引，返回 (sysupgrade.sha256, tag)；读不到就当没有索引
              try:
                  out = subprocess.check_output(
                      ['gh', 'api', 'repos/%s/contents/meta/fw/%s.json?ref=%s'
                       % (os.environ['DST_REPO'], dev, os.environ['IDX_BRANCH']),
                       '--jq', '.content'], text=True)
                  d = json.loads(base64.b64decode(out.strip()).decode('utf-8'))
                  return (d.get('sysupgrade') or {}).get('sha256'), d.get('tag', '')
              except Exception as e:
                  print('    读取现有索引失败，按“还没有索引”处理：%s' % e)
                  return None, ''

          plan = []
          for line in open('plan.tsv', encoding='utf-8'):
              dev, wf, rid, rnum, sha, created = line.rstrip('\n').split('\t')
              plan.append((dev, wf, rid, rnum, sha, created))

          prepared = []
          errors = []
          for dev, wf, rid, rnum, commit, created in plan:
              # 同一次 run 里可能同时有 label=all 与 label=wed 两份产物（master 上 targets=all 时），
              # 必须只取本次索引分支自己的那份，否则 wed 会误发主线镜像
              lbl = 'all' if os.environ.get('IDX_BRANCH', 'repo') == 'repo' else 'wed'
              root = os.path.join('dl', 'run-' + rid, 'PonWrt-firmware-%s-r%s' % (lbl, rnum))
              if not os.path.isdir(root):
                  root = os.path.join('dl', 'run-' + rid)
              itbs, infos = [], []
              for base, _, files in os.walk(root):
                  for fn in files:
                      p = os.path.join(base, fn)
                      # SFP 变体的机器名是 fiberhome_hg5585f-ct 的前缀扩展，必须排除
                      if fn.endswith('.itb') and 'sysupgrade' in fn and not fn.endswith('.itb.sha256'):
                          # 光口版与电口版共用前缀，必须按是否带 usb-sfp 区分
                          sfp_want = 'usb-sfp' in dev
                          if dev in fn and ('usb-sfp' in fn) == sfp_want:
                              itbs.append(p)
                      if fn == 'build-info.txt':
                          infos.append(p)
              if not itbs:
                  errors.append('%s：产物里没有 %s 的 sysupgrade .itb' % (dev, dev))
                  continue
              if len(itbs) > 1:
                  # 多份时取文件名最短（通常就是标准名），其余打印出来备查
                  itbs.sort(key=lambda p: (len(os.path.basename(p)), p))
              up = itbs[0]
              for extra in itbs[1:]:
                  print('    另外发现（未采用）：%s' % os.path.basename(extra))
              size = os.path.getsize(up)
              real = sha256(up)
              side = None
              if os.path.isfile(up + '.sha256'):
                  side = open(up + '.sha256', encoding='utf-8').read().split()[0].lower()
              if side and side != real:
                  errors.append('%s：.sha256 旁注（%s）与实际（%s）不一致' % (dev, side, real))
                  continue

              info = {}
              if infos:
                  for line in open(infos[0], encoding='utf-8'):
                      if '=' in line:
                          k, v = line.strip().split('=', 1)
                          info[k] = v
              else:
                  # 早期构建（例如 manual #5）产物里没有 build-info.txt。run 编号本来
                  # 就等于源 run 的 run_number（固件里的版本戳也是这个数），所以这里
                  # 用源 run 的 run_number/head_sha/created_at 回退，不跳过、不静默。
                  print('::warning::%s 产物里没有 build-info.txt，回退为源 run 元数据（run#%s sha=%s）'
                        % (dev, rnum, commit[:10]))
                  info = {'run': rnum, 'commit': commit, 'kernel_version': 'unknown',
                          'built_at': created}

              built_run = info.get('run', '').strip()
              if built_run != rnum:
                  errors.append('%s：build-info.txt 的 run=%s 与源 run#%s 不一致' % (dev, built_run, rnum))
                  continue

              outdir = os.path.join('prep', dev)
              os.makedirs(outdir, exist_ok=True)
              base = os.path.basename(up)
              dst = os.path.join(outdir, base)
              os.replace(up, dst)
              with open(dst + '.sha256', 'w', encoding='utf-8') as f:
                  f.write('%s  %s\n' % (real, base))
              man = None
              for base2, _, files in os.walk(root):
                  for fn in files:
                      if 'manifest' in fn and dev in fn and not fn.endswith('.sha256'):
                          man = os.path.join(base2, fn)
              if man:
                  os.replace(man, os.path.join(outdir, os.path.basename(man)))

              meta = {
                  'device': dev,
                  'label': DEV_LABEL.get(dev, dev),
                  'workflow': wf,
                  'source_run_id': int(rid),
                  'run': int(built_run),
                  'commit': info.get('commit') or commit,
                  'kernel_version': info.get('kernel_version', 'unknown'),
                  'built_at': info.get('built_at', ''),
                  'name': base,
                  'sha256': real,
                  'size': size,
                  'manifest': os.path.basename(man) if man else None,
                  'dir': outdir,
              }
              old_sha, old_tag = remote_sha(dev)
              unchanged = bool(old_sha) and old_sha == real and os.environ.get('FORCE', 'false') != 'true'
              meta['unchanged'] = unchanged
              if unchanged:
                  print('>>> %s：镜像 sha256 与已发布索引（%s）相同，本次不更新版本' % (dev, old_tag))
              with open(os.path.join(outdir, 'index-meta.json'), 'w', encoding='utf-8') as f:
                  json.dump(meta, f, ensure_ascii=False, indent=2)
              prepared.append(meta)
              print('>>> %s  %s  %.2f MiB  sha256=%s  run=%s' % (
                  dev, base, size / 1048576.0, real[:16], built_run))

          if errors:
              for e in errors:
                  print('::error::%s' % e)
              sys.exit(1)
          if not prepared:
              sys.exit('::error::没有任何可发布的固件')
          with open('prepared.json', 'w', encoding='utf-8') as f:
              json.dump(prepared, f, ensure_ascii=False, indent=2)
          PY

      - name: 在软仓发布 Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::缺少 APK_REPO_TOKEN，无法在 apk-repo 建 Release"
            exit 1
          fi
          python3 - <<'PY' > rels.tsv
          import json, os, sys
          for m in json.load(open('prepared.json', encoding='utf-8')):
              if m.get('unchanged'):
                  print('>>> 跳过 %s：镜像内容与已发布版本相同，不新建 Release' % m['device'], file=sys.stderr)
                  continue
              tag = 'fw-%s%s-r%s-%s' % (m['device'], '' if os.environ.get('IDX_BRANCH', 'repo') == 'repo' else '-' + os.environ['IDX_BRANCH'].replace('repo-', ''), m['run'], m['commit'][:7])
              print('\t'.join([m['device'], tag, m['name'], m['dir']]))
          PY
          if [ ! -s rels.tsv ]; then
            echo ">>> 本次没有需要发版的机型（全部内容未变）"
          fi
          while IFS=$'\t' read -r dev tag name dir; do
            echo ">>> 上传 $dev -> $tag"
            files=("$dir/$name" "$dir/$name.sha256")
            man=$(python3 -c "import json;m=[x for x in json.load(open('prepared.json',encoding='utf-8')) if x['device']=='$dev'][0];print(m['manifest'] or '')")
            [ -n "$man" ] && files+=("$dir/$man")
            notes="PonWrt 固件 $dev
          源构建 run：$tag
          镜像：$name
          sha256 见同名 .sha256 附件；索引由 meta/fw/$dev.json 指向本 Release。"
            gh release create "$tag" -R "$DST_REPO" --title "$dev $tag" --notes "$notes" "${files[@]}" \
              || gh release upload "$tag" -R "$DST_REPO" --clobber "${files[@]}"
          done < rels.tsv

      - name: 更新软仓固件索引
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
        run: |
          set -uo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::缺少 APK_REPO_TOKEN"; exit 1; }
          rm -rf idx
          git clone --depth=1 --branch "$IDX_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${DST_REPO}.git" idx \
            || { echo "::error::apk-repo 的 $IDX_BRANCH 分支取不到"; exit 1; }
          python3 - "$DST_REPO" <<'PY'
          import json, os, sys
          dst = sys.argv[1]
          idxdir = os.path.join('idx', 'meta', 'fw')
          os.makedirs(idxdir, exist_ok=True)
          for m in json.load(open('prepared.json', encoding='utf-8')):
              if m.get('unchanged'):
                  print('索引保留（内容未变）->', m['device'])
                  continue
              tag = 'fw-%s%s-r%s-%s' % (m['device'], '' if os.environ.get('IDX_BRANCH', 'repo') == 'repo' else '-' + os.environ['IDX_BRANCH'].replace('repo-', ''), m['run'], m['commit'][:7])
              url = 'https://github.com/%s/releases/download/%s/%s' % (dst, tag, m['name'])
              d = {
                  'schema': 1,
                  'device': m['device'],
                  'tag': tag,
                  # app 用这个 run 与本机版本戳里的 run 比较，必须写源构建的 run
                  'run': m['run'],
                  'source_run_id': m['source_run_id'],
                  'source_workflow': m['workflow'],
                  'commit': m['commit'],
                  'kernel_version': m['kernel_version'],
                  'built_at': m['built_at'],
                  'sysupgrade': {
                      'name': m['name'],
                      'sha256': m['sha256'],
                      'size': m['size'],
                      'url': url,
                  },
              }
              if m.get('manifest'):
                  d['manifest'] = {
                      'name': m['manifest'],
                      'url': 'https://github.com/%s/releases/download/%s/%s' % (dst, tag, m['manifest']),
                  }
              p = os.path.join(idxdir, m['device'] + '.json')
              with open(p, 'w', encoding='utf-8') as f:
                  f.write(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
              print('index ->', p)
              print('  tag=%s run=%s' % (tag, m['run']))
          PY
          git -C idx add -A
          devs=$(ls prep | paste -sd, -)
          git -C idx -c user.email=ci@ponwrt -c user.name=ponwrt-ci \
            commit -m "meta(fw): $(date -u +%Y-%m-%dT%H:%MZ) devices=$devs" || true
          for i in 1 2 3; do
            if git -C idx push origin "$IDX_BRANCH"; then
              echo ">>> 索引已推送：meta/fw/"
              break
            fi
            git -C idx fetch origin "$IDX_BRANCH" && git -C idx rebase "origin/$IDX_BRANCH" || true
            [ "$i" = 3 ] && { echo "::error::索引推送三次都失败"; exit 1; }
          done

      # 保留策略：apk-repo 里每机型每线只留最新 2 个固件 Release；
      # 固件仓里 kmods-<label>/v<时间戳>-<label> 各只留最新 1 个。
      # 只按本仓自己的命名族回删，绝不碰 meta 指向的最新版；dry-run 不删。
      - name: 清理过期 Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
          DST_REPO: ufo1cn/ponwrt-apk-repo
          SRC_REPO: ${{ github.repository }}
          KEEP_PER_DEVICE: '2'
        run: |
          set -euo pipefail
          prune_repo() {
            repo="$1"; kind="$2"
            gh api --paginate "repos/$repo/releases?per_page=100" \
              --jq '[.[] | {id,tag_name,created_at}] | sort_by(.created_at) | reverse' > "rels-$kind.json"
            KIND="$kind" REPO="$repo" python3 - <<'PY'
          import json, os, re, subprocess
          kind = os.environ['KIND']; repo = os.environ['REPO']
          keep_dev = int(os.environ.get('KEEP_PER_DEVICE', '2'))
          rels = json.load(open('rels-%s.json' % kind, encoding='utf-8'))
          def family(tag):
              if kind == 'fw':
                  m = re.match(r'^fw-(.+?)(-wed)?-r\d+-[0-9a-f]{7}$', tag)
                  if m: return ('fw', m.group(1) + (m.group(2) or ''))
              else:
                  m = re.match(r'^(kmods-[a-z]+)-r\d+$', tag)
                  if m: return ('kmods', m.group(1))
                  m = re.match(r'^v[0-9][0-9a-z.\-]*-(all|wed)-r\d+$', tag)
                  if m: return ('fwrel', m.group(1))
              return None
          seen, dele = {}, []
          for r in rels:
              f = family(r['tag_name'])
              if not f: continue
              seen[f] = seen.get(f, 0) + 1
              limit = 1 if kind != 'fw' else keep_dev
              if seen[f] > limit:
                  dele.append(r)
          for r in dele:
              print('prune %s %s' % (repo, r['tag_name']))
              subprocess.run(['gh','api','-X','DELETE','repos/%s/releases/%s' % (repo, r['id'])], check=False)
              subprocess.run(['gh','api','-X','DELETE','repos/%s/git/refs/tags/%s' % (repo, r['tag_name'])], check=False)
          print('pruned %d in %s' % (len(dele), repo))
          PY
          }
          prune_repo "$DST_REPO" fw
          prune_repo "$SRC_REPO" other

      - name: 汇总
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## 固件索引发布结果"
            echo
            echo "| 机型 | 源 run | tag | 镜像 | 大小 | 状态 | dry-run |"
            echo "|---|---|---|---|---|---|---|"
            python3 - <<'PY'
          import json, os
          if os.path.isfile('prepared.json'):
              for m in json.load(open('prepared.json', encoding='utf-8')):
                  tag = 'fw-%s%s-r%s-%s' % (m['device'], '' if os.environ.get('IDX_BRANCH', 'repo') == 'repo' else '-' + os.environ['IDX_BRANCH'].replace('repo-', ''), m['run'], m['commit'][:7])
                  print('| %s | %s | %s | %s | %.2f MiB | %s | %s |' % (
                      m['label'], m['run'], tag, m['name'], m['size'] / 1048576.0,
                      '内容未变，跳过' if m.get('unchanged') else '已更新',
                      os.environ.get('DRY', '?')))
          PY
            echo
            echo "索引分支：${IDX_BRANCH}（label ${{ steps.plan.outputs.label }}）"
            echo "索引下载地址：https://raw.githubusercontent.com/${DST_REPO}/${IDX_BRANCH}/meta/fw/<device>.json"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DRY: ${{ inputs.dry_run }}
