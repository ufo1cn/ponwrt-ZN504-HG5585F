name: PonWrt firmware build (reusable)

# ==============================================================================
# 本文件基于上游 .github/workflows/build-zn504.yml 修改而来（步骤顺序、依赖列表、
# 缓存策略、产物组织与发布方式全部沿用上游），只做以下必要改动：
#
#   1) 触发方式：删除 push 自动触发，只保留 workflow_dispatch（手动运行），
#      新增 devices 输入用于选择机型；
#   2) 配置：只合并上游 configs/an7581.config + configs/release.config。
#      configs/pon-packages/*.config 仅供 build-packages-incremental.yml 使用，
#      固件不再选装自有包（内核能力由 config-6.18 的内置符号提供）；
#   3) 机型：defconfig 之后锁定 HG5585F-CT / HG5382A，其它机型关闭
#      （defconfig 会重算设备列表，因此机型锁定必须放在 defconfig 之后，且之后
#       不再执行 defconfig）；
#   4) 产物：上游 find 只匹配 zn504 / hg5585f-ct / hg5585f-cu，HG5382A 会被名字
#      过滤静默丢弃；这里加上 *hg5382a* 并对目标机型做存在性硬校验；
#   5) kmod 归属：所有 kmod 都在这里编。【统一内核】能力片段 + kmod-repo.config 里
#      出现的每个 kmod 符号，无论本机型有无该硬件，都会在本机型内核里编出来（=m），
#      因此三台机型的内核指纹一致、kmod 只有一份；机型能力只决定"装不装进 rootfs"
#      （=y：usb 机 bake_usb=true、usb-wifi 的内置无线），=m 的 .ko 只进 apk 仓库。iptv 的 kmod 与其上层 luci-app-iptv /
#      i18n 成对在此编译（树外 feed，feeds update 前注入），保证版本与 ABI 一致。
#      产物收集到 kmods/ 并发布 kmods-<label>-r<run> 预发布，由 pkg-publish.yml
#      搬进软件仓库；三条 build-packages-* 流程只编用户态包。
#   6) 未改动：customize.sh、包源码下载、编译命令、ccache 存取、
#      产物 sha256、Artifact 上传、Release 发布流程。
# ==============================================================================

on:
  workflow_call:
    inputs:
      label:
        description: '机型类别（写进 artifact 名 / release 标题，如 usb-wifi / usb / plain）'
        required: true
        type: string
      device_list:
        description: '要编的 board 列表（空格分隔，如 "fiberhome_hg5382a"）'
        required: true
        type: string
      upload_release:
        description: '上传 GitHub Release'
        required: false
        default: true
        type: boolean
      cache_mode:
        description: '编译缓存模式（使用缓存 / 重新编译 / 不使用缓存）'
        required: false
        default: '使用缓存'
        type: string
      bake_usb:
        description: 'USB 驱动是否装进 rootfs（插上即用）：true = usb 片段的 kmod 改成 =y 预装进镜像；false = 只出 apk，设备上按需装。注意：两种取值下 USB 驱动都会编进本机内核（统一指纹），差别只在镜像里装不装 .ko'
        required: false
        default: false
        type: boolean
      apk_repo_branch:
        description: 'apk 仓库索引分支（repo=主线；实验分支指向独立分支，如 repo-wed）'
        required: false
        default: 'repo'
        type: string

concurrency:
  # 按机型类别隔离：usb-wifi / usb / plain 三条互不打断；只有同类别重复运行才取消
  group: ponwrt-fw-${{ inputs.label }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_MAXSIZE: 5G
  # 机型列表统一在这里注入：后面「Organize output files / Verify requested firmware
  # exists / Publish firmware update index」三段都读 $DEVICE_LIST。之前缺这个定义，
  # 前两段在 for 循环里遇到空值只是空转（不报错），导致 output/ 一个 itb 都没收集、
  # 索引段则在 set -u 下直接 unbound variable 失败。定义放 job env 是唯一安全位置。
  DEVICE_LIST: ${{ inputs.device_list }}

jobs:
  build:
    name: Build ${{ inputs.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load per-device definitions (configs/devices/*.config)
        run: |
          set -euo pipefail
          # 机型定义唯一事实来源：configs/devices/<board>.config
          #   DEVICE_CAPS        能力（usb / wifi / bt；只决定“装什么进镜像”）
          #   DEVICE_PREINSTALL  预装进该机型 rootfs 的包清单（旧 bake_usb 的效果）
          # 工作流把这份清单写进对应机型的 Device 定义（DEVICE_PACKAGES），
          # 不用全局 .config 的 =y —— 全局 =y 会把包塞进每一台镜像。
          DEVICES="${{ inputs.device_list }}"
          [ -n "${DEVICES// /}" ] || { echo "::error::device_list 为空"; exit 1; }
          : > /tmp/dev-pre.tsv
          : > /tmp/dev-caps.tsv
          caps_all=""
          for dev in $DEVICES; do
            f="configs/devices/${dev}.config"
            [ -f "$f" ] || { echo "::error::缺机型定义文件 $f"; exit 1; }
            caps=$(sed -n 's/^DEVICE_CAPS=//p' "$f" | head -n1)
            pre=$(sed -n 's/^DEVICE_PREINSTALL=//p' "$f" | head -n1)
            printf '%s\t%s\n' "$dev" "${pre:-}" >> /tmp/dev-pre.tsv
            printf '%s\t%s\n' "$dev" "${caps:-}" >> /tmp/dev-caps.tsv
            echo ">>> $dev 能力：${caps:-（无）}；预装包 $(echo ${pre:-} | wc -w) 个"
            for c in $caps; do
              case " $caps_all " in *" $c "*) ;; *) caps_all="$caps_all $c" ;; esac
            done
          done
          echo "CAPS=$caps_all" >> "$GITHUB_ENV"
          echo "N_DEV=$(echo $DEVICES | wc -w)" >> "$GITHUB_ENV"
          # 注入进 target/linux/airoha/image/an7581.mk 的 Device 定义，
          # 行的末尾带标记，重复运行不会叠加。
          python3 - /tmp/dev-pre.tsv target/linux/airoha/image/an7581.mk <<'PY'
          import sys
          tsv, mk = sys.argv[1], sys.argv[2]
          rows = [l.rstrip('\n').split('\t') for l in open(tsv, encoding='utf-8') if l.strip()]
          lines = open(mk, encoding='utf-8').read().splitlines()
          for board, pkgs in rows:
              # 空清单也要先把旧标记删掉，避免和上一版残留叠在一起
              lines = [l for l in lines if 'ponwrt-preinstall:' + board not in l]
              if not pkgs.strip():
                  print('>>> %s 无预装包，跳过注入（并清掉旧标记）' % board)
                  continue
              start = None
              for i, l in enumerate(lines):
                  if l.strip() == 'define Device/' + board:
                      start = i
                      break
              if start is None:
                  sys.exit('::error::an7581.mk 里找不到 define Device/%s' % board)
              end = None
              for j in range(start + 1, len(lines)):
                  if lines[j].strip() == 'endef':
                      end = j
                      break
              if end is None:
                  sys.exit('::error::Device/%s 的 define 块没有 endef' % board)
              start = None
              for i, l in enumerate(lines):
                  if l.strip() == 'define Device/' + board:
                      start = i
                      break
              for j in range(start + 1, len(lines)):
                  if lines[j].strip() == 'endef':
                      end = j
                      break
              lines.insert(end, '  DEVICE_PACKAGES += %s # ponwrt-preinstall:%s' % (' '.join(pkgs.split()), board))
              print('>>> 注入 Device/%s：%d 个预装包' % (board, len(pkgs.split())))
          open(mk, 'w', encoding='utf-8', newline='\n').write('\n'.join(lines) + '\n')
          PY
          # 逐机型核对：有预装清单的必须有标记行，清单为空的必须没有标记行
          while IFS=$'\t' read -r dev pre; do
            [ -n "$dev" ] || continue
            if [ -n "${pre// /}" ]; then
              grep -q "ponwrt-preinstall:${dev}" target/linux/airoha/image/an7581.mk \
                || { echo "::error::Device/${dev} 的预装包没有落进 an7581.mk"; exit 1; }
            else
              if grep -q "ponwrt-preinstall:${dev}" target/linux/airoha/image/an7581.mk; then
                echo "::error::Device/${dev} 预装清单为空，但 an7581.mk 里还留着标记行"; exit 1
              fi
              echo ">>> ${dev} 预装清单为空：an7581.mk 无注入，符合定义"
            fi
          done < /tmp/dev-pre.tsv
          echo ">>> 机型定义加载完成"


      - name: Install fixed apk signing key
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          # 固定密钥是硬前置：没有它编出来的包设备验不过，也没有第二把钥匙可用。
          if [ -z "${APK_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::仓库未配置 APK_SIGNING_PRIVATE_KEY（全仓库固定同一把私钥），本次构建不能继续"
            exit 1
          fi
          # rules.mk: BUILD_KEY_APK_SEC=$(TOPDIR)/private-key.pem / BUILD_KEY_APK_PUB=$(TOPDIR)/public-key.pem
          # 全仓库固定同一把密钥，设备只需装一次 /etc/apk/keys/public-key.pem
          printf '%s\n' "$APK_SIGNING_PRIVATE_KEY" > private-key.pem
          chmod 600 private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem
          # 当场断言指纹：一致才继续，避免编完一小时才在镜像自检里发现密钥不对
          want=d557dca1a8b8d30b48f7e4b910908342789d389a52db3d7225c6b72840eda4ed
          got=$(sha256sum public-key.pem | cut -d' ' -f1)
          echo ">>> 签名公钥指纹：$got"
          if [ "$got" != "$want" ]; then
            echo "::error::APK_SIGNING_PRIVATE_KEY 派生公钥指纹 $got 与固定密钥 $want 不一致"
            exit 1
          fi


      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full pahole patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      # 内核树缓存（build_dir 里的 host/toolchain/linux）。
      #
      #  为什么要单独缓存这三段：toolchain(~10min) + 内核(~20min) 占了整个固件
      #  构建的大头，而它们与"选装哪些用户态包"无关。命中后 make 只做依赖检查
      #  与 install，直接从 30min 掉到 3-5min。
      #
      #  为什么不缓存 staging_dir/target-* 与 bin/：那两层带 package 的 stamp。
      #  只恢复 stamp 不恢复同名 apk，make 会认为已编好而跳过，Collect 就收不到
      #  包 —— 这属于静默丢包，绝不能靠缓存加速把它引进来。
      #  三个 label 各自精确 key，restore 时依次回退，最后一条 ponwrt-fwtree-
      #  允许 usb / usb-wifi / plain 互相借用（内核差异部分 make 会自动重编）。
      - name: Restore kernel/toolchain build tree
        if: inputs.cache_mode != '不使用缓存'
        uses: actions/cache/restore@v4
        with:
          path: |
            build_dir/host
            build_dir/toolchain-*
            build_dir/target-*/linux-*
            staging_dir/host
            staging_dir/toolchain-*
          key: ponwrt-fwtree-${{ hashFiles('configs/an7581.config', 'configs/release.config', 'configs/features/*.config', 'target/linux/airoha/an7581/config-6.18', 'target/linux/generic/config-6.18', 'feeds.conf.default', 'target/linux/airoha/image/an7581.mk') }}-${{ github.sha }}
          restore-keys: |
            ponwrt-fwtree-${{ hashFiles('configs/an7581.config', 'configs/release.config', 'configs/features/*.config', 'target/linux/airoha/an7581/config-6.18', 'target/linux/generic/config-6.18', 'feeds.conf.default', 'target/linux/airoha/image/an7581.mk') }}-
            ponwrt-fwtree-
            ponwrt-fwtree-

      # dl（源码包）缓存：actions/cache@v4 的 post 保存只在 job 成功时执行，
      # 固件这一步经常红 → dl 从来没落盘。这里只做 restore，保存放在 job 末尾单独做。
      - name: Restore downloads cache
        if: inputs.cache_mode != '不使用缓存'
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: ponwrt-dl-zn504-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-zn504-

      - name: Add external feeds (树外 kmod-iptv 来源)
        run: |
          # kmod-iptv / luci-app-iptv 来自第三方 feed；固件流程必须带上它，
          # 才能把 kmod-iptv 和固件内核一起编（vermagic 才一致）。
          if ! grep -q 'src-git iptv ' feeds.conf.default; then
            printf 'src-git iptv https://github.com/yveming/openwrt-iptv.git\n' >> feeds.conf.default
          fi
          grep 'src-git iptv ' feeds.conf.default

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare custom packages
        run: |
          bash ./scripts/customize.sh

      - name: Restore compiler ccache
        if: inputs.cache_mode != '不使用缓存'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ponwrt-ccache-zn504-${{ hashFiles('configs/*.config') }}-${{ github.sha }}
          restore-keys: |
            ponwrt-ccache-zn504-${{ hashFiles('configs/*.config') }}-
            ponwrt-ccache-zn504-
            ponwrt-ccache-zn504-

      - name: Configure for the requested device(s)
        run: |
          # 上游两份配置 + 本仓库上层应用清单
          ./scripts/kconfig.pl + \
            configs/an7581.config \
            configs/release.config > .config

          sed -i '/^CONFIG_KERNEL_DEBUG_INFO_REDUCED=/d' .config
          printf 'CONFIG_KERNEL_DEBUG_INFO=y\n# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set\nCONFIG_KERNEL_DEBUG_INFO_BTF=y\nCONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y\nCONFIG_KERNEL_MODULE_ALLOW_BTF_MISMATCH=y\nCONFIG_KERNEL_KPROBES=y\nCONFIG_KERNEL_BPF_EVENTS=y\n' >> .config
          if [ "${{ inputs.cache_mode }}" != "不使用缓存" ]; then
            sed -i '/^CONFIG_DEVEL=/d; /^CONFIG_CCACHE=/d' .config
            printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
          fi

          # ------------------------------------------------------------------
          # 机型能力 -> 配置片段（configs/features/<能力>.config）
          #
          #   能力表 = configs/devices/<board>.config（DEVICE_CAPS / DEVICE_PREINSTALL）。
          #   【顺序很重要】片段必须在 make defconfig 之前写进 .config：
          #   defconfig 是唯一一次让 kconfig 解析 DEPENDS 的机会，隐藏包
          #   （HIDDEN:=1）、条件包（@USE_XXX）以及 +kmod-* 提供者只有在这一步
          #   才会被真正选中并归属到某个包。片段放在 defconfig 之后写，符号会
          #   被 kconfig 判为“依赖不满足”而丢弃，模块仍被内核 KCONFIG 编出来，
          #   但没有包拥有它 → 打包阶段报 missing dependencies（kmod-bluetooth
          #   缺 rfkill.ko 就是这么来的）。
          # ------------------------------------------------------------------
          DEVICES="${{ inputs.device_list }}"
          [ -n "${DEVICES// /}" ] || { echo "::error::device_list 为空"; exit 1; }
          # 能力来自 configs/devices/<board>.config（上一步已解析，多机型取并集）
          CAPS="${CAPS:-}"
          echo ">>> 机型 $DEVICES 能力：${CAPS:-（无：只编公共部件）}"
          has_cap() { case " $CAPS " in *" $1 "*) return 0 ;; *) return 1 ;; esac ; }

          APPLY_CAPS="$CAPS"
          case " $CAPS " in
            *" wifi "*) ;;
            *) APPLY_CAPS="$APPLY_CAPS no-wifi"
               echo ">>> 本机型没有内置无线：追加 no-wifi 片段（关掉 release.config 的 mt7915e/mt7916）" ;;
          esac

          n_frag=0
          for c in $APPLY_CAPS; do
            f="configs/features/${c}.config"
            if [ ! -f "$f" ]; then
              echo "::warning::能力 ${c} 没有对应片段 $f，跳过"
              continue
            fi
            echo ">>> 应用能力片段: $f"
            while IFS= read -r line; do
              # 通用 CONFIG_ 符号（不限于 CONFIG_PACKAGE_）：busybox 选项
              # （CONFIG_BUSYBOX_CONFIG_*）也必须能落到 .config，否则会被静默丢弃
              case "$line" in
                '# CONFIG_'*' is not set')
                  sym=${line#\# }; sym=${sym%% is not set*}; val="notset" ;;
                'CONFIG_'*=*)
                  sym=${line%%=*}; val=${line#*=} ;;
                *) continue ;;
              esac
              # kmod 的“装不装进镜像”改由 configs/devices/<board>.config 的
              # DEVICE_PREINSTALL 决定（写进 Device 定义），这里只落地非 kmod 的 =y
              # （block-mount、busybox 选项等）；所有 kmod 一律走后面的统一 =m。
              if [ "$val" = "y" ]; then
                case "$sym" in
                  CONFIG_PACKAGE_kmod-*) continue ;;
                esac
                # 多机型：任何 CONFIG_PACKAGE_*=y 都会进每一台镜像，所以一律不写全局，
                # 交给 configs/devices/<board>.config 的 DEVICE_PREINSTALL 按机型装。
                # 只保留非包符号（如 CONFIG_BUSYBOX_CONFIG_*）——那些是内核/基础工具选项。
                if [ "${N_DEV:-1}" -gt 1 ]; then
                  case "$sym" in
                    CONFIG_PACKAGE_*) continue ;;
                  esac
                fi
              fi
              sed -i "/^${sym}=/d; /^# ${sym} is not set/d" .config
              if [ "$val" = "notset" ]; then
                printf '# %s is not set\n' "$sym" >> .config
              else
                printf '%s=%s\n' "$sym" "$val" >> .config
              fi
              n_frag=$((n_frag+1))
            done < "$f"
          done
          echo ">>> 能力片段共应用 $n_frag 个符号（defconfig 前写入）"

          # ------------------------------------------------------------------
          # 仓库专用 kmod 片段：这些 kmod 编成 apk 进软件仓库，不进镜像（=m）。
          # 同样在 defconfig 之前写入，让 kconfig 把它们的依赖（含隐藏提供者）
          # 一并解析；已按 =y 烘进镜像的符号不再降级成 =m。
          # 对应清单：configs/features/kmod-repo.config
          # ------------------------------------------------------------------
          REPO_FRAG="configs/features/kmod-repo.config"
          if [ -f "$REPO_FRAG" ]; then
            n_repo=0
            n_repo_skip=0
            while IFS= read -r line; do
              case "$line" in
                '# CONFIG_'*' is not set')
                  sym=${line#\# }; sym=${sym%% is not set*}; val="notset" ;;
                'CONFIG_'*=*)
                  sym=${line%%=*}; val=${line#*=} ;;
                *) continue ;;
              esac
              if grep -q "^${sym}=y$" .config; then
                echo ">>> ${sym} 已烘进镜像（=y），跳过 apk 片段"
                n_repo_skip=$((n_repo_skip+1))
                continue
              fi
              sed -i "/^${sym}=/d; /^# ${sym} is not set/d" .config
              if [ "$val" = "notset" ]; then
                printf '# %s is not set\n' "$sym" >> .config
              else
                printf '%s=%s\n' "$sym" "$val" >> .config
              fi
              n_repo=$((n_repo+1))
            done < "$REPO_FRAG"
            echo ">>> kmod 仓库片段应用 $n_repo 个符号（=m：只编 apk，不进镜像），${n_repo_skip:-0} 个已烘进镜像跳过"
          fi

          # ------------------------------------------------------------------
          # 【统一内核】能力片段与 kmod 仓库清单里出现的所有 kmod，无论本机型有没有
          # 这项硬件，都要在这一台的内核里编出来（=m）；机型能力只决定“装不装进 rootfs”。
          #
          # 依据：内核 .config 的差异来自“符号有没有被选中”，而不是“包写成 y 还是 m”。
          # 只要符号被选中，三台机型编出的 vmlinux 与 vermagic 就一致；而 =m 的 .ko
          # 只进 apk 仓库、不进镜像，所以硬件更少的那台既不加体积，也不会 probe——
          # DTS 里 usb/pcie 默认 disabled，没有 platform/pci 设备，驱动 init 不做事。
          # 收益：一个内核指纹、一份 kmod 集，装到任何一台都不会被 apk 的兼容校验拒。
          #
          # 只把“未选中/未设置”的符号升成 =m，绝不把已有 =y 降级（否则会把 usb-wifi
          # 的内置无线驱动从镜像里拿掉）。=y 的升级仍由片段与 bake_usb 决定。
          # ------------------------------------------------------------------
          UNION_TMP=$(mktemp)
          for f in configs/features/*.config; do
            grep -E '^CONFIG_PACKAGE_kmod-[A-Za-z0-9_.+-]+=' "$f" 2>/dev/null \
              | sed -E 's/=.*//' >> "$UNION_TMP" || true
          done
          sort -u "$UNION_TMP" -o "$UNION_TMP"
          n_union=0; n_keep=0
          while IFS= read -r sym; do
            [ -n "$sym" ] || continue
            if grep -q "^${sym}=y$" .config; then
              n_keep=$((n_keep+1)); continue
            fi
            if grep -q "^${sym}=m$" .config; then
              n_keep=$((n_keep+1)); continue
            fi
            sed -i "/^${sym}=/d; /^# ${sym} is not set/d" .config
            printf '%s=m\n' "$sym" >> .config
            n_union=$((n_union+1))
          done < "$UNION_TMP"
          echo ">>> 统一内核：清单内 $(wc -l < "$UNION_TMP") 个 kmod 全机型编出，$n_union 个新升为 =m，$n_keep 个已选中"
          cp -f "$UNION_TMP" /tmp/universal-kmods.txt
          echo "UNIVERSAL_KMODS=$(wc -l < "$UNION_TMP")" >> "$GITHUB_ENV"
          rm -f "$UNION_TMP"

          # kmod-rfkill 的 DEPENDS 是 @USE_RFKILL（config/Config-kernel.in 里定义，
          # 默认值取 RFKILL_SUPPORT）；airoha 目标默认没开，导致 kmod-rfkill 永远不可选，
          # 而机型预装清单里又写了 kmod-rfkill → 镜像 apk add 时报 no such package。
          # 这里在 defconfig 前显式打开，让 kconfig 把它落成 =m。
          sed -i '/^# CONFIG_USE_RFKILL is not set/d; /^CONFIG_USE_RFKILL=/d' .config
          printf 'CONFIG_USE_RFKILL=y\n' >> .config
          echo ">>> 已写入 CONFIG_USE_RFKILL=y（给 kmod-rfkill 解 @USE_RFKILL）"

          # kconfig 解析：只此一次，之后不再 defconfig
          make defconfig

          # ------------------------------------------------------------------
          # 机型锁定（defconfig 之后）：an7581.config 默认选中多个机型，
          # 这里清空全部 CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_* 再只写本次机型，
          # 避免多 profile 重复建 rootfs，同时保证 HG5382A 一定在列。
          # ------------------------------------------------------------------
          echo ">>> 目标机型: $DEVICES"
          sed -i '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          sed -i '/^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.* is not set/d' .config
          for d in $DEVICES; do
            printf 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_%s=y\n' "$d" >> .config
          done
          for d in $DEVICES; do
            grep -q "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${d}=y" .config \
              || { echo "::error::机型符号未落地: CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${d}=y"; exit 1; }
          done
          echo ">>> 机型锁定完成（之后不再 defconfig）"

          # ------------------------------------------------------------------
          # 统一内核落地核对：清单里的 kmod 必须被 kconfig 选中（=y 或 =m）。
          # 依赖确实不满足、被清回 not set 的逐个列出（kconfig 不可选符号不算失败），
          # 用来保证三台机型的内核符号集一致。
          # ------------------------------------------------------------------
          if [ -f /tmp/universal-kmods.txt ]; then
            um_missing=""
            while IFS= read -r s; do
              [ -n "$s" ] || continue
              grep -qE "^${s}=[ym]$" .config || um_missing="$um_missing $s"
            done < /tmp/universal-kmods.txt
            if [ -n "$um_missing" ]; then
              echo "::warning::统一内核清单里这些符号未被选中（依赖不满足，三机型内核可能不一致）:$um_missing"
            else
              echo ">>> 统一内核落地：$(wc -l < /tmp/universal-kmods.txt) 个 kmod 符号全部被选中"
            fi
          fi

          # ------------------------------------------------------------------
          # btrfs：只出 apk、不进镜像（体积考虑）。
          # 实测（run 45366722990）：
          #   只写 CONFIG_PACKAGE_kmod-fs-btrfs=m  → kconfig 清回 not set（generic config-6.18 里
          #     CONFIG_BTRFS_FS 是 not set，包拿不到内核符号就不成立）；
          #   再写 CONFIG_KERNEL_BTRFS_FS=m        → 包被默认成 =y（连带 8 个依赖 kmod 也 =y 烘进镜像）。
          # 因此 defconfig 之后强制把它们全部回写成 =m：内核仍编 btrfs.ko（进 apk），
          # 但包和依赖都不安装进 rootfs。此处位于"不再 defconfig"之后，写值会被构建直接采用。
          # ------------------------------------------------------------------
          for s in CONFIG_KERNEL_BTRFS_FS \
                   CONFIG_PACKAGE_kmod-fs-btrfs \
                   CONFIG_PACKAGE_kmod-lib-lzo \
                   CONFIG_PACKAGE_kmod-lib-zlib-inflate \
                   CONFIG_PACKAGE_kmod-lib-zlib-deflate \
                   CONFIG_PACKAGE_kmod-lib-raid6 \
                   CONFIG_PACKAGE_kmod-lib-xor \
                   CONFIG_PACKAGE_kmod-lib-zstd \
                   CONFIG_PACKAGE_kmod-lib-xxhash \
                   CONFIG_PACKAGE_kmod-crypto-blake2b \
                   CONFIG_PACKAGE_kmod-crypto-xxhash; do
            sed -i "/^${s}=/d; /^# ${s} is not set/d" .config
            printf '%s=m\n' "$s" >> .config
          done
          echo ">>> btrfs 归位：kmod-fs-btrfs 及依赖一律 =m（只出 apk，不进镜像）"

          # ------------------------------------------------------------------
          # 预装清单已改为 per-device：configs/devices/<board>.config 的
          # DEVICE_PREINSTALL 会被写进该机型的 Device 定义（DEVICE_PACKAGES += …），
          # 由镜像装配阶段按机型安装，不再靠全局 .config 的 =y。
          # bake_usb 输入因此废弃（保留输入只为老 dispatch 不报错）。
          # ------------------------------------------------------------------
          if [ "${{ inputs.bake_usb }}" = "true" ]; then
            echo "::warning::bake_usb 已废弃并被忽略：预装清单现在由 configs/devices/${DEVICES%% *}.config 的 DEVICE_PREINSTALL 决定"
          fi
          bake_invisible=""
          if false; then
            echo ">>> bake_usb=true：USB 驱动按 =y 烘焙进镜像"
            for s in $(grep -E '^CONFIG_PACKAGE_' configs/features/usb.config | cut -d= -f1); do
              if grep -qE "^(# )?${s}(=| is not set)" .config; then
                sed -i "/^${s}=/d; /^# ${s} is not set/d" .config
                printf '%s=y\n' "$s" >> .config
              else
                bake_invisible="$bake_invisible ${s}"
              fi
            done
            for s in $(grep -E '^CONFIG_PACKAGE_' configs/features/usb.config | cut -d= -f1); do
              case " $bake_invisible " in *" $s "*) continue ;; esac
              grep -q "^${s}=y$" .config || { echo "::error::bake_usb=true 但 ${s} 不是 =y"; exit 1; }
            done
            echo ">>> bake_usb 落地校验通过（不可选符号 ${bake_invisible:-（无）}）"
          fi

          # 固件更新 app 必须真的被选中，否则镜像里没有 LuCI 入口（静默变哑巴）
          grep -q '^CONFIG_PACKAGE_luci-app-ponwrt-update=y' .config \
            || { echo "::error::.config 里没有 CONFIG_PACKAGE_luci-app-ponwrt-update=y（仓库里的 app 没被编进固件）"; exit 1; }
          echo ">>> 固件更新 app 已在 .config 里选中"

          # defconfig 之后仍不存在的片段符号：只告警（kconfig 判定依赖不满足，
          # 这类符号不能靠 CONFIG_PACKAGE_ 强行选中），逐个列出便于下一轮核对
          missing_syms=""
          off_syms=""
          for f in $(for c in $APPLY_CAPS; do echo "configs/features/${c}.config"; done) "$REPO_FRAG"; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              case "$line" in
                '# CONFIG_'*' is not set')
                  sym=${line#\# }; sym=${sym%% is not set*}; val="notset" ;;
                'CONFIG_'*=*) sym=${line%%=*}; val=${line#*=} ;;
                *) continue ;;
              esac
              if ! grep -qE "^(# )?${sym}(=| is not set)" .config; then
                missing_syms="$missing_syms ${sym}"
              elif [ "$val" != "notset" ] && grep -qx "# ${sym} is not set" .config; then
                # 符号存在但被 kconfig 关掉：多半是内核层显式 not set 压过了包选择
                off_syms="$off_syms ${sym}"
              fi
            done < "$f"
          done
          [ -z "$missing_syms" ] || echo "::warning::以下符号 kconfig 判定不可选（不会进 .config）:${missing_syms}"
          [ -z "$off_syms" ] || echo "::warning::以下符号被 kconfig 关掉（片段要求 y/m，实际 not set）:${off_syms}"

          if has_cap usb; then
            for s in kmod-usb-core kmod-usb-net; do
              grep -q "^CONFIG_PACKAGE_${s}=[my]" .config \
                || { echo "::error::usb 能力已启用，但 .config 里缺 ${s}"; exit 1; }
            done
            echo ">>> usb 能力：USB 核心栈已选中"
            # U 盘自动挂载依赖：busybox blkid 认盘并能输出 TYPE + 镜像里带 block-mount
            for s in CONFIG_BUSYBOX_CONFIG_BLKID \
                     CONFIG_BUSYBOX_CONFIG_FEATURE_BLKID_TYPE \
                     CONFIG_BUSYBOX_CONFIG_FEATURE_VOLUMEID_FAT \
                     CONFIG_BUSYBOX_CONFIG_FEATURE_VOLUMEID_EXT \
                     CONFIG_BUSYBOX_CONFIG_FEATURE_VOLUMEID_EXFAT \
                     CONFIG_BUSYBOX_CONFIG_FEATURE_VOLUMEID_NTFS \
                     CONFIG_BUSYBOX_CONFIG_FEATURE_VOLUMEID_F2FS \
                     CONFIG_BUSYBOX_CONFIG_FEATURE_VOLUMEID_BTRFS; do
              grep -q "^${s}=y" .config \
                || { echo "::error::usb 能力已启用，但 ${s} 不是 =y（插 U 盘不会被识别/自动挂载）"; exit 1; }
            done
            # 文件系统/存储驱动现在只要求“被编出来”（=y/=m 皆可），
            # 装不装进该机型镜像由 configs/devices/<board>.config 的 DEVICE_PREINSTALL 决定
            for s in kmod-fs-vfat kmod-fs-ext4 kmod-fs-exfat kmod-fs-ntfs3 kmod-fs-f2fs kmod-usb-storage; do
              grep -q "^CONFIG_PACKAGE_${s}=[ym]" .config \
                || { echo "::error::usb 能力已启用，但 ${s} 没被选中（识别到卷也挂不上）"; exit 1; }
            done
            # block-mount：单机型写全局 =y；多机型要求出现在每个 usb 机型的预装清单里
            if [ "${N_DEV:-1}" -gt 1 ]; then
              for dev in $(awk -F'\t' '$2 ~ /usb/ {print $1}' /tmp/dev-caps.tsv); do
                grep -q 'block-mount' "configs/devices/${dev}.config" \
                  || { echo "::error::${dev} 有 usb 能力，但 DEVICE_PREINSTALL 里没有 block-mount（没有热插拔挂载脚本）"; exit 1; }
              done
              echo ">>> 多机型：block-mount 已按机型预装（$(awk -F'\t' '$2 ~ /usb/ {print $1}' /tmp/dev-caps.tsv | tr '\n' ' ')）"
            else
              grep -q '^CONFIG_PACKAGE_block-mount=y' .config \
                || { echo "::error::usb 能力已启用，但 block-mount 不是 =y（没有热插拔挂载脚本）"; exit 1; }
            fi
            # btrfs 只出 apk，禁止被烘进镜像（体积考虑）
            if ! grep -q '^CONFIG_PACKAGE_kmod-fs-btrfs=m' .config; then
              echo ">>> 诊断：.config 里的 btrfs / 依赖相关行"
              grep -n -E 'BTRFS|kmod-lib-zstd|kmod-lib-xxhash|kmod-crypto-blake2b|kmod-crypto-xxhash|kmod-lib-raid6|kmod-lib-xor|kmod-lib-lzo' .config | sed 's/^/    /' || true
              echo "::error::kmod-fs-btrfs 应为 =m（只出 apk，不进镜像）"
              exit 1
            fi
            echo ">>> usb 能力：blkid 识别 + 文件系统驱动 + block-mount 已进镜像"
          fi
          if has_cap wifi; then
            grep -q "^CONFIG_PACKAGE_kmod-mt7915e=[ym]" .config \
              || { echo "::error::wifi 能力已启用，但 kmod-mt7915e 没被选中"; exit 1; }
            # 有 wifi 能力的机型，其 DEVICE_PREINSTALL 必须包含内置无线驱动
            wifi_devs=$(awk -F'\t' '$2 ~ /wifi/ {print $1}' /tmp/dev-caps.tsv)
            [ -n "$wifi_devs" ] || { echo "::error::能力表说 wifi，但没有任何机型被标成 wifi"; exit 1; }
            for dev in $wifi_devs; do
              grep -q "kmod-mt7915e" "configs/devices/${dev}.config" \
                || { echo "::error::${dev} 有 wifi 能力，但 DEVICE_PREINSTALL 里没有 kmod-mt7915e（驱动不会进镜像）"; exit 1; }
            done
            echo ">>> wifi 能力：内置无线已编出，并按机型定义预装（$wifi_devs）"
          else
            for s in kmod-mt7915e kmod-mt7916-firmware; do
              line=$(grep -E "CONFIG_PACKAGE_${s}(=| is not set)" .config | head -n1 || true)
              echo ">>> ${s}: ${line:-（.config 里没有该符号）}"
              case "$line" in
                *=y) echo "::error::未启用 wifi 能力，但 ${s}=y（会被烘进每台镜像）"; exit 1 ;;
                *=m) echo ">>> ${s}=m：只编成 apk、不进镜像（无 wifi 机型正常）" ;;
              esac
            done
            echo ">>> 无 wifi 能力：内置无线没有进镜像"
          fi

      - name: Force base-files rebuild + inject apk repo address
        run: |
          set -euo pipefail
          # 仓库地址写进镜像：package/base-files/files/ 就是 rootfs 内容
          mkdir -p package/base-files/files/etc
          printf '%s\n' \
            '# PonWrt apk 包仓库（AN7581 系列，全部 apk 与固件同一把固定私钥签名）' \
            'REPO=ufo1cn/ponwrt-apk-repo' \
            'URL=https://github.com/ufo1cn/ponwrt-apk-repo/releases' \
            'KEY_SHA256=d557dca1a8b8d30b48f7e4b910908342789d389a52db3d7225c6b72840eda4ed' \
            '# 设备侧用法：apk add --no-network /tmp/<pkg>.apk' \
            '# 公钥已在 /etc/apk/keys/public-key.pem，不需要 --allow-untrusted' \
            > package/base-files/files/etc/ponwrt-apk-repo.conf
          cat package/base-files/files/etc/ponwrt-apk-repo.conf

          # 强制 base-files 重编：build_dir 缓存会保留上一次的 signing key，
          # 不清掉的话镜像里 /etc/apk/keys/public-key.pem 还是旧 key。
          TARGET_DEVS="${{ inputs.device_list }}"
          n_dev=$(echo "$TARGET_DEVS" | wc -w)
          # 源地址按【本次内核版本 + 能力】分目录：apk 的兼容键是 arch+libc+vermagic，
          # 与机型无关，所以主目录按 kver 分、能力再分子目录（common / usb / wifi / bt…）。
          # 机型 -> 能力 的映射只来一份：configs/devices/<board>.config 的 DEVICE_CAPS。
          pv=$(awk -F':=' '/^KERNEL_PATCHVER/ {print $2; exit}' target/linux/airoha/Makefile | tr -d '[:space:]')
          suf=$(awk -v p="$pv" '$1=="LINUX_VERSION-"p {gsub(/ /,"",$3); print $3; exit}' "target/linux/generic/kernel-$pv")
          KVER="${pv}${suf}"
          [ -n "$KVER" ] || { echo "::error::算不出内核版本（KERNEL_PATCHVER=$pv）"; exit 1; }
          echo ">>> 预计算内核版本 KVER=$KVER"
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          RAW="https://raw.githubusercontent.com/ufo1cn/ponwrt-apk-repo/${{ inputs.apk_repo_branch }}/aarch64_cortex-a53/ponwrt-k${KVER}"
          # 国内只读镜像（Gitee）：由 apk-repo 的定时工作流在索引重建后自动同步，
          # 内容与 GitHub 分支一致、同一把私钥签名。用仓库变量 APK_GITEE_BASE 配置，
          # 形如 https://gitee.com/ufo1cn/ponwrt-apk-repo/raw（留空 = 不加镜像源）。
          MIRROR=""
          if [ -n "${{ vars.APK_GITEE_BASE }}" ]; then
            MIRROR="${{ vars.APK_GITEE_BASE }}/${{ inputs.apk_repo_branch }}/aarch64_cortex-a53/ponwrt-k${KVER}"
          fi
          echo ">>> 主源 $RAW"
          if [ -n "$MIRROR" ]; then echo ">>> 国内镜像 $MIRROR"; fi
          caps_of() { awk -v d="$1" '$1==d { $1=""; sub(/^[ \t]+/,""); print; exit }' /tmp/dev-caps.tsv; }
          mkdir -p package/base-files/files/etc/apk/repositories.d
          if [ "$n_dev" -gt 1 ]; then
            # 一次构建多机型：rootfs 是共用的，不能把某一台的能力源写死进所有镜像。
            # 把「机型 -> 能力」表和源前缀装进镜像，首次启动按本机 board_name 生成列表。
            : > package/base-files/files/etc/ponwrt-device-caps.txt
            for dev in $TARGET_DEVS; do
              printf '%s %s\n' "$dev" "$(caps_of "$dev")" >> package/base-files/files/etc/ponwrt-device-caps.txt
            done
            printf '%s\n' "$RAW" > package/base-files/files/etc/ponwrt-repo-base.txt
            if [ -n "$MIRROR" ]; then
              printf '%s\n' "$MIRROR" > package/base-files/files/etc/ponwrt-repo-mirror.txt
              echo ">>> 多机型：另带国内镜像前缀 /etc/ponwrt-repo-mirror.txt"
            fi
            cat > package/base-files/files/etc/uci-defaults/96-ponwrt-apk-repos <<'SH'
          #!/bin/sh
          # 首次启动：按本机 board_name 查机型能力，生成 apk 源列表。
          # 主源前缀在 /etc/ponwrt-repo-base.txt（GitHub）；国内只读镜像前缀（可选）在
          # /etc/ponwrt-repo-mirror.txt（Gitee），两者内容一致、同一把私钥签名。
          # board_name 是 OpenWrt 的 "厂商,机型" 形式（fiberhome,hg5585f-ct），
          # 能力表用的是 Device 名（fiberhome_hg5585f-ct），这里统一成下划线。
          board=$(cat /tmp/sysinfo/board_name 2>/dev/null | tr ',' '_')
          base=$(cat /etc/ponwrt-repo-base.txt 2>/dev/null)
          mirror=$(cat /etc/ponwrt-repo-mirror.txt 2>/dev/null)
          [ -n "$base" ] || [ -n "$mirror" ] || exit 0
          [ -n "$board" ] || board=unknown
          caps=$(awk -v b="$board" '$1==b { $1=""; sub(/^[ \t]+/,""); print; exit }' /etc/ponwrt-device-caps.txt 2>/dev/null)
          # SFP 变体的 board_name 多一个 -usb-sfp 后缀，回落到基础机型
          if [ -z "$caps" ]; then
            caps=$(awk -v b="${board%-usb-sfp}" '$1==b { $1=""; sub(/^[ \t]+/,""); print; exit }' /etc/ponwrt-device-caps.txt 2>/dev/null)
          fi
          d=/etc/apk/repositories.d
          mkdir -p "$d"
          {
            echo "# PonWrt 在线源（按机型能力生成：$board）"
            if [ -n "$base" ]; then
              echo "$base/common/packages.adb"
              for c in $caps; do echo "$base/$c/packages.adb"; done
            fi
            if [ -n "$mirror" ]; then
              echo "# 国内镜像源（Gitee 只读快照，与上面同内容同签名）"
              echo "$mirror/common/packages.adb"
              for c in $caps; do echo "$mirror/$c/packages.adb"; done
            fi
          } > "$d/90-ponwrt-apk-repo.list"
          echo "ponwrt: apk 源已按机型生成（$board -> ${caps:-common only}${mirror:+，含国内镜像}）"
          exit 0
          SH
            chmod +x package/base-files/files/etc/uci-defaults/96-ponwrt-apk-repos
            echo ">>> 多机型：源列表改为首次启动按机型能力生成"
            cat package/base-files/files/etc/ponwrt-device-caps.txt
          else
            # 单机型也带能力表：应用侧按 board_name 查能力来展示，不能只在多机型时有
            : > package/base-files/files/etc/ponwrt-device-caps.txt
            for dev in $TARGET_DEVS; do
              printf '%s %s\n' "$dev" "$(caps_of "$dev")" >> package/base-files/files/etc/ponwrt-device-caps.txt
            done
            cat package/base-files/files/etc/ponwrt-device-caps.txt
            caps=""
            for c in $(caps_of "$TARGET_DEVS"); do
              case " $caps " in *" $c "*) ;; *) caps="$caps $c" ;; esac
            done
            echo ">>> 目标机型 $TARGET_DEVS 能力：${caps:-（仅 common）}"
            lines=()
            if curl -fsI --max-time 25 "$RAW/common/packages.adb" >/dev/null 2>&1; then
              lines+=("# PonWrt 在线源（内核 $KVER / 通用包；与固件同一把私钥签名）" "$RAW/common/packages.adb")
              for c in $caps; do
                if curl -fsI --max-time 25 "$RAW/$c/packages.adb" >/dev/null 2>&1; then
                  lines+=("# PonWrt 在线源（内核 $KVER / 能力 $c）" "$RAW/$c/packages.adb")
                else
                  echo "::warning::仓库还没有 ponwrt-k${KVER}/$c 索引，本次跳过该能力源"
                fi
              done
            else
              echo "::warning::仓库还没有 ponwrt-k${KVER}/common 索引，回退旧目录（用户态包与内核无关，可继续用）"
              lines+=("# PonWrt 在线源（旧目录，未按内核版本分；kmod 不要从这里装）" "https://raw.githubusercontent.com/ufo1cn/ponwrt-apk-repo/${{ inputs.apk_repo_branch }}/aarch64_cortex-a53/ponwrt/packages.adb")
            fi
            if [ -n "$MIRROR" ]; then
              if curl -fsI --max-time 25 "$MIRROR/common/packages.adb" >/dev/null 2>&1; then
                lines+=("# 国内镜像源（Gitee 只读快照，与上面同内容同签名）" "$MIRROR/common/packages.adb")
                for c in $caps; do lines+=("$MIRROR/$c/packages.adb"); done
              else
                echo "::warning::Gitee 镜像还没有 ponwrt-k${KVER} 主索引，本次不写入镜像源"
              fi
            fi
            printf '%s\n' "${lines[@]}" > package/base-files/files/etc/apk/repositories.d/90-ponwrt-apk-repo.list
            cat package/base-files/files/etc/apk/repositories.d/90-ponwrt-apk-repo.list
          fi

          rm -rf build_dir/target-*/base-files* || true
          find build_dir/target-* -maxdepth 3 -name '*base-files*' -path '*stamp*' -exec rm -rf {} + 2>/dev/null || true
          echo ">>> base-files 构建状态已清除"

      - name: Inject firmware version stamp
        run: |
          set -euo pipefail
          # 成型时间只打一次：镜像里的 /etc/ponwrt-version 与 build-info.txt / manifest
          # 共用同一个时间戳，避免设备显示开工时间、仓库记录收工时间。
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "BUILT_AT=${BUILT_AT}" >> "$GITHUB_ENV"
          mkdir -p files/etc files/usr/bin
          cat > files/etc/ponwrt-version <<EOF
          device=${{ inputs.device_list }}
          feature_class=${{ inputs.label }}
          commit=$(git rev-parse HEAD)
          commit_short=$(git rev-parse --short HEAD)
          run=${{ github.run_number }}
          built_at=${BUILT_AT}
          EOF
          echo ">>> 注入完成："
          cat files/etc/ponwrt-version
          # 概览页「固件版本」来自 /etc/openwrt_release（base-files 模板 + %D/%V/%C 占位符生成），
          # 把编译时间直接写进模板，出镜像即生效，不依赖首次启动脚本。
          REL=package/base-files/files/etc/openwrt_release
          if [ -f "$REL" ]; then
            sed -i "s|^DISTRIB_DESCRIPTION=.*$|DISTRIB_DESCRIPTION='%D %V %C (built ${BUILT_AT})'|" "$REL"
            grep -n '^DISTRIB_DESCRIPTION=' "$REL"
          else
            echo "::warning::找不到 $REL，概览页固件版本不会带编译时间"
          fi
          # 检查脚本 / 代理设置 / LuCI 页面都放在 package/luci-app-ponwrt-update 里，
          # 由包管理器安装（不再往 files/ 塞同名文件，避免两处互相覆盖）

      - name: Download package sources
        run: make download -j"$(nproc)"

      - name: Compile firmware
        run: |
          [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -z || true
          make -j"$(nproc)" || make -j1 V=s

      - name: Ensure firmware images are built
        if: success()
        run: |
          set -uo pipefail
          ls -l bin/targets/airoha/an7581/ 2>/dev/null | head -n 40 || true
          n=$(find bin/targets/airoha/an7581 -maxdepth 1 -name '*sysupgrade*.itb' 2>/dev/null | wc -l)
          echo ">>> sysupgrade itb 数量: $n"
          if [ "$n" -eq 0 ]; then
            echo ">>> world 没有产出镜像，显式构建 image 目录"
            make -C target/linux/airoha/image compile install V=s 2>&1 | tail -n 80
            find bin/targets/airoha/an7581 -maxdepth 1 -name '*sysupgrade*.itb' 2>/dev/null | head -n 20
          fi

      - name: Collect repo apks (all compiled, not just kmod)
        if: success()
        run: |
          set -uo pipefail
          rm -rf kmods && mkdir -p kmods
          # 口径：本次构建编出来的 apk 全部收集，不按包名丢弃（"没编译的除外"）。
          # kmod 一律由本工作流编译（与固件同一次构建、同一棵树），
          # 三条包工作流不再编 kmod，避免 ABI 漂移与重复构建。
          # 排除 host 工具目录（那里不是设备包）。
          find bin/packages bin/targets -type f -name '*.apk' -not -path '*/host/*' \
            -exec cp -f {} kmods/ \; 2>/dev/null || true
          n=$(ls -1 kmods/*.apk 2>/dev/null | wc -l)
          echo ">>> 收集到 apk：$n 个（本次编译产出的全部）"
          ls -1 kmods 2>/dev/null | head -n 60 || true

          # 期望清单硬校验：少一个就失败，不允许静默少包
          miss=0
          for want in kmod-fs-nfs kmod-fs-nfs-common kmod-fs-nfs-v4 kmod-fs-nfsd \
                      kmod-inet-diag kmod-netlink-diag kmod-iptv \
                      luci-app-iptv luci-i18n-iptv-zh-cn; do
            if ! ls -1 kmods 2>/dev/null | grep -q "^${want}-[0-9]"; then
              echo "::error::缺少 ${want} 的 apk（CONFIG_PACKAGE_${want}=m 未产出）"
              miss=1
            fi
          done
          if [ "$miss" -ne 0 ]; then
            echo "::error::仓库 apk 不齐，后面发布不可继续"
            exit 1
          fi
          echo ">>> 期望的 9 个 apk 全部就位"

      - name: Export apk public key for the package repo
        if: always()
        run: |
          set -uo pipefail
          if [ -f public-key.pem ]; then
            cp -f public-key.pem kmods/public-key.pem
            ( cd kmods && sha256sum public-key.pem > public-key.pem.sha256 )
            echo ">>> 公钥指纹：$(sha256sum kmods/public-key.pem | cut -d' ' -f1)"
          else
            echo "::error::没有 public-key.pem，kmod apk 无法在设备上验签"
            exit 1
          fi
          # 同一个 host apk 二进制给 pkg-publish 用，索引工具版本才不会打架
          mkdir -p pubtool
          for c in staging_dir/host/bin/apk build_dir/host*/apk-*/apk; do
            if [ -f "$c" ] && [ -x "$c" ]; then
              cp -f "$c" pubtool/apk
              chmod +x pubtool/apk
              break
            fi
          done
          if [ -x pubtool/apk ]; then
            ./pubtool/apk --version || true
          else
            echo "::warning::没有可用的 host apk（pkg-publish 需要它签索引）"
          fi

      - name: Verify image honors device capabilities
        run: |
          set -uo pipefail
          # 一次构建多机型：每个 DEVICE 都有自己的 rootfs（build_dir/target-*/root-<profile>），
          # 按机型逐个核对。能力取自 configs/devices/<board>.config（经 /tmp/dev-caps.tsv 传过来），
          # 所以“哪台该带 USB、哪台该带无线”只以机型定义文件为准。
          fail=0
          DEVICES="${{ inputs.device_list }}"
          roots=$(ls -d build_dir/target-*/root-* 2>/dev/null || true)
          [ -n "$roots" ] || { echo "::error::找不到 rootfs 目录（build_dir/target-*/root-*）"; exit 1; }
          echo ">>> rootfs 目录："
          echo "$roots" | sed 's/^/    /'
          for dev in $DEVICES; do
            caps=$(awk -v d="$dev" '$1==d { $1=""; sub(/^[ \t]+/,""); print; exit }' /tmp/dev-caps.tsv)
            root=""
            for r in $roots; do
              case "$(basename "$r")" in
                *"$dev"*) [ ${#r} -gt ${#root} ] && root="$r" ;;
              esac
            done
            if [ -z "$root" ]; then
              echo "::warning::${dev} 找不到同名 rootfs 目录，跳过该机型的镜像内容核对"
              continue
            fi
            echo ">>> ${dev}（能力：${caps:-无}）rootfs=$root"
            wifi_found=$( { find "$root/lib/modules" -name 'mt7915e.ko*' -o -name 'mt7916*.ko*' 2>/dev/null
                            find "$root/lib/firmware" -name 'mt7916*' 2>/dev/null; } | head -n5 || true)
            case " $caps " in
              *" wifi "*)
                if [ -z "$wifi_found" ]; then
                  echo "::error::${dev} 有 wifi 能力，但 rootfs 里没有 mt7915e/mt7916"
                  fail=1
                else
                  echo "     wifi OK: $(echo "$wifi_found" | head -n1)"
                fi ;;
              *)
                if [ -n "$wifi_found" ]; then
                  echo "::error::${dev} 没有 wifi 能力，但 rootfs 带了无线驱动："
                  echo "$wifi_found" | sed 's/^/      /'
                  fail=1
                else
                  echo "     无 wifi：rootfs 干净"
                fi ;;
            esac
            usb_found=$(find "$root" -name 'usb-common.ko*' 2>/dev/null | head -n1 || true)
            exfat_found=$(find "$root" -name 'exfat.ko*' 2>/dev/null | head -n1 || true)
            case " $caps " in
              *" usb "*)
                if [ -z "$usb_found" ]; then
                  echo "::error::${dev} 有 usb 能力，但 rootfs 里没有 USB 核心栈（usb-common.ko）"
                  fail=1
                else
                  echo "     usb OK: $usb_found"
                fi
                [ -n "$exfat_found" ] || { echo "::error::${dev} 有 usb 能力，但 rootfs 里没有 exfat.ko（U 盘挂不上）"; fail=1; } ;;
              *)
                if [ -n "$usb_found" ]; then
                  echo "::error::${dev} 没有 usb 能力，但 rootfs 带了 USB 栈：$usb_found"
                  fail=1
                else
                  echo "     无 usb：rootfs 干净"
                fi ;;
            esac
          done
          exit $fail
      - name: Record build provenance (源码 commit + 内核版本)
        run: |
          set -euo pipefail
          mkdir -p output
          kver=$(cat build_dir/target-*/linux-*/include/config/kernel.release 2>/dev/null | head -n1 || true)
          # kernel.release 在部分构建树里为空/不存在时退回 Configure 步骤预算出的 KVER（已写入 GITHUB_ENV）
          [ -n "${kver:-}" ] || kver="${KVER:-}"
          [ -n "${kver:-}" ] || echo "::warning::拿不到内核版本，build-info.txt 记为 unknown"
          ko=$(find build_dir/target-*/linux-*/ -name '*.ko' -print 2>/dev/null | head -n1 || true)
          ver=""
          [ -n "$ko" ] && ver=$(modinfo -F vermagic "$ko" 2>/dev/null | head -n1 || true)
          # 内核配置指纹：与 OpenWrt 的 LINUX_VERMAGIC 同算法（.config.set 里所有 =y/=m 行排序后 md5）。
          # kernel 包版本就是 6.18.60~<该值>-r1，kmod apk 的依赖串认的就是它；
          # 这里把它写进 build-info，作为“包流程必须与固件同源”的唯一比对基准。
          khash=$(grep '=[ym]' build_dir/target-*/linux-*/.config.set 2>/dev/null | LC_ALL=C sort | md5sum | awk '{print $1}' || true)
          pub=$(sha256sum public-key.pem 2>/dev/null | awk '{print $1}' || true)
          {
            echo "device=${{ inputs.device_list }}"
          echo "feature_class=${{ inputs.label }}"
            echo "ponwrt_commit=$(git rev-parse HEAD)"
            echo "kernel_version=${kver:-unknown}"
            echo "kmod_vermagic=${ver:-unknown}"
            echo "config_an7581_sha256=$(sha256sum configs/an7581.config | awk '{print $1}')"
            echo "config_release_sha256=$(sha256sum configs/release.config | awk '{print $1}')"
            echo "config_6_18_sha256=$(sha256sum target/linux/airoha/an7581/config-6.18 | awk '{print $1}')"
            echo "kernel_config_hash=${khash:-unknown}"
            echo "apk_pubkey_sha256=${pub:-none}"
            echo "apk_repo_dir=ponwrt-k${KVER}"
            echo "run=${{ github.run_number }}"
            echo "workflow=${{ github.workflow }}"
            echo "built_at=${BUILT_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          } | tee output/build-info.txt
          # 装配出来的 .config 与解析后的内核 .config.set 一起随产物发布（本仓 Release），
          # 作为“这次固件到底用什么配置编出来的”留档。发布到软件仓库由收集类工作流负责，
          # 固件编译流程不再向 apk-repo 推送任何内容。
          cp -f .config "output/config-${{ inputs.label }}.txt" 2>/dev/null || true
          kcfg=$(ls build_dir/target-*/linux-*/.config.set 2>/dev/null | head -n1 || true)
          [ -n "$kcfg" ] && { cp -f "$kcfg" "output/kconfig-${{ inputs.label }}.txt" || true; }
          ls -l output/config-*.txt output/kconfig-*.txt 2>/dev/null || true


      # 内核树缓存保存。失败也存（always）：半成品 build_dir 与 stamp 是一致
      # 的，下轮 make 会续着编，比从零开始快。
      - name: Save kernel/toolchain build tree
        if: always() && inputs.cache_mode != '不使用缓存'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir/host
            build_dir/toolchain-*
            build_dir/target-*/linux-*
            staging_dir/host
            staging_dir/toolchain-*
          key: ponwrt-fwtree-${{ hashFiles('configs/an7581.config', 'configs/release.config', 'configs/features/*.config', 'target/linux/airoha/an7581/config-6.18', 'target/linux/generic/config-6.18', 'feeds.conf.default', 'target/linux/airoha/image/an7581.mk') }}-${{ github.sha }}

      - name: Save downloads cache
        if: always() && inputs.cache_mode != '不使用缓存'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ponwrt-dl-zn504-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}-${{ github.run_id }}

      - name: Save compiler ccache
        if: always() && inputs.cache_mode != '不使用缓存'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ponwrt-ccache-zn504-${{ hashFiles('configs/*.config') }}-${{ github.sha }}

      - name: Show compiler cache statistics
        if: always() && inputs.cache_mode != '不使用缓存'
        run: |
          [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -s || true

      - name: Verify signing key inside image rootfs
        run: |
          set -euo pipefail
          want=d557dca1a8b8d30b48f7e4b910908342789d389a52db3d7225c6b72840eda4ed
          got=""
          for f in build_dir/target-*/root-*/etc/apk/keys/public-key.pem; do
            [ -f "$f" ] || continue
            got=$(sha256sum "$f" | awk '{print $1}')
            echo ">>> rootfs: $f -> $got"
          done
          if [ -z "$got" ]; then
            echo "::error::rootfs 里找不到 /etc/apk/keys/public-key.pem"
            exit 1
          fi
          if [ "$got" != "$want" ]; then
            echo "::error::镜像内公钥不是固定密钥：got=$got want=$want"
            echo "::error::说明 base-files 仍然命中了旧缓存，需要把该包彻底重编"
            exit 1
          fi
          f2=$(ls build_dir/target-*/root-*/etc/ponwrt-apk-repo.conf 2>/dev/null | head -n1 || true)
          [ -n "$f2" ] || { echo "::error::镜像内缺 /etc/ponwrt-apk-repo.conf"; exit 1; }
          grep -q 'ufo1cn/ponwrt-apk-repo' "$f2" || { echo "::error::仓库地址内容不对"; exit 1; }
          # 源列表：单机型是构建期写死的静态文件；多机型改成首次启动脚本生成，
          # 这里按 N_DEV 分别核对（两者都必须能证明“源地址会被启用”）。
          if [ "${N_DEV:-1}" -gt 1 ]; then
            s3=$(ls build_dir/target-*/root-*/etc/uci-defaults/96-ponwrt-apk-repos 2>/dev/null | head -n1 || true)
            [ -n "$s3" ] || { echo "::error::镜像内缺 /etc/uci-defaults/96-ponwrt-apk-repos（多机型靠它按机型生成源列表）"; exit 1; }
            [ -x "$s3" ] || { echo "::error::96-ponwrt-apk-repos 不是可执行"; exit 1; }
            t3=$(ls build_dir/target-*/root-*/etc/ponwrt-device-caps.txt 2>/dev/null | head -n1 || true)
            [ -n "$t3" ] || { echo "::error::镜像内缺 /etc/ponwrt-device-caps.txt"; exit 1; }
            grep -q 'ponwrt-k' build_dir/target-*/root-*/etc/ponwrt-repo-base.txt 2>/dev/null \
              || { echo "::error::/etc/ponwrt-repo-base.txt 里没有仓库前缀"; exit 1; }
            m3=$(ls build_dir/target-*/root-*/etc/ponwrt-repo-mirror.txt 2>/dev/null | head -n1 || true)
            if [ -n "$m3" ]; then
              grep -q 'ponwrt-k' "$m3" || { echo "::error::/etc/ponwrt-repo-mirror.txt 里没有仓库前缀"; exit 1; }
              echo ">>> 多机型：另带国内镜像前缀（$m3）"
            fi
            echo ">>> 多机型源列表：首次启动脚本 + 机型能力表 + 源前缀都在"
          else
            f3=$(ls build_dir/target-*/root-*/etc/apk/repositories.d/90-ponwrt-apk-repo.list 2>/dev/null | head -n1 || true)
            [ -n "$f3" ] || { echo "::error::镜像内缺 90-ponwrt-apk-repo.list"; exit 1; }
            grep -q '^https://raw.githubusercontent.com/ufo1cn/ponwrt-apk-repo' "$f3" \
              || { echo "::error::repositories.d 里的源地址没启用"; exit 1; }
            echo ">>> repositories.d 地址条目也在"
          fi
          echo ">>> 镜像自检通过：固定公钥 + 仓库地址都在"

      - name: Organize output files
        run: |
          mkdir -p output
          # 逐 board 取产物：同一个文件名可能同时命中两个 board 名（例如
          # fiberhome_hg5585f-ct 是 fiberhome_hg5585f-ct-usb-sfp 的前缀），
          # 所以取「匹配上的最长 board 名」作为归属，避免 SFP 变体被黑名单误删、
          # 也避免一个文件被算给两个机型。
          matched=""
          [ -n "${DEVICE_LIST:-}" ] || { echo "::error::DEVICE_LIST 为空，无法判断产物归属"; exit 1; }
          for f in bin/targets/airoha/an7581/*; do
            [ -f "$f" ] || continue
            fb=$(basename "$f")
            case "$fb" in
              *sysupgrade*.itb|*recovery*.itb|*manifest) ;;
              *) continue ;;
            esac
            best=""
            for b in $DEVICE_LIST; do
              case "$fb" in
                *"$b"*) [ ${#b} -gt ${#best} ] && best="$b" ;;
              esac
            done
            [ -n "$best" ] || continue
            case " $matched " in *" $best "*) ;; *) matched="$matched $best" ;; esac
            cp -f "$f" output/
          done
          echo ">>> 产物归属机型:${matched:-（无）}"
          echo "MATCHED=$matched" >> "$GITHUB_ENV"
          # 逐机型写 manifest：fw-publish 与 meta/fw 索引都按「文件名含 manifest 且含机型名」查找。
          # 缺了它索引里就没有 manifest 字段、sysupgrade.size 也只能是空。
          python3 - <<'PY'
          import hashlib, json, os

          devices = os.environ.get('DEVICE_LIST', '').split()
          info = {}
          if os.path.isfile('output/build-info.txt'):
              for line in open('output/build-info.txt', encoding='utf-8'):
                  if '=' in line:
                      k, v = line.strip().split('=', 1)
                      info[k] = v
          itbs = [f for f in os.listdir('output') if f.endswith('.itb')]

          def sha256(p):
              h = hashlib.sha256()
              with open(p, 'rb') as fh:
                  for b in iter(lambda: fh.read(1 << 20), b''):
                      h.update(b)
              return h.hexdigest()

          for dev in devices:
              cand = [f for f in itbs if dev in f and 'sysupgrade' in f and 'sfp' not in f]
              if not cand:
                  print('WARN: %s 没有 sysupgrade itb，跳过 manifest' % dev)
                  continue
              cand.sort(key=lambda f: (len(f), f))
              up = cand[0]
              p = os.path.join('output', up)
              man = {
                  'schema': 1,
                  'device': dev,
                  'label': info.get('feature_class', ''),
                  'run': int(info.get('run', '0') or 0),
                  'commit': info.get('ponwrt_commit', ''),
                  'kernel_version': info.get('kernel_version', 'unknown'),
                  'kmod_vermagic': info.get('kmod_vermagic', 'unknown'),
                  'built_at': info.get('built_at', ''),
                  'sysupgrade': {
                      'name': up,
                      'sha256': sha256(p),
                      'size': os.path.getsize(p),
                  },
                  'kmods_release': 'kmods-%s-r%s' % (info.get('feature_class', ''), info.get('run', '0')),
              }
              path = os.path.join('output', 'manifest-%s.json' % dev)
              with open(path, 'w', encoding='utf-8') as fh:
                  fh.write(json.dumps(man, ensure_ascii=False, indent=2) + '\n')
              print('>>> manifest -> %s（%s, %s 字节）' % (path, up, man['sysupgrade']['size']))
          PY
          cd output
          for file in $(ls * 2>/dev/null); do
            [ -f "$file" ] && sha256sum "$file" > "${file}.sha256"
          done
          echo "=== Generated Firmware Artifacts ==="
          ls -lh
          echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV

      - name: Verify requested firmware exists
        run: |
          fail=0
          [ -n "${DEVICE_LIST:-}" ] || { echo "::error::DEVICE_LIST 为空，无法校验机型产物"; exit 1; }
          # root 是上一步的局部变量，跨步骤不保留（GitHub Actions 每步独立 shell），
          # 这里必须自己再算一次，否则 $root 为空、所有 /xxx 检查都会假报缺失。
          root=$(ls -d build_dir/target-*/root-* 2>/dev/null | head -n1 || true)
          [ -n "$root" ] || { echo "::error::找不到 rootfs 目录（build_dir/target-*/root-*）"; exit 1; }
          echo ">>> rootfs: $root"
          for b in $DEVICE_LIST; do
            case " ${MATCHED:-} " in
              *" $b "*) echo ">>> ${b} 固件已收集" ;;
              *) echo "::error::缺少机型 ${b} 的固件（产物收集没匹配到，属于静默丢弃）"; fail=1 ;;
            esac
          done
          for f in usr/libexec/rpcd/luci.ponwrt_update usr/bin/ponwrt-update \
                   usr/bin/ponwrt-fw-check \
                   www/luci-static/resources/view/ponwrt_update/overview.js \
                   usr/share/luci/menu.d/luci-app-ponwrt-update.json \
                   etc/uci-defaults/95-ponwrt-version-label; do
            if [ -e "$root/$f" ]; then
              echo ">>> 固件更新 app 落地: /$f"
            else
              echo "::error::rootfs 里缺 /$f（luci-app-ponwrt-update 没进镜像）"
              fail=1
            fi
          done
          # 可执行位必须真的落到镜像里：缺了 rpcd 就起不了 luci.ponwrt_update，
          # LuCI 会报 “RPC call to luci.ponwrt_update/status failed: Object not found”。
          for f in usr/libexec/rpcd/luci.ponwrt_update usr/bin/ponwrt-update \
                   usr/bin/ponwrt-fw-check etc/uci-defaults/95-ponwrt-version-label; do
            if [ -x "$root/$f" ]; then
              echo ">>> 可执行位 OK: /$f"
            else
              echo "::error::/$f 在镜像里不是可执行（rpcd 对象会缺失、uci-defaults 不会跑）"
              fail=1
            fi
          done
          # 版本戳必须带 built_at（与 build-info.txt 共用同一个时间）
          if grep -q "(built " "$root/etc/openwrt_release" 2>/dev/null; then
            echo ">>> 概览固件版本已带编译时间: $(grep '^DISTRIB_DESCRIPTION=' "$root/etc/openwrt_release")"
          else
            echo "::error::/etc/openwrt_release 的固件版本没带 (built ...)，概览页看不到编译时间"
            fail=1
          fi
          ba=$(sed -n 's/^built_at=//p' "$root/etc/ponwrt-version" 2>/dev/null | head -n1)
          case "$ba" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9]Z)
              echo ">>> 版本戳 built_at=$ba" ;;
            *)
              echo "::error::/etc/ponwrt-version 的 built_at 缺失或格式不对（'$ba'）"
              fail=1 ;;
          esac
          exit $fail

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-firmware-${{ inputs.label }}-r${{ github.run_number }}
          path: |
            output/*
            kmods/*
            pubtool/apk
          retention-days: 14

      - name: Generate release tag
        id: tag
        if: inputs.upload_release
        run: |
          set -euo pipefail
          # tag 不再另取一次时钟：镜像里的 built_at 是编译开始时写进 rootfs 的，
          # 若 tag 用发布时刻，两者必然差一个编译时长（约 3.5h）。这里让 tag 与
          # built_at 同源，三处（镜像/build-info/meta）自然字面一致。
          # 三个入口经常在同一分钟 dispatch（built_at 分钟位相同），必须带 label 与 run 号
          # 才唯一，否则 action-gh-release 会把不同入口的固件并进同一个 tag。
          T="${BUILT_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          echo "release_tag=v$(date -u -d "$T" +'%Y.%m.%d-%H%M')-${{ inputs.label }}-r${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # 真实发布时间：单独记，绝不进镜像；写进 build-info.txt 并重算它的 sha256
          # （产物 zip 的 Build artifact 步骤在上面已跑完，那份是发布前快照，不含本行）
          PUB=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "PUBLISHED_AT=${PUB}" >> "$GITHUB_ENV"
          if [ -f output/build-info.txt ]; then
            sed -i '/^published_at=/d' output/build-info.txt
            echo "published_at=${PUB}" >> output/build-info.txt
            ( cd output && sha256sum build-info.txt > build-info.txt.sha256 )
            echo ">>> 发布时间 published_at=${PUB}（build-info.txt.sha256 已重算）"
          else
            echo "::warning::没有 output/build-info.txt，published_at 只记在 meta"
          fi

      - name: Upload firmware to GitHub Release
        uses: softprops/action-gh-release@v2
        if: inputs.upload_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: PonWrt 固件（${{ inputs.label }}）${{ steps.tag.outputs.release_tag }}
          body: |
            ## 本次构建（机型类别 ${{ inputs.label }}）

            - 机型：${{ inputs.device_list }}
            - 装什么包只由 `configs/devices/<board>.config` 决定（`DEVICE_CAPS` / `DEVICE_PREINSTALL`），一次构建内按机型装包
            - 配置来源：`configs/an7581.config` + `configs/release.config`（不合并自有应用清单，应用走包工作流）
            - 内核能力：`target/linux/airoha/an7581/config-6.18` + `patches-6.18`（含 9xx 板级、GDM3/4、flowtable 卸载）
            - 透明代理：`honk` + `luci-app-honk` 已预装（honk-core 由 `honk-install` 运行时按需装）
            - 内存：`kmod-zram` + `zram-swap` 已预装，首次启动即建压缩交换区（`system.zram_size_mb`），`vm.swappiness=20` 由 `rc.local` 收紧
            - 全锥 NAT：内核 + `libnftnl` / `nftables` / `firewall4` 补丁已合入镜像，默认未启用（`firewall.@defaults[0].fullcone` 未置 1）
            - 运行时调优：`sysctl.d`（4MB 缓冲 / BBR+fq / conntrack）、`98-pppoe-rps`、`rc.local`（txqueuelen、IRQ 分核、PPE bind_rate、airoha-pond OOM 守卫）
            - apk 在线源：`ufo1cn/ponwrt-apk-repo` 的 `${{ inputs.apk_repo_branch }}` 分支，目录 `ponwrt-k<kver>/<能力>/`，与固件同一把固定私钥
            - 内核与 kmod 同源树编译，ABI 与包工作流一致；commit / kernel_version / kmod_vermagic 见附件 `build-info.txt`
            - 实验分支 `feat/wed-npu-offload-6.18` 另启用 AN7581 WED v1 TX + MT7916 NPU RX 硬件卸载，产物只留在本 run 的 artifact，不写版本索引
          files: output/*

      - name: Publish kmod apks prerelease
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(kmods/*.apk kmods/public-key.pem kmods/public-key.pem.sha256)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::没有 kmod 产物，跳过预发布"
            exit 0
          fi
          tag="kmods-${{ inputs.label }}-r${{ github.run_number }}"
          kver=$(awk -F= '/^kernel_version=/{print $2}' output/build-info.txt 2>/dev/null | head -n1 || true)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --prerelease \
              --title "kmod apks $tag" \
              --notes "机型类别 ${{ inputs.label }}（${{ inputs.device_list }}）；内核 ${kver:-unknown}；与本次固件同一次构建、同一棵树产出，vermagic 见 artifact 里的 build-info.txt。发布入口会把它们归入 ufo1cn/ponwrt-apk-repo 的 ${{ inputs.apk_repo_branch }} 分支的 ponwrt-k<kver>/<能力>/ 并重建签名索引；装包前把 public-key.pem 放 /etc/apk/keys/ 即可免 --allow-untrusted。"
          fi
          echo ">>> kmod 预发布：$(ls -1 kmods/*.apk 2>/dev/null | wc -l) 个 apk -> $tag"
