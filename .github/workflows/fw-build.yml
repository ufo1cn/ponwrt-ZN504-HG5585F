name: PonWrt firmware build (reusable)

# ==============================================================================
# 本文件基于上游 .github/workflows/build-zn504.yml 修改而来（步骤顺序、依赖列表、
# 缓存策略、产物组织与发布方式全部沿用上游），只做以下必要改动：
#
#   1) 触发方式：删除 push 自动触发，只保留 workflow_dispatch（手动运行），
#      新增 devices 输入用于选择机型；
#   2) 配置：只合并上游 configs/an7581.config + configs/release.config。
#      configs/pon-packages/*.config 仅供 build-packages-incremental.yml 使用，
#      固件不再选装自有包（内核能力由 config-6.18 的内置符号提供）；
#   3) 机型：defconfig 之后锁定 HG5585F-CT / HG5382A，其它机型关闭
#      （defconfig 会重算设备列表，因此机型锁定必须放在 defconfig 之后，且之后
#       不再执行 defconfig）；
#   4) 产物：上游 find 只匹配 zn504 / hg5585f-ct / hg5585f-cu，HG5382A 会被名字
#      过滤静默丢弃；这里加上 *hg5382a* 并对目标机型做存在性硬校验；
#   5) 未改动：Feed 更新、customize.sh、包源码下载、编译命令、ccache 存取、
#      产物 sha256、Artifact 上传、Release 发布流程。
# ==============================================================================

on:
  workflow_call:
    inputs:
      label:
        description: '机型类别（写进 artifact 名 / release 标题，如 usb-wifi / usb / plain）'
        required: true
        type: string
      device_list:
        description: '要编的 board 列表（空格分隔，如 "fiberhome_hg5382a"）'
        required: true
        type: string
      upload_release:
        description: '上传 GitHub Release'
        required: false
        default: true
        type: boolean
      cache_mode:
        description: '编译缓存模式（使用缓存 / 重新编译 / 不使用缓存）'
        required: false
        default: '使用缓存'
        type: string
      bake_usb:
        description: 'USB 驱动是否烘焙进镜像：true = 全部 =y 进镜像（旧 USB 固件做法）；false = 只编成 apk 进仓库，设备上按需装（=m）'
        required: false
        default: false
        type: boolean

concurrency:
  # 按机型类别隔离：usb-wifi / usb / plain 三条互不打断；只有同类别重复运行才取消
  group: ponwrt-fw-${{ inputs.label }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    name: Build ${{ inputs.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install fixed apk signing key
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${APK_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::未配置 APK_SIGNING_PRIVATE_KEY，本次用 run 内临时密钥（跨 run 不可互信）"
            exit 0
          fi
          # rules.mk: BUILD_KEY_APK_SEC=$(TOPDIR)/private-key.pem / BUILD_KEY_APK_PUB=$(TOPDIR)/public-key.pem
          # 全仓库固定同一把密钥，设备只需装一次 /etc/apk/keys/public-key.pem
          printf '%s\n' "$APK_SIGNING_PRIVATE_KEY" > private-key.pem
          chmod 600 private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem
          sha256sum public-key.pem


      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full pahole patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-zn504-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-zn504-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare custom packages
        run: |
          bash ./scripts/customize.sh

      - name: Restore compiler ccache
        if: inputs.cache_mode != '不使用缓存'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ponwrt-ccache-zn504-${{ hashFiles('configs/*.config') }}-${{ github.sha }}
          restore-keys: |
            ponwrt-ccache-zn504-${{ hashFiles('configs/*.config') }}-
            ponwrt-ccache-zn504-

      - name: Configure for the requested device(s)
        run: |
          # 上游两份配置 + 本仓库上层应用清单
          ./scripts/kconfig.pl + \
            configs/an7581.config \
            configs/release.config > .config

          sed -i '/^CONFIG_KERNEL_DEBUG_INFO_REDUCED=/d' .config
          printf 'CONFIG_KERNEL_DEBUG_INFO=y\n# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set\nCONFIG_KERNEL_DEBUG_INFO_BTF=y\nCONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y\nCONFIG_KERNEL_MODULE_ALLOW_BTF_MISMATCH=y\nCONFIG_KERNEL_KPROBES=y\nCONFIG_KERNEL_BPF_EVENTS=y\n' >> .config
          if [ "${{ inputs.cache_mode }}" != "不使用缓存" ]; then
            sed -i '/^CONFIG_DEVEL=/d; /^CONFIG_CCACHE=/d' .config
            printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
          fi
          make defconfig

          # ------------------------------------------------------------------
          # 机型锁定（defconfig 之后，且之后不再 defconfig）
          # an7581.config 默认选中多个机型；这里先清空全部
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_*，只写入本次要编的机型，
          # 避免多 profile 重复建 rootfs，同时保证 HG5382A 一定在列。
          # ------------------------------------------------------------------
          DEVICES="${{ inputs.device_list }}"
          [ -n "${DEVICES// /}" ] || { echo "::error::device_list 为空"; exit 1; }

          echo ">>> 目标机型: $DEVICES"
          sed -i '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          sed -i '/^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.* is not set/d' .config
          for d in $DEVICES; do
            printf 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_%s=y\n' "$d" >> .config
          done
          for d in $DEVICES; do
            grep -q "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${d}=y" .config \
              || { echo "::error::机型符号未落地: CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${d}=y"; exit 1; }
          done
          echo ">>> 机型锁定完成（未再执行 defconfig）"

          # ------------------------------------------------------------------
          # 机型能力 -> 配置片段（configs/features/<能力>.config）
          #
          #   能力表 = configs/device-features.txt（<机型>|<能力...>），与本工作流
          #   后面写 apk 仓库源用的是同一张表。每个能力对应一份片段，片段每行要么
          #   `CONFIG_X=y|m`，要么 `# CONFIG_X is not set`；
          #   应用方式：把该符号的旧行删干净，再按片段写回 .config（不再 defconfig，
          #   否则刚锁定的机型行会被重算掉）。
          #
          #   当前：HG5585F-CT = usb wifi（USB 栈 + 内置 MT7916 无线）
          #         HG5382A    = 无（镜像里不放无线 / USB 软件）
          #         XG-040G-MD = usb（有 USB、无内置无线；USB 网卡驱动也在 usb 片段）
          #   新机型只在能力表加一行，这段逻辑不用动。
          # ------------------------------------------------------------------
          features_of() {
            local dev line block out
            dev="$1"; out=""
            line=$(grep -E "^[[:space:]]*${dev}[[:space:]]*\|" configs/device-features.txt 2>/dev/null | head -n1 || true)
            if [ -n "$line" ]; then printf '%s' "${line#*|}"; return 0; fi
            block=$(awk -v d="$dev" 'index($0,"define Device/" d)==1 {f=1;next} f&&/^endef/{exit} f' target/linux/airoha/image/*.mk 2>/dev/null || true)
            if echo "$block" | grep -qiE 'kmod-usb'; then out="$out usb"; fi
            printf '%s' "$out"
          }
          CAPS=""
          for dev in $DEVICES; do
            for c in $(features_of "$dev"); do
              case " $CAPS " in *" $c "*) ;; *) CAPS="$CAPS $c" ;; esac
            done
          done
          echo ">>> 机型 $DEVICES 能力：${CAPS:-（无：只编公共部件）}"
          echo "CAPS=$CAPS" >> "$GITHUB_ENV"

          APPLY_CAPS="$CAPS"
          case " $CAPS " in
            *" wifi "*) ;;
            *) APPLY_CAPS="$APPLY_CAPS no-wifi"
               echo ">>> 本机型没有内置无线：追加 no-wifi 片段（关掉 release.config 的 mt7915e/mt7916）" ;;
          esac

          n_frag=0; missing_syms=""
          for c in $APPLY_CAPS; do
            f="configs/features/${c}.config"
            if [ ! -f "$f" ]; then
              echo "::warning::能力 ${c} 没有对应片段 $f，跳过"
              continue
            fi
            echo ">>> 应用能力片段: $f"
            while IFS= read -r line; do
              case "$line" in
                '# CONFIG_PACKAGE_'*' is not set')
                  sym=${line#\# }; sym=${sym%% is not set*}; val="notset" ;;
                'CONFIG_PACKAGE_'*=*)
                  sym=${line%%=*}; val=${line#*=} ;;
                *) continue ;;
              esac
              # 符号必须真实存在于本次源码树（defconfig 之后每个可用包符号都在
              # .config 里），不存在只告警——写进一个不存在的包名会静默不编
              grep -qE "^(# )?${sym}(=| is not set)" .config || missing_syms="$missing_syms ${sym}"
              sed -i "/^${sym}=/d; /^# ${sym} is not set/d" .config
              # bake_usb=true 时把片段里的 =m 全部改写成 =y（= 旧 USB 固件 USB_PKGS 的做法：
              # 驱动直接烘进镜像，插上即用；代价是镜像变大）
              if [ "$val" = "m" ] && [ "${{ inputs.bake_usb }}" = "true" ]; then
                val="y"
              fi
              if [ "$val" = "notset" ]; then
                printf '# %s is not set\n' "$sym" >> .config
              else
                printf '%s=%s\n' "$sym" "$val" >> .config
              fi
              n_frag=$((n_frag+1))
            done < "$f"
          done
          echo ">>> 能力片段共应用 $n_frag 个符号"
          [ -z "$missing_syms" ] || echo "::warning::以下符号在当前源码树里不存在（照写但不会被编）:${missing_syms}"

          if [ "${{ inputs.bake_usb }}" = "true" ] && has_cap usb; then
            echo ">>> bake_usb=true：USB 驱动按 =y 烘焙进镜像"
            for s in $(grep '^CONFIG_PACKAGE_' configs/features/usb.config | cut -d= -f1); do
              grep -q "^${s}=y$" .config || { echo "::error::bake_usb=true 但 ${s} 不是 =y"; exit 1; }
            done
            echo ">>> bake_usb 落地校验通过"
          fi
          has_cap() { case " $CAPS " in *" $1 "*) return 0 ;; *) return 1 ;; esac ; }
          if has_cap usb; then
            for s in kmod-usb-core kmod-usb-net; do
              grep -q "^CONFIG_PACKAGE_${s}=[my]" .config \
                || { echo "::error::usb 能力已启用，但 .config 里缺 ${s}"; exit 1; }
            done
            echo ">>> usb 能力：USB 核心栈已选中"
          fi
          if has_cap wifi; then
            grep -q "^CONFIG_PACKAGE_kmod-mt7915e=y" .config \
              || { echo "::error::wifi 能力已启用，但 kmod-mt7915e 不是 =y"; exit 1; }
            echo ">>> wifi 能力：内置无线已进镜像"
          else
            for s in kmod-mt7915e kmod-mt7916-firmware; do
              grep -q "^# CONFIG_PACKAGE_${s} is not set" .config \
                || { echo "::error::未启用 wifi 能力，但 ${s} 仍被选中"; exit 1; }
            done
            echo ">>> 无 wifi 能力：内置无线已关闭"
          fi

      - name: Force base-files rebuild + inject apk repo address
        run: |
          set -euo pipefail
          # 仓库地址写进镜像：package/base-files/files/ 就是 rootfs 内容
          mkdir -p package/base-files/files/etc
          printf '%s\n' \
            '# PonWrt apk 包仓库（AN7581 系列，全部 apk 与固件同一把固定私钥签名）' \
            'REPO=ufo1cn/ponwrt-apk-repo' \
            'URL=https://github.com/ufo1cn/ponwrt-apk-repo/releases' \
            'KEY_SHA256=d557dca1a8b8d30b48f7e4b910908342789d389a52db3d7225c6b72840eda4ed' \
            '# 设备侧用法：apk add --no-network /tmp/<pkg>.apk' \
            '# 公钥已在 /etc/apk/keys/public-key.pem，不需要 --allow-untrusted' \
            > package/base-files/files/etc/ponwrt-apk-repo.conf
          cat package/base-files/files/etc/ponwrt-apk-repo.conf

          # 强制 base-files 重编：build_dir 缓存会保留上一次的 signing key，
          # 不清掉的话镜像里 /etc/apk/keys/public-key.pem 还是旧 key。
          TARGET_DEVS="${{ inputs.device_list }}"
          n_dev=$(echo "$TARGET_DEVS" | wc -w)
          [ "$n_dev" -eq 1 ] || echo "::warning::本次一台以上机型：repositories.d 按能力并集写（要严格隔离请用单机型工作流）"
          # 源地址按【本次内核版本 + 能力】分目录：apk 的兼容键是 arch+libc+vermagic，
          # 与机型无关，所以主目录按 kver 分、能力再分子目录（common / usb / wifi / bt…）。
          # 机型 -> 能力 的映射见 configs/device-features.txt；没写的机型只挂 common。
          pv=$(awk -F':=' '/^KERNEL_PATCHVER/ {print $2; exit}' target/linux/airoha/Makefile | tr -d '[:space:]')
          suf=$(awk -v p="$pv" '$1=="LINUX_VERSION-"p {gsub(/ /,"",$3); print $3; exit}' "target/linux/generic/kernel-$pv")
          KVER="${pv}${suf}"
          [ -n "$KVER" ] || { echo "::error::算不出内核版本（KERNEL_PATCHVER=$pv）"; exit 1; }
          echo ">>> 预计算内核版本 KVER=$KVER"
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          RAW="https://raw.githubusercontent.com/ufo1cn/ponwrt-apk-repo/repo/aarch64_cortex-a53/ponwrt-k${KVER}"
          features_of() {
            local dev line block out
            dev="$1"; out=""
            line=$(grep -E "^[[:space:]]*${dev}[[:space:]]*\|" configs/device-features.txt 2>/dev/null | head -n1 || true)
            if [ -n "$line" ]; then printf '%s' "${line#*|}"; return 0; fi
            # 兜底：从机型 profile 的 DEVICE_PACKAGES 推能力
            block=$(awk -v d="$dev" 'index($0,"define Device/" d)==1 {f=1;next} f&&/^endef/{exit} f' target/linux/airoha/image/*.mk 2>/dev/null || true)
            if echo "$block" | grep -qiE 'kmod-usb'; then out="$out usb"; fi
            if echo "$block" | grep -qiE 'kmod-(rtw88|rtl8|mt76|ath9k|ath10|ath11|iwlwifi)'; then out="$out wifi"; fi
            if echo "$block" | grep -qiE 'kmod-(btusb|bluetooth)|bluez'; then out="$out bt"; fi
            printf '%s' "$out"
          }
          caps=""
          for dev in $TARGET_DEVS; do
            for c in $(features_of "$dev"); do
              case " $caps " in *" $c "*) ;; *) caps="$caps $c" ;; esac
            done
          done
          echo ">>> 目标机型 $TARGET_DEVS 能力：${caps:-（仅 common）}"
          mkdir -p package/base-files/files/etc/apk/repositories.d
          lines=()
          if curl -fsI --max-time 25 "$RAW/common/packages.adb" >/dev/null 2>&1; then
            lines+=("# PonWrt 在线源（内核 $KVER / 通用包；与固件同一把私钥签名）" "$RAW/common/packages.adb")
            for c in $caps; do
              if curl -fsI --max-time 25 "$RAW/$c/packages.adb" >/dev/null 2>&1; then
                lines+=("# PonWrt 在线源（内核 $KVER / 能力 $c）" "$RAW/$c/packages.adb")
              else
                echo "::warning::仓库还没有 ponwrt-k${KVER}/$c 索引，本次跳过该能力源"
              fi
            done
          else
            echo "::warning::仓库还没有 ponwrt-k${KVER}/common 索引，回退旧目录（用户态包与内核无关，可继续用）"
            lines+=("# PonWrt 在线源（旧目录，未按内核版本分；kmod 不要从这里装）" "https://raw.githubusercontent.com/ufo1cn/ponwrt-apk-repo/repo/aarch64_cortex-a53/ponwrt/packages.adb")
          fi
          printf '%s\n' "${lines[@]}" > package/base-files/files/etc/apk/repositories.d/90-ponwrt-apk-repo.list
          cat package/base-files/files/etc/apk/repositories.d/90-ponwrt-apk-repo.list

          rm -rf build_dir/target-*/base-files* || true
          find build_dir/target-* -maxdepth 3 -name '*base-files*' -path '*stamp*' -exec rm -rf {} + 2>/dev/null || true
          echo ">>> base-files 构建状态已清除"

      - name: Inject firmware version stamp and update checker
        run: |
          set -euo pipefail
          mkdir -p files/etc files/usr/bin
          cat > files/etc/ponwrt-version <<EOF
          device=${{ inputs.device_list }}
          feature_class=${{ inputs.label }}
          commit=$(git rev-parse HEAD)
          commit_short=$(git rev-parse --short HEAD)
          run=${{ github.run_number }}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cat > files/usr/bin/ponwrt-fw-check <<'EOF'
          #!/bin/sh
          # PonWrt 固件更新检查（GitHub Releases 索引，纯 GitHub 方案，无需 ASU 服务端）
          # 索引地址：https://raw.githubusercontent.com/ufo1cn/ponwrt-apk-repo/repo/meta/fw/<device>.json
          IDX_BASE="${PONWRT_FW_INDEX:-https://raw.githubusercontent.com/ufo1cn/ponwrt-apk-repo/repo/meta/fw}"
          VF=/etc/ponwrt-version
          [ -f "$VF" ] || { echo "缺少 $VF，无法判断本地版本"; exit 1; }
          dev=$(sed -n 's/^device=//p' "$VF" | head -n1)
          cur=$(sed -n 's/^run=//p' "$VF" | head -n1)
          echo "本地：device=$dev run=$cur feature_class=$(sed -n 's/^feature_class=//p' "$VF" | head -n1)"
          [ -n "$dev" ] || { echo "本地版本文件里没有 device 字段"; exit 1; }
          # 代理：PONWRT_PROXY > /etc/ponwrt-update.conf 的 PROXY= > 系统的 http(s)_proxy > 直连
          PROXY="${PONWRT_PROXY:-}"
          if [ -z "$PROXY" ] && [ -f /etc/ponwrt-update.conf ]; then
            PROXY=$(sed -n 's/^PROXY=//p' /etc/ponwrt-update.conf | head -n1)
          fi
          [ -n "$PROXY" ] || PROXY="${https_proxy:-${http_proxy:-}}"
          PROXYARG=""
          [ -n "$PROXY" ] && PROXYARG="--proxy $PROXY"
          echo "代理：${PROXY:-直连}"
          tmp=$(mktemp) || exit 1
          if ! curl -fsSL $PROXYARG --connect-timeout 10 --retry 2 "$IDX_BASE/$dev.json" -o "$tmp"; then
            echo "拉取更新索引失败：$IDX_BASE/$dev.json（检查本机能否访问 raw.githubusercontent.com）"
            rm -f "$tmp"; exit 2
          fi
          tag=$(jsonfilter -i "$tmp" -e '@.tag' 2>/dev/null)
          newrun=$(jsonfilter -i "$tmp" -e '@.run' 2>/dev/null)
          name=$(jsonfilter -i "$tmp" -e '@.sysupgrade.name' 2>/dev/null)
          sha=$(jsonfilter -i "$tmp" -e '@.sysupgrade.sha256' 2>/dev/null)
          url=$(jsonfilter -i "$tmp" -e '@.sysupgrade.url' 2>/dev/null)
          man=$(jsonfilter -i "$tmp" -e '@.manifest.url' 2>/dev/null)
          rm -f "$tmp"
          [ -n "$newrun" ] || { echo "索引内容无法解析（tag=$tag）"; exit 3; }
          if [ "$newrun" -gt "${cur:-0}" ] 2>/dev/null; then
            echo
            echo "发现新固件：$tag（run $newrun，本地 run ${cur:-0}）"
            echo "  镜像：$name"
            echo "  下载：$url"
            echo "  sha256：$sha"
            [ -n "$man" ] && echo "  manifest：$man"
            echo
            echo "升级步骤：下载后用 sha256sum -c 校验，再 sysupgrade -k -v <itb>（保留配置）或 sysupgrade -n -v <itb>（不保留）"
            exit 0
          fi
          echo "已是最新固件（索引 tag=$tag run=$newrun）"
          EOF
          cat > files/etc/ponwrt-update.conf <<'EOF'
          # PonWrt 更新检查用的出站代理（留空=直连；也可在设备上 export PONWRT_PROXY 覆盖）
          # 例：PROXY=http://127.0.0.1:7890   （mihomo/sing-box 的 mixed/http 端口）
          PROXY=
          EOF
          cat > files/etc/profile.d/ponwrt-proxy.sh <<'EOF'
          # 让交互式 shell 里的 apk/curl 走 /etc/ponwrt-update.conf 里配置的代理
          [ -f /etc/ponwrt-update.conf ] && . /etc/ponwrt-update.conf
          if [ -n "${PROXY:-}" ]; then
            export http_proxy="$PROXY" https_proxy="$PROXY" all_proxy="$PROXY"
          fi
          EOF
          chmod +x files/etc/profile.d/ponwrt-proxy.sh
          chmod +x files/usr/bin/ponwrt-fw-check
          echo ">>> 注入完成："
          cat files/etc/ponwrt-version
          sh -n files/usr/bin/ponwrt-fw-check && echo ">>> 更新检查脚本语法 OK"

      - name: Download package sources
        run: make download -j"$(nproc)"

      - name: Compile firmware
        run: |
          [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -z || true
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify image honors device capabilities
        run: |
          set -uo pipefail
          CAPS="${CAPS:-}"
          echo ">>> 本次机型能力: ${CAPS:-（无）}"
          has_cap() { case " $CAPS " in *" $1 "*) return 0 ;; *) return 1 ;; esac ; }
          root=$(ls -d build_dir/target-*/root-* 2>/dev/null | head -n1 || true)
          [ -n "$root" ] || { echo "::error::找不到 rootfs 目录（build_dir/target-*/root-*）"; exit 1; }
          echo ">>> rootfs: $root"
          fail=0

          wifi_found=$(find "$root" -name 'mt7915e.ko*' -o -name 'mt7916*' 2>/dev/null | head -n5 || true)
          if has_cap wifi; then
            if [ -z "$wifi_found" ]; then
              echo "::error::机型能力含 wifi，但 rootfs 里找不到 mt7915e/mt7916 驱动（内置无线没进镜像）"
              fail=1
            else
              echo ">>> wifi 能力核对通过：$(echo "$wifi_found" | head -n1)"
            fi
          else
            if [ -n "$wifi_found" ]; then
              echo "::error::机型能力不含 wifi，但 rootfs 里带了无线驱动："
              echo "$wifi_found" | sed 's/^/    /'
              fail=1
            else
              echo ">>> 无 wifi 能力核对通过：rootfs 里没有 mt7915e/mt7916"
            fi
          fi

          usb_found=$(find "$root" -name 'usb-common.ko*' 2>/dev/null | head -n5 || true)
          if [ "${{ inputs.bake_usb }}" = "true" ] && has_cap usb; then
            for m in exfat.ko snd-usb-audio.ko; do
              if find "$root" -name "$m*" 2>/dev/null | grep -q .; then
                echo ">>> bake_usb 核对: $m 已在镜像里"
              else
                echo "::error::bake_usb=true，但 rootfs 里没有 $m（说明片段没按 =y 烘焙）"
                fail=1
              fi
            done
            # USB 无线网卡（rtw88 USB 栈）必须真的落地，否则清单里的 kmod-rtw88-* 就是被 kconfig 静默丢掉的
            for m in rtw88_usb.ko rtw88_8822cu.ko rtw88_8821cu.ko; do
              if find "$root" -name "$m*" 2>/dev/null | grep -q .; then
                echo ">>> bake_usb 核对: $m 已在镜像里"
              else
                echo "::error::bake_usb=true，但 rootfs 里没有 $m（rtw88 USB 无线网卡符号被静默丢弃）"
                fail=1
              fi
            done
            echo ">>> rtw88 模块实到：$(find "$root" -name 'rtw88*.ko*' -printf '%f ' 2>/dev/null || true)"
          fi
          if has_cap usb; then
            if [ -z "$usb_found" ]; then
              echo "::error::机型能力含 usb，但 rootfs 里没有 USB 核心栈（usb-common.ko）"
              fail=1
            else
              echo ">>> usb 能力核对通过：$(echo "$usb_found" | head -n1)"
            fi
          else
            if [ -n "$usb_found" ]; then
              echo "::error::机型能力不含 usb，但 rootfs 里带了 USB 栈："
              echo "$usb_found" | sed 's/^/    /'
              fail=1
            else
              echo ">>> 无 usb 能力核对通过：rootfs 里没有 USB 栈"
            fi
          fi
          exit $fail

      - name: Record build provenance (源码 commit + 内核版本)
        run: |
          set -euo pipefail
          mkdir -p output
          kver=$(cat build_dir/target-*/linux-*/include/config/kernel.release 2>/dev/null | head -n1 || true)
          ko=$(find build_dir/target-*/linux-*/ -name '*.ko' -print 2>/dev/null | head -n1 || true)
          ver=""
          [ -n "$ko" ] && ver=$(modinfo -F vermagic "$ko" 2>/dev/null | head -n1 || true)
          pub=$(sha256sum public-key.pem 2>/dev/null | awk '{print $1}' || true)
          {
            echo "device=${{ inputs.device_list }}"
          echo "feature_class=${{ inputs.label }}"
            echo "ponwrt_commit=$(git rev-parse HEAD)"
            echo "kernel_version=${kver:-unknown}"
            echo "kmod_vermagic=${ver:-unknown}"
            echo "config_an7581_sha256=$(sha256sum configs/an7581.config | awk '{print $1}')"
            echo "config_release_sha256=$(sha256sum configs/release.config | awk '{print $1}')"
            echo "config_6_18_sha256=$(sha256sum target/linux/airoha/an7581/config-6.18 | awk '{print $1}')"
            echo "apk_pubkey_sha256=${pub:-none}"
            echo "apk_repo_dir=ponwrt-k${KVER}"
            echo "run=${{ github.run_number }}"
            echo "workflow=${{ github.workflow }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee output/build-info.txt

      - name: Publish provenance baseline to apk repo
        env:
          GH_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::未配置 APK_REPO_TOKEN，跳过基线发布（本次仍随 artifact/Release 记录）"
            exit 0
          fi
          [ -f output/build-info.txt ] || { echo "::warning::没有 build-info.txt，跳过"; exit 0; }
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/ufo1cn/ponwrt-apk-repo.git"
          rm -rf /tmp/apkmeta
          if ! git clone --depth=1 --branch repo "$REPO_URL" /tmp/apkmeta 2>/dev/null; then
            echo "::warning::apk-repo 的 repo 分支还取不到，跳过基线发布"
            exit 0
          fi
          mkdir -p /tmp/apkmeta/meta
          cp -f output/build-info.txt "/tmp/apkmeta/meta/firmware-k${KVER}-$(git rev-parse --short HEAD).txt"
          cp -f output/build-info.txt /tmp/apkmeta/meta/latest.txt
          python3 - "output/build-info.txt" "$KVER" "${{ inputs.device_list }}" > /tmp/apkmeta/meta/firmware.json <<'PY'
          import json,sys
          src,kver,dev=sys.argv[1],sys.argv[2],sys.argv[3]
          d={}
          for line in open(src,encoding="utf-8"):
              if "=" in line:
                  k,v=line.strip().split("=",1); d[k]=v
          d["kernel_version"]=kver; d["devices"]=dev
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY
          cat /tmp/apkmeta/meta/firmware.json
          git -C /tmp/apkmeta add -A
          git -C /tmp/apkmeta -c user.email=ci@ponwrt -c user.name=ponwrt-ci \
            commit -m "meta: firmware k=$KVER run=${{ github.run_number }}" || true
          for i in 1 2 3; do
            if git -C /tmp/apkmeta push origin repo; then echo ">>> 基线已发布到 apk-repo/meta"; exit 0; fi
            git -C /tmp/apkmeta fetch origin repo && git -C /tmp/apkmeta rebase origin/repo || true
          done
          echo "::warning::基线推送失败（不影响固件产物，下一轮巡检会补）"


      - name: Save compiler ccache
        if: always() && inputs.cache_mode != '不使用缓存'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ponwrt-ccache-zn504-${{ hashFiles('configs/*.config') }}-${{ github.sha }}

      - name: Show compiler cache statistics
        if: always() && inputs.cache_mode != '不使用缓存'
        run: |
          [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -s || true

      - name: Verify signing key inside image rootfs
        run: |
          set -euo pipefail
          want=d557dca1a8b8d30b48f7e4b910908342789d389a52db3d7225c6b72840eda4ed
          got=""
          for f in build_dir/target-*/root-*/etc/apk/keys/public-key.pem; do
            [ -f "$f" ] || continue
            got=$(sha256sum "$f" | awk '{print $1}')
            echo ">>> rootfs: $f -> $got"
          done
          if [ -z "$got" ]; then
            echo "::error::rootfs 里找不到 /etc/apk/keys/public-key.pem"
            exit 1
          fi
          if [ "$got" != "$want" ]; then
            echo "::error::镜像内公钥不是固定密钥：got=$got want=$want"
            echo "::error::说明 base-files 仍然命中了旧缓存，需要把该包彻底重编"
            exit 1
          fi
          f2=$(ls build_dir/target-*/root-*/etc/ponwrt-apk-repo.conf 2>/dev/null | head -n1 || true)
          [ -n "$f2" ] || { echo "::error::镜像内缺 /etc/ponwrt-apk-repo.conf"; exit 1; }
          grep -q 'ufo1cn/ponwrt-apk-repo' "$f2" || { echo "::error::仓库地址内容不对"; exit 1; }
          f3=$(ls build_dir/target-*/root-*/etc/apk/repositories.d/90-ponwrt-apk-repo.list 2>/dev/null | head -n1 || true)
          [ -n "$f3" ] || { echo "::error::镜像内缺 90-ponwrt-apk-repo.list"; exit 1; }
          grep -q '^https://raw.githubusercontent.com/ufo1cn/ponwrt-apk-repo' "$f3" \
            || { echo "::error::repositories.d 里的源地址没启用"; exit 1; }
          echo ">>> repositories.d 地址条目也在"
          echo ">>> 镜像自检通过：固定公钥 + 仓库地址都在"

      - name: Organize output files
        run: |
          mkdir -p output
          # 逐 board 取产物：同一个文件名可能同时命中两个 board 名（例如
          # fiberhome_hg5585f-ct 是 fiberhome_hg5585f-ct-usb-sfp 的前缀），
          # 所以取「匹配上的最长 board 名」作为归属，避免 SFP 变体被黑名单误删、
          # 也避免一个文件被算给两个机型。
          matched=""
          for f in bin/targets/airoha/an7581/*; do
            [ -f "$f" ] || continue
            fb=$(basename "$f")
            case "$fb" in
              *sysupgrade*.itb|*recovery*.itb|*manifest) ;;
              *) continue ;;
            esac
            best=""
            for b in $DEVICE_LIST; do
              case "$fb" in
                *"$b"*) [ ${#b} -gt ${#best} ] && best="$b" ;;
              esac
            done
            [ -n "$best" ] || continue
            case " $matched " in *" $best "*) ;; *) matched="$matched $best" ;; esac
            cp -f "$f" output/
          done
          echo ">>> 产物归属机型:${matched:-（无）}"
          echo "MATCHED=$matched" >> "$GITHUB_ENV"
          cd output
          for file in $(ls * 2>/dev/null); do
            [ -f "$file" ] && sha256sum "$file" > "${file}.sha256"
          done
          echo "=== Generated Firmware Artifacts ==="
          ls -lh
          echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV

      - name: Verify requested firmware exists
        run: |
          fail=0
          for b in $DEVICE_LIST; do
            case " ${MATCHED:-} " in
              *" $b "*) echo ">>> ${b} 固件已收集" ;;
              *) echo "::error::缺少机型 ${b} 的固件（产物收集没匹配到，属于静默丢弃）"; fail=1 ;;
            esac
          done
          exit $fail

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-firmware-${{ inputs.label }}-r${{ github.run_number }}
          path: output/*
          retention-days: 14

      - name: Generate release tag
        id: tag
        if: inputs.upload_release
        run: |
          echo "release_tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload firmware to GitHub Release
        uses: softprops/action-gh-release@v2
        if: inputs.upload_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: PonWrt 固件（${{ inputs.label }}）${{ steps.tag.outputs.release_tag }}
          body: |
            ## 本次构建（机型类别 ${{ inputs.label }}）

            - 机型：${{ inputs.device_list }}
            - 机型能力：由 `configs/device-features.txt` 决定，按能力套用 `configs/features/<能力>.config` 片段（usb / wifi / no-wifi）
            - 同一类别内机型能力一致，因此 `=y` 的包不会串到别的类别镜像里
            - 配置来源：`configs/an7581.config` + `configs/release.config`（不含自有包选装）
            - 内核能力来源：`target/linux/airoha/an7581/config-6.18` 的基础设施符号
            - 工作流基线：上游 `build-zn504.yml`（仅改触发方式、机型锁定与产物收集）
            - 内核与 kmod 同源树编译，ABI 与 `build-packages-incremental.yml` 的 apk 一致
            - 源码 commit 与内核版本记录在附件 `build-info.txt`（`ponwrt_commit` / `kernel_version` / `kmod_vermagic`）
          files: output/*

      - name: Publish firmware update index to apk repo
        if: inputs.upload_release
        env:
          GH_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::未配置 APK_REPO_TOKEN，跳过固件更新索引发布"
            exit 0
          fi
          TAG="${{ steps.tag.outputs.release_tag }}"
          [ -n "$TAG" ] || { echo "::warning::没有 tag，跳过索引发布"; exit 0; }
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/ufo1cn/ponwrt-apk-repo.git"
          rm -rf /tmp/fwidx
          if ! git clone --depth=1 --branch repo "$REPO_URL" /tmp/fwidx 2>/dev/null; then
            echo "::warning::apk-repo 的 repo 分支取不到，跳过索引发布"
            exit 0
          fi
          mkdir -p /tmp/fwidx/meta/fw
          commit=$(git rev-parse HEAD)
          kver=$(sed -n 's/^kernel_version=//p' output/build-info.txt 2>/dev/null | head -n1)
          btime=$(sed -n 's/^built_at=//p' output/build-info.txt 2>/dev/null | head -n1)
          python3 - "output" "$TAG" "$commit" "${kver:-unknown}" "${btime:-}" "/tmp/fwidx/meta/fw" "$DEVICE_LIST" <<'PY'
          import json, os, sys
          outdir, tag, commit, kver, btime, idxdir, devices = sys.argv[1:8]
          files = sorted(os.listdir(outdir))
          for dev in devices.split():
              up = None
              for f in files:
                  if f.endswith('.sha256'):
                      continue
                  if dev in f and 'sysupgrade' in f and f.endswith('.itb'):
                      up = f
                      break
              if not up:
                  print('WARN: %s 没有 sysupgrade 产物，跳过索引' % dev)
                  continue
              sha = ''
              shafile = os.path.join(outdir, up + '.sha256')
              if os.path.isfile(shafile):
                  sha = open(shafile, encoding='utf-8').read().split()[0]
              man = None
              for f in files:
                  if f.endswith('.sha256'):
                      continue
                  if dev in f and 'manifest' in f:
                      man = f
                      break
              url = 'https://github.com/ufo1cn/ponwrt-ZN504-HG5585F/releases/download/%s/%s' % (tag, up)
              d = {
                  'schema': 1,
                  'device': dev,
                  'tag': tag,
                  'run': int(os.environ.get('GITHUB_RUN_NUMBER', '0') or 0),
                  'commit': commit,
                  'kernel_version': kver,
                  'built_at': btime,
                  'sysupgrade': {'name': up, 'sha256': sha, 'url': url},
              }
              if man:
                  d['manifest'] = {'name': man, 'url': 'https://github.com/ufo1cn/ponwrt-ZN504-HG5585F/releases/download/%s/%s' % (tag, man)}
              path = os.path.join(idxdir, dev + '.json')
              open(path, 'w', encoding='utf-8').write(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
              print('index ->', path)
          PY
          ls -l /tmp/fwidx/meta/fw
          git -C /tmp/fwidx add -A
          git -C /tmp/fwidx -c user.email=ci@ponwrt -c user.name=ponwrt-ci \
            commit -m "meta(fw): $TAG dev=$DEVICE_LIST" || true
          for i in 1 2 3; do
            if git -C /tmp/fwidx push origin repo; then echo ">>> 固件更新索引已发布：meta/fw/"; exit 0; fi
            git -C /tmp/fwidx fetch origin repo && git -C /tmp/fwidx rebase origin/repo || true
          done
          echo "::warning::固件更新索引推送失败（不影响固件产物，下一轮会补）"
